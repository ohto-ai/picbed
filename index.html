<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicBed 图床</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='11.5' cy='11.5' r='2.4' fill='%23fff'/%3E%3Cpath d='M4.5 22.4l5.6-5.6a2.1 2.1 0 0 1 2.97 0l3.6 3.6 1.9-1.9a2.1 2.1 0 0 1 2.97 0l3.96 3.96v1.44A2.1 2.1 0 0 1 23.4 26H6.6a2.1 2.1 0 0 1-2.1-2.1z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  /* 画布与文字 */
  --bg: #f5f7fb;
  --text: #0f1419;
  --muted: #667085;
  /* 面板与描边（半透明，配合 backdrop-filter 做毛玻璃） */
  --panel: #ffffff;
  --glass: rgba(255, 255, 255, 0.72);
  --glass-strong: rgba(255, 255, 255, 0.90);
  --border: rgba(15, 23, 42, 0.10);
  --border-strong: rgba(15, 23, 42, 0.18);
  /* 品牌：--accent 用于文字/描边（需在浅底上可读），--grad 用于填充面（配白字） */
  --accent: #2563eb;
  --accent-soft: rgba(59, 130, 246, 0.10);
  --grad: linear-gradient(135deg, #3b82f6, #8b5cf6);
  --grad-hover: linear-gradient(135deg, #2563eb, #7c3aed);
  /* 语义色 */
  --danger: #dc2626;
  --danger-soft: rgba(220, 38, 38, 0.10);
  --ok: #16a34a;
  --ok-soft: rgba(22, 163, 74, 0.12);
  /* 分层阴影与圆角 */
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.04);
  --shadow-md: 0 4px 14px rgba(16, 24, 40, 0.08), 0 2px 4px rgba(16, 24, 40, 0.04);
  --shadow-lg: 0 18px 44px rgba(16, 24, 40, 0.16), 0 4px 12px rgba(16, 24, 40, 0.08);
  --shadow: var(--shadow-md);
  --ring: 0 0 0 3px rgba(59, 130, 246, 0.32);
  --radius: 14px;
  --radius-sm: 10px;
  /* 背景光晕：只出现在页面顶部，到图片网格前已衰减到接近透明 */
  --glow-1: rgba(59, 130, 246, 0.20);
  --glow-2: rgba(139, 92, 246, 0.16);
  /* 顶栏高度，由 JS 用 ResizeObserver 写回，供吸顶元素避让 */
  --appbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0d13;
    --text: #e8eaf0;
    --muted: #98a1b3;
    --panel: #161923;
    --glass: rgba(20, 23, 33, 0.72);
    --glass-strong: rgba(20, 23, 33, 0.90);
    --border: rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);
    --accent: #7cb0ff;
    --accent-soft: rgba(96, 165, 250, 0.16);
    --grad: linear-gradient(135deg, #3b82f6, #a855f7);
    --grad-hover: linear-gradient(135deg, #60a5fa, #c084fc);
    --danger: #f87171;
    --danger-soft: rgba(248, 113, 113, 0.14);
    --ok: #4ade80;
    --ok-soft: rgba(74, 222, 128, 0.14);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
    --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 20px 52px rgba(0, 0, 0, 0.6);
    --ring: 0 0 0 3px rgba(124, 176, 255, 0.38);
    --glow-1: rgba(59, 130, 246, 0.22);
    --glow-2: rgba(168, 85, 247, 0.18);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
/* 底色放在 html 上、body 保持透明：这样 body::before 的光晕（z-index:-1）
   才会落在画布底色之上，而不是被 body 自己的背景盖住 */
html { background: var(--bg); }
/* 藏掉页面滚动条：滚轮、触控板、空格键照常滚，只是不再画右侧那条槽。
   矮视口里骨架总归会顶出一点滚动范围，画出来就是一条滚不出任何内容的滚动条。
   注意 ::-webkit-scrollbar 一旦接管就不再占宽度：网格会多出这 15px，
   骨架按 clientWidth 现算，会自己跟上。 */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
body {
  background: transparent;
  color: var(--text);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
/* 背景光晕：两团大半径蓝紫渐变，压在视口顶部，径向衰减到 62% 处已消失 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(680px 420px at 6% -10%, var(--glow-1), transparent 62%),
    radial-gradient(760px 460px at 94% -14%, var(--glow-2), transparent 66%);
}
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px 64px; }

/* 图标：统一 1.15em、1.75 描边，跟随 currentColor。--grad 面上的图标用 .ic-solid */
.ic { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic.ic-solid { fill: currentColor; stroke: none; }
.icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* 顶栏：吸顶毛玻璃，滚动画廊时标签页与 GitHub 入口常驻 */
.appbar {
  position: sticky; top: 0; z-index: 8;
  background: var(--glass);
  border-bottom: 1px solid var(--border);
}
.appbar-inner {
  max-width: 920px; margin: 0 auto; padding: 12px 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo {
  width: 40px; height: 40px; flex: none; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--grad);
  box-shadow: 0 6px 16px rgba(59, 130, 246, 0.32);
}
.logo .ic { width: 22px; height: 22px; color: #fff; }
h1 {
  margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -0.01em;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.brand p { margin: 0; font-size: 12px; color: var(--muted); }
.appbar-spacer { flex: 1; }

/* 视图切换（公开 / 我的相册） */
.tabs { display: flex; gap: 3px; background: var(--glass-strong); border: 1px solid var(--border); border-radius: 11px; padding: 3px; }
.tabs button {
  display: inline-flex; align-items: center; gap: 6px;
  border: none; background: none; color: var(--muted); cursor: pointer;
  font-size: 13px; font-family: inherit; padding: 7px 14px; border-radius: 8px; white-space: nowrap;
  transition: color .16s, background .16s, box-shadow .16s;
}
.tabs button .ic { width: 15px; height: 15px; }
.tabs button:hover { color: var(--text); }
.tabs button.active { background: var(--grad); color: #fff; box-shadow: var(--shadow-sm); }
.view-public .admin-only { display: none !important; }

/* 毛玻璃：不支持 backdrop-filter 时保持上面的不透明底色 */
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  .appbar { -webkit-backdrop-filter: blur(16px) saturate(1.7); backdrop-filter: blur(16px) saturate(1.7); }
}

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  border-radius: var(--radius-sm); padding: 7px 14px; font-size: 13px; font-family: inherit;
  cursor: pointer; white-space: nowrap; text-decoration: none;
  box-shadow: var(--shadow-sm);
  transition: background .16s, border-color .16s, box-shadow .16s, transform .1s, color .16s;
}
.btn:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.btn:active { transform: translateY(1px); box-shadow: var(--shadow-sm); }
.btn:focus-visible { outline: none; box-shadow: var(--ring); }
.btn .ic { width: 15px; height: 15px; }
.btn.primary { background: var(--grad); border-color: transparent; color: #fff; }
.btn.primary:hover { background: var(--grad-hover); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--accent-soft); border-color: transparent; box-shadow: none; }
.btn.small { padding: 4px 10px; font-size: 12px; gap: 4px; }
.btn.small .ic { width: 13px; height: 13px; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); background: var(--danger-soft); }
.btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; transform: none; }

/* 面包屑导航：吸顶，避让顶栏高度 */
.gallery-path {
  position: sticky; top: calc(var(--appbar-h) + 8px); z-index: 6;
  display: flex; align-items: center; flex-wrap: wrap;
  margin: 14px 0 12px; padding: 7px 12px;
  background: var(--glass-strong); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
.gallery-path .crumb {
  display: inline-flex; align-items: center; gap: 6px;
  border: none; background: none; color: var(--accent); cursor: pointer;
  font-size: 13px; font-family: inherit; padding: 4px 10px; border-radius: 7px;
  transition: background .15s;
}
.gallery-path .crumb .ic { width: 14px; height: 14px; }
.gallery-path .crumb:hover { background: var(--accent-soft); }
.gallery-path .sep { color: var(--muted); opacity: .6; font-size: 12px; }
.gallery-path .crumb.current { font-weight: 650; color: var(--text); cursor: default; }
.gallery-path .crumb.current:hover { background: none; }
.gallery-path .crumb.drop-hover { background: var(--accent-soft); outline: 2px dashed var(--accent); outline-offset: -2px; }
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  .gallery-path { -webkit-backdrop-filter: blur(14px) saturate(1.7); backdrop-filter: blur(14px) saturate(1.7); }
}

/* 拖拽移动反馈 */
.grid figure.dragging { opacity: .4; }
.grid figure.drop-hover { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }
.grid figure.drop-hover .folder-icon { transform: scale(1.08); }

/* 全页拖放遮罩 */
#dropOverlay { position: fixed; inset: 0; background: rgba(8, 12, 24, .58); display: flex; align-items: center; justify-content: center; z-index: 70; padding: 20px; pointer-events: none; }
.drop-overlay-box {
  background: var(--glass-strong); border: 2px dashed var(--accent);
  border-radius: var(--radius); padding: 44px 60px; text-align: center; box-shadow: var(--shadow-lg);
}
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  .drop-overlay-box { -webkit-backdrop-filter: blur(18px) saturate(1.7); backdrop-filter: blur(18px) saturate(1.7); }
}
.dz-icon { display: flex; justify-content: center; color: var(--accent); }
.dz-icon .ic { width: 42px; height: 42px; stroke-width: 1.5; }
.drop-overlay-box p { margin: 10px 0 0; }
.dz-hint { font-size: 12px; color: var(--muted); }
.gallery-hint { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }

.urlbar { display: flex; gap: 8px; margin: 14px 0; }
.urlbar input {
  flex: 1; border: 1px solid var(--border); background: var(--panel); color: var(--text);
  border-radius: var(--radius-sm); padding: 9px 13px; font-size: 13px; font-family: inherit; outline: none;
  transition: border-color .16s, box-shadow .16s;
}
.urlbar input:focus { border-color: var(--accent); box-shadow: var(--ring); }

/* 上传队列 */
.q-item {
  display: flex; gap: 12px; align-items: center; background: var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 8px;
  box-shadow: var(--shadow-sm);
}
.q-item.done { border-color: var(--ok); }
.q-item.error { border-color: var(--danger); }
.q-thumb { width: 44px; height: 44px; border-radius: var(--radius-sm); object-fit: cover; background: var(--border); flex-shrink: 0; }
.q-body { flex: 1; min-width: 0; }
.q-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-bar { height: 4px; background: var(--border); border-radius: 2px; margin: 6px 0; overflow: hidden; }
.q-fill { height: 100%; width: 0; background: var(--grad); border-radius: 2px; transition: width .2s; }
.q-status { font-size: 12px; color: var(--muted); }
.q-item.error .q-status { color: var(--danger); cursor: pointer; }

/* 区块标题 */
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 0 10px; }
.section-head h2 { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.section-head h2 .ic { width: 16px; height: 16px; color: var(--muted); }

/* 上传结果 */
.results { display: flex; flex-direction: column; gap: 8px; }
.result { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow-sm); }
.result img { width: 48px; height: 48px; border-radius: var(--radius-sm); object-fit: cover; background: var(--border); flex-shrink: 0; }
.result-info { flex: 1; min-width: 0; }
.result-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-btns { display: flex; gap: 6px; margin-top: 4px; }

/* 历史 */
.history { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 22px; padding: 4px 14px; box-shadow: var(--shadow-sm); }
.history summary { display: flex; align-items: center; gap: 7px; cursor: pointer; padding: 11px 0; font-size: 14px; }
.history summary .ic { width: 15px; height: 15px; color: var(--muted); }
.history-toolbar { text-align: right; padding: 4px 0; }
.history ul { list-style: none; margin: 0; padding: 0 0 10px; }
.history li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
.history li.empty { color: var(--muted); justify-content: center; }
.h-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-time { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.h-btns { display: flex; gap: 4px; flex-shrink: 0; }

/* 相册 */
/* 顶栏是 sticky 且空贴 .wrap 顶部，管理视图下工具栏是首个可见元素，给它留出上边距 */
.gallery-toolbar { display: flex; align-items: center; gap: 8px; margin: 16px 0 12px; flex-wrap: wrap; }
.gallery-spacer { flex: 1; }
#selectModeBtn.active { background: var(--grad); border-color: transparent; color: #fff; }
#galleryCount { color: var(--muted); font-size: 12px; }

.bulk-bar {
  position: sticky; top: calc(var(--appbar-h) + 58px); z-index: 5;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--glass-strong); border: 1px solid var(--accent);
  border-radius: var(--radius); padding: 8px 14px; margin-bottom: 10px;
  box-shadow: var(--shadow-md);
}
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  .bulk-bar { -webkit-backdrop-filter: blur(14px) saturate(1.7); backdrop-filter: blur(14px) saturate(1.7); }
}
#bulkCount { font-size: 13px; color: var(--muted); }

.folder-tile { cursor: pointer; }
.folder-tile .folder-icon {
  width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--accent-soft), transparent 70%);
  transition: transform .16s;
}
.folder-tile .folder-icon .ic { width: 46px; height: 46px; stroke-width: 1.4; color: var(--accent); opacity: .85; }
.folder-tile:hover .folder-icon .ic { opacity: 1; }
.folder-tile .folder-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity .14s; z-index: 2; }
.folder-tile:hover .folder-actions, .folder-tile:focus-within .folder-actions { opacity: 1; }
.folder-tile .folder-actions button {
  display: grid; place-items: center; width: 26px; height: 26px;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  border-radius: 7px; cursor: pointer; padding: 0; box-shadow: var(--shadow-sm);
}
.folder-tile .folder-actions button:hover { border-color: var(--accent); color: var(--accent); }
.folder-tile .folder-actions .ic { width: 14px; height: 14px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
/* 固定高度：加载中的转圈与「已显示 N 张」共用这一行。
   高度写死 + 两者互斥显示，切换时行高不变，下面的网格顶边才不会跳动。 */
.gallery-meta {
  display: flex; align-items: center; gap: 7px;
  height: 20px; margin: -4px 0 10px;
  font-size: 12px; line-height: 1; color: var(--muted);
}
.gallery-meta .spin { width: 13px; height: 13px; }
.gallery-busy { display: inline-flex; align-items: center; gap: 7px; }
.gallery-empty {
  grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 10px;
  text-align: center; color: var(--muted); font-size: 13px; padding: 46px 16px; line-height: 1.7;
}
.gallery-empty .ic { width: 30px; height: 30px; stroke-width: 1.4; opacity: .45; }
/* 图片卡片上的公开切换按钮 */
.grid figure .pub-toggle {
  position: absolute; top: 6px; right: 6px; z-index: 2;
  display: grid; place-items: center; width: 27px; height: 27px;
  border: 1px solid var(--border); background: var(--glass-strong); color: var(--text);
  border-radius: 8px; cursor: pointer; padding: 0;
  box-shadow: var(--shadow-sm); opacity: 0; transition: opacity .14s, color .14s, border-color .14s;
}
.grid figure:hover .pub-toggle, .grid figure:focus-within .pub-toggle { opacity: 1; }
/* 公开状态由文件名前的 pub 徽标表达，按钮只在悬停时出现；.on 仅保留高亮样式 */
.grid figure .pub-toggle.on { border-color: transparent; background: var(--grad); color: #fff; }
.grid figure .pub-toggle:disabled { opacity: .5; cursor: not-allowed; }
.grid figure .pub-toggle .ic { width: 15px; height: 15px; }
.grid figure {
  position: relative; margin: 0; background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; cursor: zoom-in;
  box-shadow: var(--shadow-sm);
  transition: transform .16s, box-shadow .16s, border-color .16s;
}
.grid figure:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--border-strong); }
.grid figure.selected { outline: 2px solid var(--accent); outline-offset: -1px; }
.grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--border); }
.grid figcaption { display: flex; align-items: center; font-size: 12px; color: var(--muted); padding: 6px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel-check {
  position: absolute; top: 6px; left: 6px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--glass-strong); border: 1.5px solid var(--border-strong); z-index: 2;
  display: grid; place-items: center; color: transparent; transition: background .14s, border-color .14s, color .14s;
}
.sel-check .ic { width: 12px; height: 12px; stroke-width: 2.5; }
.grid figure.selected .sel-check { background: var(--grad); border-color: transparent; color: #fff; }
.grid figure.selectable { cursor: pointer; }
/* 文件名前的公开状态徽标 */
.pub-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; line-height: 1.5; color: #fff; background: var(--ok); border-radius: 7px; padding: 0 6px; margin-right: 5px; flex: none; }
/* 多选模式下的拖动框选 */
#marquee { position: fixed; z-index: 65; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 4px; pointer-events: none; }
body.marqueeing { user-select: none; -webkit-user-select: none; }
body.marqueeing .grid figure { cursor: default; transform: none; }
/* 右键菜单 */
#ctxMenu {
  position: fixed; z-index: 90; background: var(--glass-strong); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow-lg); padding: 5px; min-width: 186px;
}
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  #ctxMenu { -webkit-backdrop-filter: blur(16px) saturate(1.7); backdrop-filter: blur(16px) saturate(1.7); }
}
#ctxMenu button {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  border: none; background: none; color: var(--text); font-size: 13px; font-family: inherit;
  padding: 7px 10px; border-radius: 7px; cursor: pointer;
}
#ctxMenu button .ic { width: 15px; height: 15px; color: var(--muted); }
#ctxMenu button:hover { background: var(--accent-soft); color: var(--accent); }
#ctxMenu button:hover .ic { color: var(--accent); }
#ctxMenu button.danger { color: var(--danger); }
#ctxMenu button.danger .ic { color: var(--danger); }
#ctxMenu button.danger:hover { background: var(--danger-soft); }
#ctxMenu .ctx-sep { height: 1px; background: var(--border); margin: 4px 8px; }
.gallery-more { text-align: center; margin-top: 16px; }

/* 设置弹窗 */
/* z-index 70：必须盖过灯箱（60），灯箱里点删除弹出的确认框才可见 */
.dialog { position: fixed; inset: 0; background: rgba(8, 12, 24, .48); display: flex; align-items: center; justify-content: center; z-index: 70; padding: 16px; }
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  .dialog { -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
}
.dialog-box {
  background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
  padding: 22px 24px; width: 100%; max-width: 420px; box-shadow: var(--shadow-lg);
}
.dialog-box h2 { display: flex; align-items: center; gap: 9px; margin: 0 0 14px; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
.dialog-box h2 .ic { width: 18px; height: 18px; color: var(--accent); }
.dialog-box p { margin: 0 0 14px; color: var(--muted); word-break: break-all; }
.dup-preview { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
.dup-side { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.dup-side img { width: 110px; height: 110px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--border); }
.dup-arrow { display: flex; color: var(--muted); }
.dup-arrow .ic { width: 18px; height: 18px; }
.dup-compare { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; }
.dup-compare .ic { width: 14px; height: 14px; stroke-width: 2.2; }
.dup-compare.same { color: var(--ok); }
.dup-compare.diff { color: var(--danger); }
.dup-apply { margin: 0 0 12px; }
.field { display: block; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
.field .req { color: var(--danger); }
.field input, .field select {
  width: 100%; margin-top: 4px; border: 1px solid var(--border); background: var(--panel);
  color: var(--text); border-radius: var(--radius-sm); padding: 9px 11px;
  font-size: 13px; font-family: inherit; outline: none;
  transition: border-color .16s, box-shadow .16s;
}
.field input:focus, .field select:focus { border-color: var(--accent); box-shadow: var(--ring); }
.field .hint { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.btn.danger-solid { background: var(--danger); border-color: transparent; color: #fff; }
.btn.danger-solid:hover { filter: brightness(1.1); }

/* 目录树（弹窗内选相册） */
.tree { max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 8px; margin-top: 6px; background: var(--bg); }
.tree ul { list-style: none; margin: 0; padding-left: 14px; }
.tree > ul { padding-left: 0; }
.tree-empty { font-size: 12px; color: var(--muted); padding: 4px 2px; }
.tree-row { display: flex; align-items: center; }
.tree-caret { display: grid; place-items: center; border: none; background: none; color: var(--muted); cursor: pointer; padding: 3px; line-height: 1; transition: transform .14s; }
.tree-caret .ic { width: 12px; height: 12px; }
.tree-caret.open { transform: rotate(90deg); }
.tree-caret.leaf { visibility: hidden; cursor: default; }
.tree-label {
  display: flex; align-items: center; gap: 7px;
  border: none; background: none; color: var(--text); cursor: pointer; font-size: 13px; font-family: inherit;
  padding: 4px 7px; border-radius: 7px; text-align: left; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tree-label .ic { width: 14px; height: 14px; color: var(--muted); }
.tree-label:hover { background: var(--accent-soft); color: var(--accent); }
.tree-label:hover .ic { color: var(--accent); }

/* 灯箱 */
.lightbox { position: fixed; inset: 0; background: rgba(6, 9, 18, .80); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  .lightbox { -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
}
.lightbox-box { position: relative; max-width: min(920px, 94vw); max-height: 92vh; display: flex; flex-direction: column; gap: 10px; }
.lightbox img { max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: var(--radius); background: rgba(0, 0, 0, .35); }
.lightbox-close {
  position: absolute; top: -14px; right: -14px; width: 36px; height: 36px;
  display: grid; place-items: center; border-radius: 50%;
  border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer;
  box-shadow: var(--shadow-md); transition: border-color .16s, color .16s;
}
.lightbox-close:hover { border-color: var(--accent); color: var(--accent); }
.lightbox-close .ic { width: 16px; height: 16px; }
.lightbox-info { display: flex; flex-direction: column; gap: 8px; align-items: center; }
/* 大图进度：放在信息区而不是压在照片上 —— 原图多 MB，这是全站最需要反馈的地方 */
.lb-dl { display: flex; align-items: center; gap: 10px; width: min(420px, 70vw); }
.lb-dl-bar { flex: 1; height: 4px; background: rgba(255, 255, 255, .16); border-radius: 2px; overflow: hidden; }
.lb-dl-bar b { display: block; height: 100%; width: 0; background: var(--grad); border-radius: 2px; transition: width .2s; }
.lb-dl.indet .lb-dl-bar b { opacity: .45; } /* 总长未知：条走满但不报数字 */
.lb-dl-text { font-size: 12px; color: #cbd5e1; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
.lightbox-name { font-size: 12px; color: #cbd5e1; word-break: break-all; text-align: center; }
.lightbox-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.lightbox-actions .btn { background: rgba(255, 255, 255, .10); border-color: rgba(255, 255, 255, .18); color: #eef1f7; box-shadow: none; }
.lightbox-actions .btn:hover { background: rgba(255, 255, 255, .18); border-color: rgba(255, 255, 255, .3); }
.lightbox-actions .btn.on { background: rgba(255, 255, 255, .24); border-color: rgba(255, 255, 255, .38); color: #fff; }
.lightbox-actions .btn.danger { color: #fca5a5; }
.lightbox-actions .btn.danger:hover { background: rgba(248, 113, 113, .18); border-color: rgba(248, 113, 113, .4); }

/* Toast */
#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: var(--glass-strong); color: var(--text); padding: 10px 20px;
  border: 1px solid var(--border); border-radius: 22px;
  font-size: 13px; opacity: 0; pointer-events: none;
  box-shadow: var(--shadow-lg); transition: opacity .25s, transform .25s; z-index: 80; max-width: 90vw;
}
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  #toast { -webkit-backdrop-filter: blur(16px) saturate(1.7); backdrop-filter: blur(16px) saturate(1.7); }
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { background: var(--danger); border-color: transparent; color: #fff; }

/* 上传状态悬浮按钮 + 面板 */
.upload-fab {
  position: fixed; right: 20px; bottom: 24px; z-index: 40;
  width: 54px; height: 54px; border-radius: 50%; border: 1px solid transparent;
  background: var(--grad); color: #fff; cursor: pointer;
  box-shadow: 0 8px 22px rgba(59, 130, 246, .38);
  display: flex; align-items: center; justify-content: center;
  transition: transform .14s, box-shadow .16s;
}
.upload-fab .ic { width: 22px; height: 22px; }
.upload-fab:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(59, 130, 246, .46); }
.upload-fab.idle { background: var(--glass-strong); color: var(--text); border-color: var(--border); box-shadow: var(--shadow-md); }
.fab-badge {
  position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px;
  border-radius: 10px; background: var(--danger); color: #fff; font-size: 11px; line-height: 20px;
  text-align: center; font-weight: 600;
}
.fab-badge.ok { background: var(--ok); }
.fab-badge.idle { display: none; }
#panelBackdrop { position: fixed; inset: 0; z-index: 39; background: transparent; }
.upload-panel {
  position: fixed; right: 16px; bottom: 92px; z-index: 40;
  width: min(380px, calc(100vw - 32px)); max-height: min(70vh, 640px); overflow-y: auto;
  background: var(--glass-strong); border: 1px solid var(--border);
  border-radius: 18px; box-shadow: var(--shadow-lg); padding: 14px 16px;
}
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  .upload-panel { -webkit-backdrop-filter: blur(20px) saturate(1.7); backdrop-filter: blur(20px) saturate(1.7); }
}
.panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.panel-head h2 { display: flex; align-items: center; gap: 7px; margin: 0; font-size: 15px; font-weight: 650; }
.panel-head h2 .ic { width: 16px; height: 16px; color: var(--accent); }
.panel-badge { font-size: 12px; color: var(--muted); }
.panel-close { display: grid; place-items: center; border: none; background: none; color: var(--muted); cursor: pointer; padding: 5px; border-radius: 7px; }
.panel-close .ic { width: 15px; height: 15px; }
.panel-close:hover { background: var(--accent-soft); color: var(--text); }
.upload-panel .history { margin-top: 14px; background: transparent; border: none; box-shadow: none; padding: 0; }
.upload-panel .section-head { margin: 14px 0 8px; }
.upload-panel .section-head h2 { font-size: 14px; }
.upload-panel:empty { display: none; }

/* ---------- 加载指示 ---------- */
/* 顶部不定长进度条：<body> 直接子元素，用 transform 走合成层 */
.page-progress {
  position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 100;
  overflow: hidden; pointer-events: none; opacity: 0; transition: opacity .2s;
}
.page-progress.on { opacity: 1; }
.page-progress i {
  display: block; width: 40%; height: 100%; border-radius: 0 3px 3px 0;
  background: var(--grad); transform: translateX(-100%);
  animation: pb-slide 1.15s cubic-bezier(.4, 0, .2, 1) infinite;
}
@keyframes pb-slide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }

/* 转圈：用在 .gallery-meta 与「加载更多」按钮里 */
.spin {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 2px solid var(--border-strong); border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
.btn .spin { width: 13px; height: 13px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 骨架卡片：刻意用 div 而非 figure —— 多选/框选/公开徽标都会扫 #galleryGrid figure */
.sk-tile { border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border); overflow: hidden; }
.sk-tile .sk-img { aspect-ratio: 1; }
.sk-tile .sk-cap { height: 10px; margin: 10px 9px; border-radius: 5px; }
.sk-tile .sk-img, .sk-tile .sk-cap {
  background: linear-gradient(100deg, var(--border) 30%, var(--accent-soft) 50%, var(--border) 70%);
  background-size: 220% 100%; animation: shimmer 1.3s linear infinite;
}

/* 缩略图骨架：挂在 figure 上而非 img（img 是替换元素，不渲染 ::before）。
   自取（见「缩略图下载与进度」）时摘得早：第一帧模糊图到手就摘，不再等整张下完。 */
.grid figure img { transition: opacity .3s ease; }
.grid figure.ph img { opacity: 0; }
.grid figure.ph::before {
  content: ''; position: absolute; left: 0; right: 0; top: 0; aspect-ratio: 1; z-index: 1;
  background: linear-gradient(100deg, var(--border) 30%, var(--accent-soft) 50%, var(--border) 70%);
  background-size: 220% 100%; animation: shimmer 1.3s linear infinite;
}
@keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }

/* 卡片下载进度：挂在 figure 上，用和 shimmer 同一招（left/right/top + aspect-ratio:1）
   自成一个「图片区」覆盖层 —— 这样不必给 img 套 wrapper，卡片的布局、拖拽、框选都不受影响 */
.grid figure .dl {
  position: absolute; left: 0; right: 0; top: 0; aspect-ratio: 1; z-index: 2;
  display: grid; place-items: center; pointer-events: none; /* 不能挡住点开大图 */
  opacity: 0; transition: opacity .18s;
}
.grid figure .dl.on { opacity: 1; }
.grid figure .dl-pct {
  padding: 3px 7px; border-radius: 8px; font-size: 12px; line-height: 1;
  font-variant-numeric: tabular-nums; /* 数字等宽，跳动时不左右抖 */
  background: var(--glass-strong); border: 1px solid var(--border); color: var(--text);
  box-shadow: var(--shadow-sm);
}
.grid figure .dl-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(0, 0, 0, .28); }
.grid figure .dl-bar b { display: block; height: 100%; width: 0; background: var(--grad); transition: width .2s; }
/* 总长未知（没有 Content-Length）：条走满但不报数字，别编一个 */
.grid figure .dl.indet .dl-bar b { opacity: .45; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .page-progress i { width: 100%; transform: none; animation: none; background: var(--grad); }
  .sk-tile .sk-img, .sk-tile .sk-cap, .grid figure.ph::before { background-image: none; background-color: var(--border); }
}
</style>
</head>

<header class="appbar">
  <div class="appbar-inner">
