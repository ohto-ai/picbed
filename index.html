<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicBed 图床</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%BC%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f6f8;
  --panel: #ffffff;
  --text: #1a1d24;
  --muted: #6b7280;
  --border: #e4e7ec;
  --accent: #2563eb;
  --accent-strong: #1d4ed8;
  --accent-soft: rgba(37, 99, 235, 0.10);
  --danger: #dc2626;
  --ok: #16a34a;
  --shadow: 0 2px 8px rgba(16, 24, 40, 0.08);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12141a;
    --panel: #1b1e27;
    --text: #e6e8ee;
    --muted: #8b93a5;
    --border: #2a2f3d;
    --accent: #3b82f6;
    --accent-strong: #60a5fa;
    --accent-soft: rgba(59, 130, 246, 0.16);
    --danger: #f87171;
    --ok: #4ade80;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px 64px; }

/* 头部 */
header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 12px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { font-size: 30px; }
h1 { margin: 0; font-size: 20px; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }

/* 按钮 */
.btn {
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-strong); }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn:disabled { opacity: .6; cursor: not-allowed; }

/* 面包屑导航（GitHub 风格，紧贴图片上方并吸顶） */
.gallery-path { position: sticky; top: 8px; z-index: 6; display: flex; align-items: center; flex-wrap: wrap; font-size: 16px; margin: 14px 0 12px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
.gallery-path .crumb { border: none; background: none; color: var(--accent); cursor: pointer; font-size: 15px; padding: 3px 10px; border-radius: 6px; }
.gallery-path .crumb:hover { background: var(--accent-soft); }
.gallery-path .sep { color: var(--muted); }
.gallery-path .crumb.current { font-weight: 700; color: var(--text); cursor: default; }
.gallery-path .crumb.current:hover { background: none; }

/* 全页拖放遮罩 */
#dropOverlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; z-index: 70; padding: 20px; }
.drop-overlay-box { background: var(--panel); border: 3px dashed var(--accent); border-radius: var(--radius); padding: 48px 64px; text-align: center; }
.dz-icon { font-size: 40px; }
.drop-overlay-box p { margin: 8px 0 0; }
.dz-hint { font-size: 12px; color: var(--muted); }
.gallery-hint { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }

.urlbar { display: flex; gap: 8px; margin: 14px 0; }
.urlbar input {
  flex: 1; border: 1px solid var(--border); background: var(--panel); color: var(--text);
  border-radius: 8px; padding: 8px 12px; font-size: 13px; outline: none;
}
.urlbar input:focus { border-color: var(--accent); }

/* 上传队列 */
.q-item {
  display: flex; gap: 12px; align-items: center; background: var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 8px;
}
.q-item.done { border-color: var(--ok); }
.q-item.error { border-color: var(--danger); }
.q-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--border); flex-shrink: 0; }
.q-body { flex: 1; min-width: 0; }
.q-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-bar { height: 4px; background: var(--border); border-radius: 2px; margin: 6px 0; overflow: hidden; }
.q-fill { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .2s; }
.q-status { font-size: 12px; color: var(--muted); }
.q-item.error .q-status { color: var(--danger); cursor: pointer; }

/* 区块标题 */
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 10px; }
.section-head h2 { font-size: 15px; margin: 0; }

/* 上传结果 */
.results { display: flex; flex-direction: column; gap: 8px; }
.result { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }
.result img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--border); flex-shrink: 0; }
.result-info { flex: 1; min-width: 0; }
.result-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-btns { display: flex; gap: 6px; margin-top: 4px; }

/* 历史 */
.history { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 22px; padding: 4px 14px; }
.history summary { cursor: pointer; padding: 10px 0; font-size: 14px; }
.history-toolbar { text-align: right; padding: 4px 0; }
.history ul { list-style: none; margin: 0; padding: 0 0 10px; }
.history li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
.history li.empty { color: var(--muted); justify-content: center; }
.h-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-time { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.h-btns { display: flex; gap: 4px; flex-shrink: 0; }

/* 相册 */
.gallery-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.gallery-toolbar .check { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }
.gallery-spacer { flex: 1; }
.gallery-path { font-size: 13px; color: var(--muted); display: inline-flex; gap: 2px; align-items: center; }
.gallery-path .crumb { border: none; background: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 0 2px; }
#selectModeBtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
#galleryCount { color: var(--muted); font-size: 12px; }

.bulk-bar { position: sticky; top: 58px; z-index: 5; display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
#bulkCount { font-size: 13px; }

.folder-tile { cursor: pointer; }
.folder-tile .folder-icon { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 54px; background: linear-gradient(135deg, var(--accent-soft), transparent); }
.folder-tile .folder-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity .12s; z-index: 2; }
.folder-tile:hover .folder-actions { opacity: 1; }
.folder-tile .folder-actions button { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; cursor: pointer; font-size: 13px; padding: 2px 7px; box-shadow: var(--shadow); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.grid figure { position: relative; margin: 0; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: zoom-in; transition: transform .12s, box-shadow .12s; }
.grid figure:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.grid figure.selected { outline: 2px solid var(--accent); }
.grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--border); }
.grid figcaption { font-size: 12px; color: var(--muted); padding: 5px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel-check { position: absolute; top: 6px; left: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); border: 2px solid var(--border); z-index: 2; }
.grid figure.selected .sel-check { background: var(--accent); border-color: var(--accent); }
.grid figure.selected .sel-check::after { content: '✓'; color: #fff; font-size: 11px; position: absolute; top: -1px; left: 2px; }
.gallery-more { text-align: center; margin-top: 14px; }

/* 设置弹窗 */
.dialog { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.dialog-box { background: var(--panel); border-radius: var(--radius); padding: 20px 22px; width: 100%; max-width: 420px; box-shadow: var(--shadow); }
.dialog-box h2 { margin: 0 0 14px; font-size: 16px; }
.dialog-box p { margin: 0 0 14px; color: var(--muted); word-break: break-all; }
.dup-preview { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
.dup-side { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.dup-side img { width: 110px; height: 110px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); background: var(--border); }
.dup-arrow { font-size: 18px; color: var(--muted); }
.dup-compare { font-size: 12px; font-weight: 600; }
.dup-compare.same { color: var(--ok); }
.dup-compare.diff { color: var(--danger); }
.dup-apply { margin: 0 0 12px; }
.field { display: block; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
.field .req { color: var(--danger); }
.field input, .field select {
  width: 100%; margin-top: 4px; border: 1px solid var(--border); background: var(--bg);
  color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

/* 灯箱 */
.lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .75); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
.lightbox-box { position: relative; max-width: min(920px, 94vw); max-height: 92vh; display: flex; flex-direction: column; gap: 10px; }
.lightbox img { max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: var(--radius); background: #000; }
.lightbox-close { position: absolute; top: -12px; right: -12px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; font-size: 15px; }
.lightbox-info { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.lightbox-name { font-size: 12px; color: #cbd5e1; word-break: break-all; text-align: center; }
.lightbox-actions { display: flex; gap: 8px; }

/* Toast */
#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 9px 18px; border-radius: 20px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 80; max-width: 90vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="logo">🖼️</span>
      <div>
        <h1>PicBed 图床</h1>
        <p id="bucketInfo"></p>
      </div>
    </div>
    <button id="settingsBtn" class="btn ghost">⚙️ 设置</button>
  </header>

  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <input type="file" id="dirInput" webkitdirectory directory multiple hidden>

  <div class="gallery-toolbar">
    <button id="uploadBtn" class="btn primary">⬆️ 上传到当前目录</button>
    <button id="uploadDirBtn" class="btn">📂 上传文件夹</button>
    <button id="newAlbumBtn" class="btn">📁 新建相册</button>
    <button id="selectModeBtn" class="btn">☑️ 多选</button>
    <button id="refreshGallery" class="btn">🔄 刷新</button>
    <span class="gallery-spacer"></span>
    <label class="check"><input type="checkbox" id="thumbMode"> 缩略图</label>
    <span id="galleryCount"></span>
  </div>
  <div class="gallery-hint">拖拽图片或整个文件夹到页面任意位置即可上传（自动递归、仅图片）· 支持 Ctrl+V 粘贴 · 单张 ≤ 50MB</div>

  <div class="urlbar">
    <input id="urlInput" type="text" placeholder="粘贴任意图片 URL，点「转存」保存到图床…">
    <button id="urlBtn" class="btn">转存</button>
  </div>

  <div id="bulkBar" class="bulk-bar" hidden>
    <span id="bulkCount"></span>
    <button id="bulkMoveBtn" class="btn small">📦 移动到相册</button>
    <button id="bulkDeleteBtn" class="btn small danger">批量删除</button>
    <button id="bulkCancelBtn" class="btn small ghost">取消选择</button>
  </div>

  <div id="galleryPath" class="gallery-path"></div>

  <div id="galleryGrid" class="grid"></div>
  <div class="gallery-more"><button id="loadMore" class="btn" hidden>加载更多</button></div>

  <div id="queue"></div>

  <div id="resultsSection" hidden>
    <div class="section-head">
      <h2>本次上传</h2>
      <button id="copyAllBtn" class="btn small">复制全部（当前格式）</button>
    </div>
    <div id="results" class="results"></div>
  </div>

  <details id="historyBox" class="history">
    <summary>📋 上传历史（仅存本机浏览器）</summary>
    <div class="history-toolbar"><button id="clearHistory" class="btn small danger">清空记录</button></div>
    <ul id="historyList"></ul>
  </details>

  <div id="dropOverlay" hidden>
    <div class="drop-overlay-box">
      <div class="dz-icon">⬆️</div>
      <p id="dropTargetLabel">松开鼠标，上传到当前目录</p>
      <p class="dz-hint">支持整个文件夹（自动递归、仅图片）· 支持批量 · Ctrl+V 粘贴也可以</p>
    </div>
  </div>
</div>

<div id="settingsDialog" class="dialog" hidden>
  <div class="dialog-box">
    <h2>⚙️ 设置</h2>
    <label class="field">Worker 地址 <span class="req">*</span>
      <input id="setWorker" type="text" placeholder="https://picbed-worker.xxx.workers.dev">
    </label>
    <label class="field">上传密码（可选，与 Worker 的 PICBED_PASSWORD 一致）
      <input id="setPassword" type="password" placeholder="不设置密码请留空">
    </label>
    <label class="field">图片访问域名（可选，留空用 COS 默认域名）
      <input id="setDomain" type="text" placeholder="https://album.ohtoai.top">
    </label>
    <label class="field">默认链接格式
      <select id="setFormat">
        <option value="url">URL 直链</option>
        <option value="markdown">Markdown</option>
        <option value="html">HTML</option>
      </select>
    </label>
    <label class="field">故障诊断
      <button id="probeBtn" class="btn small" type="button" style="margin-top:6px;">诊断 Worker 密钥的 COS 权限</button>
      <pre id="probeResult" style="margin-top:6px;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:11px;max-height:140px;overflow:auto;white-space:pre-wrap;word-break:break-all;">尚未诊断</pre>
    </label>
    <div class="dialog-actions">
      <button id="saveSettings" class="btn primary">保存</button>
      <button id="closeSettings" class="btn ghost">取消</button>
    </div>
  </div>
</div>

<div id="dupDialog" class="dialog" hidden>
  <div class="dialog-box">
    <h2>⚠️ 文件冲突</h2>
    <div id="dupPreview" class="dup-preview" hidden>
      <div class="dup-side">
        <img id="dupNewImg" alt="新文件">
        <span>新文件（待上传）</span>
      </div>
      <span class="dup-arrow">→</span>
      <div class="dup-side">
        <img id="dupOldImg" alt="现有文件">
        <span>现有文件</span>
      </div>
    </div>
    <p id="dupCompare" class="dup-compare"></p>
    <p id="dupMsg"></p>
    <label class="check dup-apply"><input type="checkbox" id="dupApplyAll"> 对后续所有文件应用此选择</label>
    <div class="dialog-actions">
      <button id="dupOverwrite" class="btn primary">覆盖</button>
      <button id="dupRename" class="btn">自动重命名</button>
      <button id="dupSkip" class="btn ghost">跳过</button>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox" hidden>
  <div class="lightbox-box">
    <button id="lightboxClose" class="lightbox-close" title="关闭">✕</button>
    <img id="lightboxImg" alt="">
    <div class="lightbox-info">
      <div id="lightboxName" class="lightbox-name"></div>
      <div class="lightbox-actions">
        <button class="btn small" data-fmt="url">URL</button>
        <button class="btn small" data-fmt="markdown">Markdown</button>
        <button class="btn small" data-fmt="html">HTML</button>
        <button class="btn small danger" id="deleteBtn">删除</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cos-js-sdk-v5@1/dist/cos-js-sdk-v5.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------- 配置 ----------
  const DEFAULTS = {
    worker: '', bucket: 'album-1255316209', region: 'ap-shanghai',
    prefix: 'img', customDomain: '', maxKeys: 500,
    format: 'url', password: '', thumb: false,
  };
  let cfg = Object.assign({}, DEFAULTS, window.PICBED_CONFIG || {});
  const STORE_KEY = 'picbed_settings';
  try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) {}

  function saveSettings() {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      worker: cfg.worker, password: cfg.password,
      customDomain: cfg.customDomain, format: cfg.format, thumb: cfg.thumb,
    }));
  }

  // ---------- 通用 ----------
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const FMT = ['url', 'markdown', 'html'];
  const FMT_LABEL = { url: 'URL', markdown: 'MD', html: 'HTML' };
  const IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'avif', 'bmp', 'ico'];
  const TYPE_BY_EXT = {
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif',
    webp: 'image/webp', svg: 'image/svg+xml', avif: 'image/avif', bmp: 'image/bmp', ico: 'image/x-icon',
  };

  function toast(msg, isError) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.className = ''; }, 2600);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('已复制');
  }

  function authHeaders() {
    const h = { 'content-type': 'application/json' };
    if (cfg.password) h['x-picbed-key'] = cfg.password;
    return h;
  }

  function listHeaders() {
    const h = {};
    if (cfg.password) h['x-picbed-key'] = cfg.password;
    return h;
  }

  function baseUrl() {
    return (cfg.customDomain || `https://${cfg.bucket}.cos.${cfg.region}.myqcloud.com`).replace(/\/+$/, '');
  }
  function publicUrl(key) { return `${baseUrl()}/${key}`; }

  function needWorker() {
    if (cfg.worker) return true;
    openSettings();
    toast('请先在设置中填写 Worker 地址', true);
    return false;
  }

  function makeLinks(url, name) {
    const alt = String(name || 'image').replace(/[\[\]()]/g, '');
    return { url, markdown: `![${alt}](${url})`, html: `<img src="${url}" alt="${alt}" />` };
  }

  const TYPE_EXT_MAP = {
    'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/webp': 'webp',
    'image/svg+xml': 'svg', 'image/avif': 'avif', 'image/bmp': 'bmp', 'image/x-icon': 'ico',
  };

  function sanitizeSegment(seg) {
    return String(seg || '').trim().replace(/[\\:*?"<>|]+/g, '_').replace(/^\.+$/, '');
  }

  // relPath 支持子目录（文件夹上传时保留目录结构）
  function makeKey(relPath, type) {
    const parts = String(relPath || '').replace(/\\/g, '/').split('/').filter(Boolean).map(sanitizeSegment).filter(Boolean);
    let name = parts.pop() || '';
    if (!name || name === '_') name = 'image_' + Math.random().toString(36).slice(2, 8) + '.' + (TYPE_EXT_MAP[type] || 'bin');
    return galleryPrefix + (parts.length ? parts.join('/') + '/' : '') + name;
  }

  function errMsg(e) {
    if (!e) return '未知错误';
    if (typeof e === 'string') return e;
    if (e.message) return e.message;
    if (e.error) {
      if (typeof e.error === 'string') return e.error;
      if (e.error.Message) return e.error.Message;
      if (e.error.Code) return 'COS 错误 ' + e.error.Code;
    }
    if (e.statusCode) return 'HTTP ' + e.statusCode;
    try { return JSON.stringify(e); } catch (x) { return '未知错误'; }
  }

  function isImageFile(f) {
    if (f.type && f.type.startsWith('image/')) return true;
    return IMAGE_EXTS.includes((f.name.split('.').pop() || '').toLowerCase());
  }

  // ---------- COS SDK（临时密钥） ----------
  let tokenCache = null;
  async function fetchToken() {
    const now = Date.now() / 1000;
    if (tokenCache && tokenCache.expiredTime > now + 120) return tokenCache;
    const res = await fetch(`${cfg.worker}/token`, { method: 'POST', headers: authHeaders() });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '获取上传凭证失败');
    tokenCache = data;
    return data;
  }

  const cos = new COS({
    getAuthorization(options, callback) {
      fetchToken()
        .then((d) => callback({
          TmpSecretId: d.credentials.tmpSecretId,
          TmpSecretKey: d.credentials.tmpSecretKey,
          SecurityToken: d.credentials.sessionToken,
          StartTime: Math.floor(Date.now() / 1000),
          ExpiredTime: d.expiredTime,
        }))
        .catch((e) => {
          toast(e.message, true);
          if (String(e.message).includes('密码')) openSettings();
          callback(null);
        });
    },
  });

  // ---------- 上传 ----------
  const queue = [];
  let processing = false;

  function addFiles(files) {
    if (!needWorker()) return;
    let added = 0;
    let skippedNonImage = 0;
    let skippedTooBig = 0;
    for (const f of files) {
      if (!isImageFile(f)) { skippedNonImage++; continue; }
      if (f.size > 50 * 1024 * 1024) { skippedTooBig++; continue; }
      enqueue(f);
      added++;
    }
    if (skippedNonImage) toast(`已跳过 ${skippedNonImage} 个非图片文件`, true);
    if (skippedTooBig) toast(`已跳过 ${skippedTooBig} 个超过 50MB 的文件`, true);
    if (added) processQueue();
    else if (!skippedNonImage && !skippedTooBig) toast('没有找到可上传的图片', true);
  }

  // 递归收集拖入的文件夹里的图片（保留相对路径）
  function readEntry(entry, parentPath, out) {
    return new Promise((resolve) => {
      if (!entry) return resolve();
      if (entry.isFile) {
        entry.file((f) => {
          if (f && isImageFile(f)) {
            try { Object.defineProperty(f, '__relPath', { value: parentPath + f.name }); } catch (e) {}
            out.push(f);
          }
          resolve();
        }, () => resolve());
      } else if (entry.isDirectory) {
        const reader = entry.createReader();
        const sub = parentPath + entry.name + '/';
        const readBatch = () => {
          reader.readEntries(async (entries) => {
            if (!entries || !entries.length) return resolve();
            for (const e of entries) await readEntry(e, sub, out);
            readBatch(); // readEntries 每次最多返回 100 项，需要反复读直到为空
          }, () => resolve());
        };
        readBatch();
      } else {
        resolve();
      }
    });
  }

  async function collectFromDataTransfer(dt) {
    const out = [];
    const items = dt && dt.items ? [...dt.items] : [];
    const entries = items
      .filter((it) => it.kind === 'file' && typeof it.webkitGetAsEntry === 'function')
      .map((it) => { try { return it.webkitGetAsEntry(); } catch (e) { return null; } })
      .filter(Boolean);
    if (entries.length) {
      const hasDir = entries.some((e) => e && e.isDirectory);
      if (hasDir) toast('正在扫描文件夹…');
      for (const e of entries) await readEntry(e, '', out);
      return out;
    }
    return [...((dt && dt.files) || [])];
  }

  function enqueue(file) {
    const row = document.createElement('div');
    row.className = 'q-item';
    const thumb = document.createElement('img');
    thumb.className = 'q-thumb';
    thumb.alt = '';
    const body = document.createElement('div');
    body.className = 'q-body';
    const name = document.createElement('div');
    name.className = 'q-name';
    name.textContent = file.__relPath || file.name;
    name.title = name.textContent;
    const bar = document.createElement('div');
    bar.className = 'q-bar';
    const fill = document.createElement('div');
    fill.className = 'q-fill';
    bar.appendChild(fill);
    const status = document.createElement('div');
    status.className = 'q-status';
    status.textContent = '等待上传';
    body.append(name, bar, status);
    row.append(thumb, body);
    if (URL.createObjectURL) {
      const u = URL.createObjectURL(file);
      thumb.src = u;
      thumb.onload = () => URL.revokeObjectURL(u);
    }
    $('queue').appendChild(row);
    queue.push({ file, row, fill, status, done: false });
  }

  async function uploadFile(file, fill, status, dupCtx) {
    const relPath = file.__relPath || file.name;
    let key = makeKey(relPath, file.type);
    if ((await headP(key)).state === 'exists') {
      let action = dupCtx.action;
      if (!action) {
        const res = await askDialog(`目标位置已有「${relPath}」，如何处理？`, { cancel: '跳过', file, oldKey: key });
        action = res.action;
        if (res.applyAll) dupCtx.action = action;
      }
      if (action === 'cancel') return { skipped: true };
      if (action === 'rename') key = await autoRenameKey(key);
    }
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    return new Promise((resolve, reject) => {
      cos.uploadFile({
        Bucket: cfg.bucket,
        Region: cfg.region,
        Key: key,
        Body: file,
        ContentType: file.type || TYPE_BY_EXT[ext] || 'image/png',
        onProgress(p) {
          const pct = Math.min(100, Math.round((p.percent || 0) * 100));
          fill.style.width = pct + '%';
          status.textContent = pct >= 100 ? '处理中…' : pct + '%';
        },
      }, (err) => {
        if (err) return reject(err);
        resolve(publicUrl(key));
      });
    });
  }

  async function processQueue() {
    if (processing) return;
    processing = true;
    let uploadedAny = false;
    const dupCtx = { action: null };
    try {
      for (const item of queue) {
        if (item.done) continue;
        item.status.textContent = '上传中…';
        try {
          const url = await uploadFile(item.file, item.fill, item.status, dupCtx);
          item.done = true;
          if (url && url.skipped) {
            item.status.textContent = '已跳过（同名文件）';
            item.row.classList.add('done');
            await sleep(350);
            item.row.remove();
            continue;
          }
          uploadedAny = true;
          item.fill.style.width = '100%';
          item.status.textContent = '完成';
          item.row.classList.add('done');
          addResult(url, item.file.name);
          saveHistory(url, item.file.name);
          await sleep(350);
          item.row.remove();
        } catch (e) {
          console.error('[picbed] 上传失败:', e);
          item.status.textContent = '失败：' + errMsg(e) + '（点此重试）';
          item.row.classList.add('error');
          item.status.onclick = () => {
            item.status.onclick = null;
            item.status.textContent = '重试中…';
            item.row.classList.remove('error');
            processQueue();
          };
        }
      }
    } finally {
      processing = false;
      if (uploadedAny) loadGallery(true);
    }
  }

  // ---------- 结果 ----------
  const sessionResults = [];
  function addResult(url, name) {
    sessionResults.unshift({ url, name });
    $('resultsSection').hidden = false;
    const box = document.createElement('div');
    box.className = 'result';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = url;
    img.onerror = () => img.remove();
    const info = document.createElement('div');
    info.className = 'result-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'result-name';
    nameEl.textContent = name;
    const btns = document.createElement('div');
    btns.className = 'result-btns';
    const links = makeLinks(url, name);
    FMT.forEach((k) => {
      const b = document.createElement('button');
      b.className = 'btn small';
      b.textContent = FMT_LABEL[k];
      b.onclick = () => copyText(links[k]);
      btns.appendChild(b);
    });
    info.append(nameEl, btns);
    box.append(img, info);
    $('results').prepend(box);
  }

  function copyAllResults() {
    if (!sessionResults.length) return toast('还没有上传结果');
    copyText(sessionResults.map((r) => makeLinks(r.url, r.name)[cfg.format]).join('\n'));
  }

  // ---------- 历史 ----------
  const HISTORY_KEY = 'picbed_history';
  let history = [];
  try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (e) {}

  function persistHistory() { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }

  function saveHistory(url, name) {
    history.unshift({ url, name, time: Date.now() });
    history = history.slice(0, 200);
    persistHistory();
    renderHistory();
  }

  function renderHistory() {
    const ul = $('historyList');
    ul.textContent = '';
    if (!history.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '暂无记录';
      ul.appendChild(li);
      return;
    }
    for (const h of history) {
      const li = document.createElement('li');
      const name = document.createElement('span');
      name.className = 'h-name';
      name.textContent = h.name || h.url.split('/').pop();
      name.title = h.url;
      const time = document.createElement('span');
      time.className = 'h-time';
      time.textContent = new Date(h.time).toLocaleString();
      const btns = document.createElement('span');
      btns.className = 'h-btns';
      const links = makeLinks(h.url, h.name);
      FMT.forEach((k) => {
        const b = document.createElement('button');
        b.className = 'btn small';
        b.textContent = FMT_LABEL[k];
        b.onclick = () => copyText(links[k]);
        btns.appendChild(b);
      });
      const del = document.createElement('button');
      del.className = 'btn small danger';
      del.textContent = '✕';
      del.title = '删除记录';
      del.onclick = () => { history = history.filter((x) => x !== h); persistHistory(); renderHistory(); };
      btns.appendChild(del);
      li.append(name, time, btns);
      ul.appendChild(li);
    }
  }

  // ---------- 相册 ----------
  let galleryMarker = '';
  let galleryLoaded = 0;
  let galleryPrefix = cfg.prefix + '/'; // 当前目录（尾部带 /）
  let selectMode = false;
  const selectedKeys = new Set();

  function getBucketP(params) {
    return new Promise((resolve, reject) => {
      cos.getBucket({ Bucket: cfg.bucket, Region: cfg.region, ...params }, (err, data) => (err ? reject(err) : resolve(data)));
    });
  }
  function copyP(sourceKey, targetKey) {
    return new Promise((resolve, reject) => {
      cos.sliceCopyFile({
        Bucket: cfg.bucket,
        Region: cfg.region,
        Key: targetKey,
        CopySource: `${cfg.bucket}.cos.${cfg.region}.myqcloud.com/${sourceKey.split('/').map(encodeURIComponent).join('/')}`,
      }, (err, data) => (err ? reject(err) : resolve(data)));
    });
  }
  function putP(key, body) {
    return new Promise((resolve, reject) => {
      cos.putObject({ Bucket: cfg.bucket, Region: cfg.region, Key: key, Body: body || '' }, (err, data) => (err ? reject(err) : resolve(data)));
    });
  }
  function deleteKeysP(keys) {
    return new Promise((resolve, reject) => {
      const chunks = [];
      for (let i = 0; i < keys.length; i += 500) chunks.push(keys.slice(i, i + 500));
      let idx = 0;
      const next = () => {
        if (idx >= chunks.length) return resolve();
        cos.deleteMultipleObject({
          Bucket: cfg.bucket,
          Region: cfg.region,
          Objects: chunks[idx].map((k) => ({ Key: k })),
        }, (err) => {
          if (err) return reject(err);
          idx++;
          next();
        });
      };
      next();
    });
  }
  function headP(key) {
    return new Promise((resolve) => {
      cos.headObject({ Bucket: cfg.bucket, Region: cfg.region, Key: key }, (err, data) => {
        if (err) return resolve({ state: err.statusCode === 404 ? 'free' : 'error' });
        const size = data
          ? Number((data.headers && data.headers['content-length']) || data['content-length']) || 0
          : 0;
        resolve({ state: 'exists', size });
      });
    });
  }

  // 内容一致性检查：先比大小，大小相同则下载远端逐字节比对
  async function compareFiles(file, key) {
    const head = await headP(key);
    if (head.state !== 'exists') return 'unknown';
    if (head.size !== file.size) return 'diff';
    let remoteBuf;
    try {
      const resp = await fetch(publicUrl(key));
      if (!resp.ok) return 'size-same';
      remoteBuf = new Uint8Array(await resp.arrayBuffer());
    } catch (e) {
      return 'size-same';
    }
    const localBuf = new Uint8Array(await file.arrayBuffer());
    if (remoteBuf.length !== localBuf.length) return 'diff';
    for (let i = 0; i < localBuf.length; i++) {
      if (remoteBuf[i] !== localBuf[i]) return 'diff';
    }
    return 'same';
  }

  function askDialog(message, opts) {
    return new Promise((resolve) => {
      $('dupMsg').textContent = message;
      $('dupOverwrite').textContent = (opts && opts.overwrite) || '覆盖';
      $('dupRename').textContent = (opts && opts.rename) || '自动重命名';
      $('dupSkip').textContent = (opts && opts.cancel) || '取消';
      $('dupPreview').hidden = !(opts && opts.file);
      $('dupApplyAll').checked = false;
      if (opts && opts.file) {
        $('dupNewImg').src = URL.createObjectURL(opts.file);
        $('dupOldImg').src = publicUrl(opts.oldKey);
        compareFiles(opts.file, opts.oldKey).then((r) => {
          const el = $('dupCompare');
          if (r === 'same') {
            el.textContent = '✓ 两个文件内容完全一致';
            el.className = 'dup-compare same';
          } else if (r === 'diff') {
            el.textContent = '✗ 两个文件内容不同（覆盖会替换现有文件）';
            el.className = 'dup-compare diff';
          } else if (r === 'size-same') {
            el.textContent = '大小一致，但无法完成内容比对';
            el.className = 'dup-compare';
          } else {
            el.textContent = '';
            el.className = 'dup-compare';
          }
        });
      } else {
        $('dupCompare').textContent = '';
        $('dupCompare').className = 'dup-compare';
      }
      $('dupDialog').hidden = false;
      const answer = (action) => {
        $('dupDialog').hidden = true;
        resolve({ action, applyAll: $('dupApplyAll').checked });
      };
      $('dupOverwrite').onclick = () => answer('overwrite');
      $('dupRename').onclick = () => answer('rename');
      $('dupSkip').onclick = () => answer('cancel');
    });
  }

  async function autoRenameKey(key) {
    const dot = key.lastIndexOf('.');
    const stem = dot > 0 ? key.slice(0, dot) : key;
    const ext = dot > 0 ? key.slice(dot) : '';
    for (let n = 1; n < 1000; n++) {
      const cand = `${stem} (${n})${ext}`;
      if ((await headP(cand)).state === 'free') return cand;
    }
    return `${stem}_${Date.now()}${ext}`;
  }

  async function resolveCollisions(pairs) {
    const collided = [];
    for (const p of pairs) {
      if ((await headP(p.targetKey)).state === 'exists') collided.push(p.targetKey);
    }
    if (!collided.length) return { action: 'go', map: {} };
    const { action } = await askDialog(`目标位置已有 ${collided.length} 个同名文件，如何处理？`, { cancel: '取消' });
    if (action === 'cancel') return { action: 'cancel', map: {} };
    if (action === 'overwrite') return { action: 'go', map: {} };
    const map = {};
    for (const t of collided) map[t] = await autoRenameKey(t);
    return { action: 'go', map };
  }

  async function listAllKeys(prefix) {
    const all = [];
    let marker = '';
    for (;;) {
      const data = await getBucketP({ Prefix: prefix, MaxKeys: 1000, Marker: marker });
      all.push(...(data.Contents || []).map((c) => c.Key));
      if (String(data.IsTruncated) === 'true' && data.NextMarker) marker = data.NextMarker;
      else break;
    }
    return all;
  }

  function sanitizeName(name) {
    return String(name || '').trim().replace(/[\\/:*?"<>|]+/g, '_').slice(0, 40);
  }

  async function loadGallery(reset) {
    if (!needWorker()) return;
    if (reset) {
      galleryMarker = '';
      galleryLoaded = 0;
      $('galleryGrid').textContent = '';
      clearSelection();
    }
    const btn = $('loadMore');
    btn.disabled = true;
    btn.textContent = '加载中…';
    try {
      const data = await getBucketP({
        Prefix: galleryPrefix,
        Delimiter: '/',
        MaxKeys: cfg.maxKeys || 500,
        Marker: galleryMarker,
      });
      renderBreadcrumb();
      if (reset) {
        for (const f of data.CommonPrefixes || []) $('galleryGrid').appendChild(renderFolderTile(f.Prefix));
      }
      const items = (data.Contents || [])
        .filter((c) => !c.Key.endsWith('/') && c.Key !== galleryPrefix)
        .reverse();
      for (const it of items) $('galleryGrid').appendChild(renderGridItem({ key: it.Key }));
      galleryLoaded += items.length;
      $('galleryCount').textContent = `已显示 ${galleryLoaded} 张`;
      galleryMarker = String(data.IsTruncated) === 'true' ? data.NextMarker : '';
      btn.hidden = !galleryMarker;
    } catch (e) {
      console.error('[picbed] 相册加载失败:', e.message || e);
      toast('相册加载失败：' + ((e && e.error && e.error.Message) || e.message || e), true);
    } finally {
      btn.disabled = false;
      btn.textContent = '加载更多';
    }
  }

  function renderBreadcrumb() {
    const el = $('galleryPath');
    el.textContent = '';
    const rootPrefix = cfg.prefix + '/';
    const crumb = (label, prefix, isCurrent) => {
      const b = document.createElement('button');
      b.className = 'crumb' + (isCurrent ? ' current' : '');
      b.textContent = label;
      if (!isCurrent) b.onclick = () => { galleryPrefix = prefix; loadGallery(true); };
      el.appendChild(b);
    };
    const sep = () => {
      const s = document.createElement('span');
      s.className = 'sep';
      s.textContent = '/';
      el.appendChild(s);
    };
    crumb('🏠 全部', rootPrefix, galleryPrefix === rootPrefix);
    if (galleryPrefix !== rootPrefix) {
      let acc = rootPrefix;
      const parts = galleryPrefix.slice(rootPrefix.length).replace(/\/$/, '').split('/');
      parts.forEach((p, i) => {
        sep();
        acc += p + '/';
        crumb(p, acc, i === parts.length - 1);
      });
    }
  }

  function renderFolderTile(prefix) {
    const name = prefix.slice(0, -1).split('/').pop() || prefix;
    const fig = document.createElement('figure');
    fig.className = 'folder-tile';
    const icon = document.createElement('div');
    icon.className = 'folder-icon';
    icon.textContent = '📁';
    const cap = document.createElement('figcaption');
    cap.textContent = name;
    const actions = document.createElement('div');
    actions.className = 'folder-actions';
    const rename = document.createElement('button');
    rename.textContent = '✏️';
    rename.title = '重命名相册';
    rename.onclick = async (e) => {
      e.stopPropagation();
      const newName = sanitizeName(prompt('新的相册名称：', name));
      if (!newName) return;
      await moveFolder(prefix, galleryPrefix + newName + '/');
    };
    const del = document.createElement('button');
    del.textContent = '🗑️';
    del.title = '删除相册及其全部图片';
    del.onclick = async (e) => {
      e.stopPropagation();
      try {
        const keys = await listAllKeys(prefix);
        if (!keys.length) return toast('相册为空');
        const files = keys.filter((k) => !k.endsWith('/'));
        // 子相册（含空相册）也有零字节标记对象，必须一并删除，否则父相册删不掉
        const subAlbums = keys.filter((k) => k.endsWith('/') && k !== prefix).length;
        const extra = subAlbums ? ` 和 ${subAlbums} 个子相册` : '';
        if (!confirm(`确定删除相册「${name}」？将删除其中 ${files.length} 张图片${extra}，不可恢复！`)) return;
        await deleteKeysP(keys); // 文件 + 本相册标记 + 全部子相册标记
        toast('相册已删除');
        loadGallery(true);
      } catch (err) {
        toast('删除失败：' + (err.message || err), true);
      }
    };
    actions.append(rename, del);
    fig.append(icon, actions, cap);
    fig.onclick = () => { galleryPrefix = prefix; loadGallery(true); };
    return fig;
  }

  async function moveFolder(oldPrefix, newPrefix) {
    if (!newPrefix || newPrefix === oldPrefix) return;
    const keys = await listAllKeys(oldPrefix);
    if (!keys.length) return toast('相册为空');
    const files = keys.filter((k) => !k.endsWith('/'));
    // 子相册标记（含空相册）也要一起搬走，否则旧相册会残留在父目录
    const markers = keys.filter((k) => k.endsWith('/') && k !== oldPrefix);
    const pairs = files.map((k) => ({ key: k, targetKey: newPrefix + k.slice(oldPrefix.length) }));
    const { action, map } = await resolveCollisions(pairs);
    if (action === 'cancel') return toast('已取消');
    const total = pairs.length + markers.length;
    let done = 0;
    try {
      for (const p of pairs) {
        await copyP(p.key, map[p.targetKey] || p.targetKey);
        done++;
        if (done % 5 === 0 || done === total) toast(`移动中 ${done}/${total}`);
      }
      for (const m of markers) {
        await putP(newPrefix + m.slice(oldPrefix.length), '');
        done++;
        if (done % 5 === 0 || done === total) toast(`移动中 ${done}/${total}`);
      }
      await deleteKeysP(keys); // 文件 + 旧相册标记 + 子相册旧标记
      await putP(newPrefix, '');
      toast('重命名完成');
      loadGallery(true);
    } catch (err) {
      toast('移动失败（已复制的文件保留在新相册）：' + (err.message || err), true);
      loadGallery(true);
    }
  }

  async function newAlbum() {
    if (!needWorker()) return;
    const name = sanitizeName(prompt('新相册名称：'));
    if (!name) return;
    try {
      await putP(galleryPrefix + name + '/', '');
      toast('相册已创建');
      loadGallery(true);
    } catch (err) {
      toast('创建失败：' + (err.message || err), true);
    }
  }

  function toggleSelectMode() {
    selectMode = !selectMode;
    $('selectModeBtn').classList.toggle('active', selectMode);
    document.querySelectorAll('#galleryGrid figure').forEach((f) => {
      const check = f.querySelector('.sel-check');
      if (!check) return; // 文件夹卡片不参与多选
      f.classList.toggle('selectable', selectMode);
      check.hidden = !selectMode;
    });
    if (!selectMode) clearSelection();
    updateBulkBar();
  }

  function clearSelection() {
    selectedKeys.clear();
    document.querySelectorAll('#galleryGrid figure.selected').forEach((f) => f.classList.remove('selected'));
    updateBulkBar();
  }

  function updateBulkBar() {
    const bar = $('bulkBar');
    const n = selectedKeys.size;
    $('bulkCount').textContent = `已选 ${n} 张`;
    bar.hidden = !n;
  }

  async function bulkMove() {
    const keys = [...selectedKeys];
    if (!keys.length) return;
    const raw = prompt('移动到哪个相册？（留空移到根目录，取消则不移动）');
    if (raw === null) return;
    const target = sanitizeName(raw);
    const targetPrefix = (target ? galleryPrefix + target : cfg.prefix) + '/';
    const pairs = keys.map((k) => ({ key: k, targetKey: targetPrefix + k.split('/').pop() }));
    const { action, map } = await resolveCollisions(pairs);
    if (action === 'cancel') return toast('已取消');
    try {
      for (let i = 0; i < pairs.length; i++) {
        await copyP(pairs[i].key, map[pairs[i].targetKey] || pairs[i].targetKey);
        if (i % 5 === 0 || i === pairs.length - 1) toast(`移动中 ${i + 1}/${pairs.length}`);
      }
      await deleteKeysP(keys);
      toast('移动完成');
      clearSelection();
      loadGallery(true);
    } catch (err) {
      toast('移动失败（已复制的文件保留在目标相册）：' + (err.message || err), true);
    }
  }

  async function bulkDelete() {
    const keys = [...selectedKeys];
    if (!keys.length) return;
    if (!confirm(`确定删除选中的 ${keys.length} 张图片？此操作不可恢复。`)) return;
    try {
      await deleteKeysP(keys);
      toast('已删除');
      clearSelection();
      loadGallery(true);
    } catch (err) {
      toast('删除失败：' + (err.message || err), true);
    }
  }

  function renderGridItem(it) {
    const fig = document.createElement('figure');
    if (selectMode) fig.classList.add('selectable');
    const check = document.createElement('span');
    check.className = 'sel-check';
    check.hidden = !selectMode;
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = publicUrl(it.key) + (cfg.thumb ? '?imageMogr2/thumbnail/500x' : '');
    img.onerror = () => {
      if (cfg.thumb && !img.dataset.raw) { img.dataset.raw = '1'; img.src = publicUrl(it.key); }
      else fig.remove();
    };
    const cap = document.createElement('figcaption');
    cap.textContent = it.key.split('/').pop();
    fig.append(check, img, cap);
    fig.onclick = () => {
      if (selectMode) {
        if (selectedKeys.has(it.key)) {
          selectedKeys.delete(it.key);
          fig.classList.remove('selected');
        } else {
          selectedKeys.add(it.key);
          fig.classList.add('selected');
        }
        updateBulkBar();
      } else {
        openLightbox(it);
      }
    };
    return fig;
  }

  // ---------- 灯箱 ----------
  let lightboxItem = null;

  function openLightbox(item) {
    lightboxItem = item;
    const url = publicUrl(item.key);
    $('lightboxImg').src = url;
    $('lightboxName').textContent = item.key;
    document.querySelectorAll('.lightbox-actions [data-fmt]').forEach((b) => {
      b.onclick = () => copyText(makeLinks(url, item.key.split('/').pop())[b.dataset.fmt]);
    });
    $('lightbox').hidden = false;
  }

  function closeLightbox() {
    $('lightbox').hidden = true;
    lightboxItem = null;
  }

  // ---------- URL 转存 ----------
  async function transferUrl() {
    const input = $('urlInput');
    const url = input.value.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) return toast('请输入 http(s) 链接', true);
    if (!needWorker()) return;
    const btn = $('urlBtn');
    btn.disabled = true;
    btn.textContent = '转存中…';
    try {
      const res = await fetch(`${cfg.worker}/url`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ url }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '转存失败');
      input.value = '';
      const name = data.url.split('/').pop();
      toast('转存成功');
      addResult(data.url, name);
      saveHistory(data.url, name);
    } catch (e) {
      toast(e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = '转存';
    }
  }

  // ---------- 设置 ----------
  function openSettings() {
    $('setWorker').value = cfg.worker;
    $('setPassword').value = cfg.password;
    $('setDomain').value = cfg.customDomain;
    $('setFormat').value = cfg.format;
    $('settingsDialog').hidden = false;
  }

  function closeSettings() { $('settingsDialog').hidden = true; }

  function applySettings() {
    cfg.worker = $('setWorker').value.trim().replace(/\/+$/, '');
    cfg.password = $('setPassword').value;
    cfg.customDomain = $('setDomain').value.trim().replace(/\/+$/, '');
    cfg.format = $('setFormat').value;
    tokenCache = null;
    saveSettings();
    toast('设置已保存');
    closeSettings();
  }

  // ---------- 事件绑定 ----------
  // 选择文件与全页拖放上传
  $('uploadBtn').onclick = () => $('fileInput').click();
  $('fileInput').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
  // 文件夹上传：webkitRelativePath 形如 "我的相册/2024/a.jpg"
  $('uploadDirBtn').onclick = () => $('dirInput').click();
  $('dirInput').onchange = (e) => {
    const files = [...e.target.files];
    for (const f of files) {
      // 保留最外层文件夹名：选「我的相册」→ 当前目录下生成「我的相册」相册
      const rel = (f.webkitRelativePath || f.name).replace(/\\/g, '/');
      try { Object.defineProperty(f, '__relPath', { value: rel }); } catch (err) {}
    }
    if (files.length) toast(`正在扫描文件夹…（${files.length} 个文件）`);
    addFiles(files);
    e.target.value = '';
  };
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => {
    if (![...((e.dataTransfer && e.dataTransfer.types) || [])].includes('Files')) return;
    e.preventDefault();
    dragDepth++;
    $('dropOverlay').hidden = false;
    const cur = galleryPrefix === cfg.prefix + '/'
      ? '全部图片'
      : (galleryPrefix.slice(0, -1).split('/').pop() || '全部图片');
    $('dropTargetLabel').textContent = `松开鼠标，上传到「${cur}」`;
  });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) $('dropOverlay').hidden = true;
  });
  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragDepth = 0;
    $('dropOverlay').hidden = true;
    const files = await collectFromDataTransfer(e.dataTransfer);
    if (files.length) addFiles(files);
  });

  document.addEventListener('paste', (e) => {
    if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
    const files = [];
    for (const it of (e.clipboardData || {}).items || []) {
      if (it.kind === 'file' && it.type && it.type.startsWith('image/')) files.push(it.getAsFile());
    }
    if (files.length) { e.preventDefault(); addFiles(files); return; }
    const text = e.clipboardData && e.clipboardData.getData ? e.clipboardData.getData('text').trim() : '';
    if (/^https?:\/\//i.test(text)) {
      e.preventDefault();
      $('urlInput').value = text;
      toast('检测到链接，已填入转存框');
    }
  });

  $('urlBtn').onclick = transferUrl;
  $('urlInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') transferUrl(); });
  $('copyAllBtn').onclick = copyAllResults;
  $('settingsBtn').onclick = () => openSettings();
  $('probeBtn').onclick = async () => {
    const out = $('probeResult');
    out.textContent = '诊断中…';
    try {
      const res = await fetch(`${cfg.worker}/probe`, { headers: listHeaders() });
      const data = await res.json().catch(() => ({}));
      out.textContent = JSON.stringify(data, null, 2);
    } catch (e) {
      out.textContent = '诊断失败：' + e.message;
    }
  };
  $('saveSettings').onclick = applySettings;
  $('closeSettings').onclick = closeSettings;
  $('settingsDialog').addEventListener('click', (e) => { if (e.target === $('settingsDialog')) closeSettings(); });
  $('refreshGallery').onclick = () => loadGallery(true);
  $('loadMore').onclick = () => loadGallery(false);
  $('newAlbumBtn').onclick = newAlbum;
  $('selectModeBtn').onclick = toggleSelectMode;
  $('bulkMoveBtn').onclick = bulkMove;
  $('bulkDeleteBtn').onclick = bulkDelete;
  $('bulkCancelBtn').onclick = clearSelection;
  $('thumbMode').checked = cfg.thumb;
  $('thumbMode').onchange = () => { cfg.thumb = $('thumbMode').checked; saveSettings(); loadGallery(true); };
  $('clearHistory').onclick = () => { history = []; persistHistory(); renderHistory(); };
  $('deleteBtn').onclick = () => {
    if (!lightboxItem || !confirm('确定删除这张图片？此操作不可恢复。')) return;
    cos.deleteObject({ Bucket: cfg.bucket, Region: cfg.region, Key: lightboxItem.key }, (err) => {
      if (err) return toast('删除失败：' + (err.message || err), true);
      toast('已删除（走 CDN 的话缓存可能仍短暂可见）');
      closeLightbox();
      loadGallery(true);
    });
  };
  $('lightboxClose').onclick = closeLightbox;
  $('lightbox').addEventListener('click', (e) => { if (e.target === $('lightbox')) closeLightbox(); });

  // ---------- 初始化 ----------
  $('bucketInfo').textContent = `${cfg.bucket} · ${cfg.region}`;
  renderHistory();
  if (!cfg.worker) openSettings();
  loadGallery(true);
})();
</script>
</body>
</html>
