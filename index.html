    if (!e.target.closest('#galleryGrid')) hideCtxMenu();
  });

  // ---------- 缩略图下载与进度 ----------
  // 为什么自己下载：原生 <img> 的字节进度没有任何接口可观测，要真实百分比就只能自己 fetch。
  // 代价是浏览器原本白送的东西得自己补：懒加载、并发上限，以及「加载多少显示多少」——
  // 后者靠把已收字节反复包成 blob 换 src：截断的 JPEG / PNG 也能把已经到手的那部分画出来，
  // 于是能看到「先糊后清」的过程，而且截断的数据派发的是 load 不是 error。
  // 哪些格式吃这一套，见下面的 revealable —— 单帧 WebP 截断后什么都不画，就不该换 src。
  // 这条路任何一环走不通（老浏览器、CORS 没了）就整会话退回原生加载，卡片行为与改造前一致。
  const DL_CONCURRENCY = 6;        // 在途上限：不设的话一次 reset 会同时开几百个请求（原生懒加载本来是浏览器在管）
  const DL_AHEAD = '800px 0px';    // 提前约一屏开始下，滚起来不至于看到一片空卡
  const DL_SHOW_MS = 300;          // 快过这个时间连进度层都不显示：实测边缘命中的缩略图只要 58ms，显示了只会闪一下
  const DL_DONE_HOLD_MS = 200;     // 100% 后让进度层多留一下，别在眼前一跳就没
  const DL_REVEAL_MS = 150;        // 两次增量显形的最小间隔（也是「慢到值得显形」的门槛：快下载根本轮不到）
  const DL_REVEAL_SLOW_MS = 400;   // 显形次数用满后放慢，别反复解码
  const DL_REVEAL_MAX = 8;         // 单卡最多显形几次：new Blob() 会拷贝已收字节，次数必须封顶
  const DL_REVEAL_MIN = 4096;      // 少于这么多字节不显形：那时只是一张 8x8 的糊图，白解一次码
  const DL_REVEAL_BIG = 1 << 20;   // 超过 1MB（原图回退路径）显形砍到 3 次：解码大图不便宜
  const DL_STREAM_CAP = 8 << 20;   // 超过 8MB 干脆不显形，只更新进度条

  let dlOk = null;              // null=未判明；false=这条路整会话作废，后面的卡片直接走原生
  // 世代号：网格被清空时 ++，在途任务据此自我作废。
  // 不能借用 galleryReqSeq —— 点「加载更多」也会动它，那会误杀上一页还在下的缩略图。
  let dlEpoch = 0;
  let dlActive = 0;             // 在途请求数
  const dlQueue = [];           // 等并发位的任务（先进先出；有 DL_AHEAD 约束，队列最多也就两屏长）
  const dlInflight = new Set(); // 在途任务的 AbortController
  const dlBlobs = new Set();    // 已交给 <img> 的 blob URL：换新时 revoke 旧的，清网格时整批 revoke
  let dlIO = null;              // 共享的 IntersectionObserver，懒创建

  // 退回原生加载：行为与改造前逐字一致（懒加载 + shimmer 撑到 onload）
  function dlNative(job) {
    const { fig, img } = job;
    if (fig.__dl) { fig.__dl = null; if (dlIO) dlIO.unobserve(fig); }
    if (job.started) return;  // 已经有像素显示着了，别拿网络地址把它顶掉
    job.started = true;
    img.src = job.url;
  }

  // 登记一张卡片：能自取就等它进视口再下，不能就立刻交给浏览器
  function dlLoad(job) {
    if (dlOk === false || !('IntersectionObserver' in window)) return dlNative(job);
    if (typeof fetch !== 'function' || !('ReadableStream' in window)) return dlNative(job);
    if (!dlIO) {
      dlIO = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          dlIO.unobserve(e.target); // 只管「什么时候开始下」；之后不再回看，也就不占着这几百个引用
          const job = e.target.__dl;
          e.target.__dl = null;
          if (job) dlPush(job);
        }
      }, { rootMargin: DL_AHEAD });
    }
    job.fig.__dl = job;
    dlIO.observe(job.fig);
  }

  function dlPush(job) {
    if (dlActive < DL_CONCURRENCY) dlStart(job);
    else dlQueue.push(job);
  }

  async function dlStart(job) {
    if (dlOk === false) return dlNative(job); // 中途判明走不通：排队里的别再白试一次
    dlActive++;
    try { await dlStream(job, dlCardSink(job)); }
    finally {
      dlActive--;
      // 队列里混着已经被清出网格的卡片（切相册/切视图）时跳过它们，直接轮到下一个
      while (dlQueue.length) {
        const next = dlQueue.shift();
        if (next.fig.isConnected) { dlStart(next); break; }
      }
    }
  }

  // 先在游离的 Image 上把这一帧解出来再换 src，换的那一下才不会闪空白。
  // 不能只用 img.decode()：规范上它对解不出来的图会 reject，而本功能恰恰全靠截断的图能出画面，
  // 所以 decode() 只当快路径，失败就退回 load 事件。
  function dlDecode(url) {
    const pre = new Image();
    pre.src = url;
    return pre.decode().then(() => true, () => new Promise((res) => {
      // 已经尘埃落定（成功或失败）就别再挂事件等了：那两种事件的派发时机已过，promise 会永远悬着，
      // 而它悬着会把整个读取循环卡住（外面 await 着它）
      if (pre.complete) return res(!!pre.naturalWidth); // 截断图已经派发过 load，只是 decode() 不认
      pre.onload = () => res(true);
      pre.onerror = () => res(false);
    }));
  }

  // 换上一批字节；返回是否真的换了。revoke 旧 blob 是安全的：img 已经拿着解码后的位图。
  // job.cancelled 是给灯箱用的：关灯箱只 abort 在途请求，不改 dlEpoch（那会连网格一起废掉），
  // 所以正在等解码的那次换帧得自己认账 —— 否则它回来时会往已经关掉的灯箱上挂一个新 blob，谁都不再回收。
  async function dlSwap(job, blob) {
    const url = URL.createObjectURL(blob);
    dlBlobs.add(url);
    if (!(await dlDecode(url)) || job.epoch !== dlEpoch || job.cancelled) {
      dlBlobs.delete(url);
      URL.revokeObjectURL(url);
      return false;
    }
    const prev = job.blobUrl;
    job.blobUrl = url;
    job.img.src = url;
    job.started = true;
    if (prev) { dlBlobs.delete(prev); URL.revokeObjectURL(prev); }
    return true;
  }

  // 进度层：懒创建 —— 快下载按 DL_SHOW_MS 的规则根本轮不到它，那就一个节点都别建
  function dlLayer(job) {
    if (!job.layer) {
      const layer = document.createElement('div');
      layer.className = 'dl';
      const pct = document.createElement('span');
      pct.className = 'dl-pct';
      pct.setAttribute('aria-hidden', 'true'); // 十几张卡同时报百分比，读屏是灾难
      const bar = document.createElement('i');
      bar.className = 'dl-bar';
      bar.appendChild(document.createElement('b'));
      layer.append(pct, bar);
      job.fig.appendChild(layer);
      job.layer = layer;
      job.pctEl = pct;
      job.fillEl = bar.firstChild;
    }
    return job.layer;
  }

  function dlPaint(job) {
    if (!job.shown) return;
    job.pctEl.textContent = job.total ? job.pct + '%' : ''; // 总长未知就不报数字，别编一个
    job.fillEl.style.width = (job.total ? job.pct : 100) + '%';
    job.layer.classList.toggle('indet', !job.total);
  }

  function dlShow(job) {
    dlLayer(job);
    job.shown = true;
    job.layer.classList.add('on');
    dlPaint(job);
  }

  // 卡片的进度层：进度画在卡片上，收尾是摘骨架，失效判据是「卡片还在网格里」
  function dlCardSink(job) {
    return {
      show: () => dlShow(job),
      paint: () => dlPaint(job),
      frame: () => job.fig.classList.remove('ph'), // 第一帧到手就摘骨架：宁可看模糊的整图，也别让 shimmer 盖着已到的像素
      done: () => {
        job.fig.classList.remove('ph');
        setTimeout(() => { if (job.layer) job.layer.classList.remove('on'); }, DL_DONE_HOLD_MS);
      },
      fail: () => {
        if (job.layer) job.layer.classList.remove('on');
        dlNative(job);
      },
      alive: () => job.fig.isConnected,
    };
  }

  // 灯箱的进度：进度画在信息区那条，收尾是收起它，失效判据是「还是当前这张、灯箱还开着」
  function dlBoxSink(job) {
    const box = $('lightboxDl'), text = $('lightboxDlText'), fill = $('lightboxDlFill');
    return {
      show: () => { box.hidden = false; },
      paint: () => {
        text.textContent = job.total ? job.pct + '%' : '';
        fill.style.width = (job.total ? job.pct : 100) + '%';
        box.classList.toggle('indet', !job.total);
      },
      frame: () => {}, // 大图不需要额外的收尾动作
      done: () => { setTimeout(() => { if (lightboxJob === job) box.hidden = true; }, DL_DONE_HOLD_MS); },
      fail: () => { box.hidden = true; job.img.src = job.url; }, // 退回原生：浏览器自己下，和改造前一样
      cancel: () => { box.hidden = true; },
      alive: () => lightboxJob === job && !$('lightbox').hidden,
    };
  }

  // 流式取图的核心：卡片与灯箱共用。差别只有「进度画到哪、收尾做什么、什么时候算失效」，
  // 所以全收在 sink 里；取字节那套（总长、分片、节流更新、增量显形、中止、退路）只有这一份。
  // job: { img, url, rawUrl, thumb, epoch, bytes, total, pct, started, blobUrl }
  async function dlStream(job, sink) {
    const ctrl = new AbortController();
    const epoch = job.epoch;
    job.ctrl = ctrl;
    dlInflight.add(ctrl);
    const showTimer = setTimeout(() => sink.show(), DL_SHOW_MS);
    const chunks = [];
    let gotResponse = false; // 连响应都没拿到就失败 = 这条路整体不通（详见 catch）
    try {
      let res = await fetch(job.url, { mode: 'cors', signal: ctrl.signal });
      gotResponse = true;
      // 缩略图这条路服务端不认（格式不支持之类）：换原图再下一遍 —— 进度条在这条路上最值钱
      if (!res.ok && job.thumb) {
        job.thumb = false;
        job.url = job.rawUrl;
        job.img.dataset.raw = '1'; // 原生那边不许再退一次
        res = await fetch(job.url, { mode: 'cors', signal: ctrl.signal });
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      if (!res.body || !res.body.getReader) throw new Error('响应不可流式读取');
      const mime = res.headers.get('content-type') || '';
      job.total = Number(res.headers.get('content-length')) || 0;
      // 增量显形只对「截断也能出画面」的格式有意义：实测 JPEG（渐进/基线）与 PNG 都会把已收到的那部分
      // 画出来，而单帧 WebP 在截断状态下什么都不画 —— 那时换 src 会把骨架摘掉、露出一张空卡，比不换更糟。
      // 缩略图里的 PNG 上传时就转成了 WebP，所以卡片这条路通常轮不到显形；原图回退那条才用得上。
      const revealable = /^image\/(jpeg|png)/i.test(mime);
      const maxReveals = !revealable ? 0 : (job.total > DL_STREAM_CAP ? 0 : (job.total > DL_REVEAL_BIG ? 3 : DL_REVEAL_MAX));
      const reader = res.body.getReader();
      let lastReveal = 0, reveals = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        job.bytes += value.length;
        if (job.total && job.bytes > job.total) job.total = 0; // 响应被压缩之类：总长不可信了，退回不定长
        const pct = job.total ? Math.min(99, Math.floor((job.bytes / job.total) * 100)) : 0; // 还没读完不许写 100%
        if (pct !== job.pct) { job.pct = pct; sink.paint(); }
        if (reveals < maxReveals && job.bytes >= DL_REVEAL_MIN) {
          const now = performance.now();
          if (now - lastReveal >= (reveals >= DL_REVEAL_MAX ? DL_REVEAL_SLOW_MS : DL_REVEAL_MS)) {
            lastReveal = now;
            reveals++;
            if (await dlSwap(job, new Blob(chunks, { type: mime }))) sink.frame();
          }
        }
        if (epoch !== dlEpoch || !sink.alive()) { // 目标已经不在了（卡片被清出网格 / 灯箱关了或换了图）
          reader.cancel().catch(() => {});
          if (sink.cancel) sink.cancel();
          return;
        }
      }
      if (!(await dlSwap(job, new Blob(chunks, { type: mime })))) throw new Error('这一帧解不出来');
      if (job.total) { job.pct = 100; sink.paint(); }
      sink.done();
    } catch (e) {
      if (e && e.name === 'AbortError') return;  // 主动掐的：目标已经不在，什么都不能碰
      // 连响应都没拿到 = 网络/CORS 级失败：这条路整会话作废，后面的卡片直接走原生。
      // 不用 e instanceof TypeError 判断：那是跨 realm 就不成立的写法（比如被别的作用域里的
      // fetch 拒绝、或测试桩抛的错），而这条判定的代价是一整轮白试。
      if (!gotResponse) dlOk = false;
      sink.fail();
    } finally {
      clearTimeout(showTimer);
      dlInflight.delete(ctrl);
    }
  }

  // 悬停意图预取：灯箱用的是原图 URL，和网格的裁切 URL 不是同一个，不预取的话点开必然从头下一遍。
  // 门槛故意设得偏长（700ms）：鼠标扫过一排卡片不该触发几 MB 的下载，只有真的停下来看的那张才值。
  // 取回的字节直接丢掉，图的是落进 HTTP 缓存 —— 点开时那次 fetch 命中缓存，灯箱就是秒开。
  // 优先级压到 low：网格自己还在下缩略图时，别跟它抢带宽。
  const PF_HOVER_MS = 700;
  const PF_MAX_BYTES = 6 << 20; // 超过这个大小的原图不预取：替用户省流量，比替他省一次等待重要
  let pfTimer = 0;
  let pfCtrl = null;

  function pfCancel() {
    clearTimeout(pfTimer);
    pfTimer = 0;
    if (pfCtrl) { pfCtrl.abort(); pfCtrl = null; }
  }

  function pfHover(key) {
    pfCancel(); // 换到别的卡片：上一张的意图作废
    if (dlOk === false || lightboxItem) return; // 这条路走不通、或正在看大图，都不预取
    pfTimer = setTimeout(() => pfStart(publicUrl(key)), PF_HOVER_MS);
  }

  async function pfStart(url) {
    if (document.hidden || lightboxItem) return;
    const ctrl = new AbortController();
    pfCtrl = ctrl;
    try {
      const res = await fetch(url, { mode: 'cors', signal: ctrl.signal, priority: 'low' });
      if (!res.ok) return;
      if ((Number(res.headers.get('content-length')) || 0) > PF_MAX_BYTES) { ctrl.abort(); return; }
      await res.arrayBuffer(); // 读完才会真的落进 HTTP 缓存，只拿响应头不算
    } catch (e) {
      /* 预取失败无所谓：点开时照旧走正常流程 */
    } finally {
      if (pfCtrl === ctrl) pfCtrl = null;
    }
  }

  // 网格被清空（切视图、切相册、刷新）时调用：排队中的直接丢，在途的 abort，发出去的 blob 全部回收。
  // 得和「清空网格」成对出现，所以只在清网格那几处调用。
  function dlCancelAll() {
    dlEpoch++;
    dlQueue.length = 0;
    for (const ctrl of dlInflight) ctrl.abort();
    // dlActive 不在这里清零：在途请求会在自己的 finally 里还回并发位，
    // 直接清零的话，abort 陆续回来时会把计数减成负数，队列从此不再前进
    for (const url of dlBlobs) URL.revokeObjectURL(url);
    dlBlobs.clear();
    if (dlIO) dlIO.disconnect();
  }

  /** 揭开敏感内容遮罩：移掉覆盖层，**这之后才去取原图**（此前只下过缩略图） */
  function revealCover(fig, row) {
    fig.classList.remove('is-covered');
    const hint = fig.querySelector('.cover-hint');
    if (hint) hint.remove();
    const img = fig.querySelector('img');
    if (!img) return;
    delete img.dataset.raw; // 允许它重新走一次加载
    // 到这一步才是「真的要看」—— 取原图
    dlLoad({
      fig, img, epoch: dlEpoch,
      url: row.url, rawUrl: row.url, thumb: false,
      bytes: 0, total: 0, pct: 0, started: false, blobUrl: null,
    });
  }

  function renderGridItem(it, mode) {
    const isPublic = mode === 'public';
    const fig = document.createElement('figure');
    fig.dataset.key = it.key;
    fig.dataset.id = it.id; // 新接口的写操作都按 id 走（键是不可变的，但 id 才是主键）
    fig.classList.add('ph'); // 缩略图骨架层，图片 onload 后摘掉（见 .grid figure.ph::before）
    if (!isPublic) {
      if (selectMode) fig.classList.add('selectable');
      const check = document.createElement('span');
      check.className = 'sel-check';
      check.hidden = !selectMode;
      check.appendChild(icon('check'));
      fig.appendChild(check);
    }
    const rawUrl = it.url || publicUrl(it.key);
    // 缩略图是**独立的 R2 对象**（上传时由浏览器生成），不是给原图加查询参数 ——
    // R2 会忽略未知查询参数、拿原图回 200，「缩略图取不到就退回原图」的判断就永远不触发了。
    // 没有缩略图的图（SVG/ICO、生成失败、还没补全的旧图）直接用原图。
    const thumbUrlFull = it.thumb_url || null;
    const useThumb = !!thumbUrlFull;
    // 敏感内容遮罩：公开视图里 R15/R18 默认盖一层（底下一张重糊的缩略图），点一下才揭开。
    // 提前算出来是因为下面 onerror 也要用（遮罩状态下不允许回退到原图）。
    const covered = isPublic && !publicRevealAll() && COVERED_RATINGS.includes(it.rating);
    const img = document.createElement('img');
    img.loading = 'lazy'; // 自取时是 IntersectionObserver 在管，这个只在退回原生那条路上生效
    img.draggable = false; // 让外层 figure 接管拖拽，避免浏览器拖出图片 URL
    // 必须先挂事件再赋 src：缓存命中时 load 可能在监听器挂上之前就派发完了
    img.onload = () => fig.classList.remove('ph');
    img.onerror = () => {
      // 遮罩状态下只取缩略图：取不到就保持糊着，**绝不回退到原图**
      if (covered) return;
      // 缩略图退回原图的整个过程 .ph 仍在，shimmer 自然盖住重试；原图也失败则整张卡片一起移除
      if (useThumb && !img.dataset.raw) { img.dataset.raw = '1'; img.src = rawUrl; }
      else fig.remove();
    };
    if (covered) {
      fig.classList.remove('ph'); // 骨架层让位给遮罩，否则底下一直在闪
      fig.classList.add('is-covered');
      const hint = document.createElement('div');
      hint.className = 'cover-hint';
      const txt = document.createElement('span');
      txt.className = 'cover-text';
      txt.textContent = '可能包含敏感内容';
      const btn = document.createElement('span');
      btn.className = 'cover-btn';
      btn.textContent = '查看';
      hint.append(txt, btn);
      fig.appendChild(hint);
      // 只下**缩略图**（512px 那张）：能看出大致轮廓，但看不清内容。
      // 注意 rawUrl 也指向缩略图 —— 下载器任何一条回退路径都不会去取原图。
      if (thumbUrlFull) {
        dlLoad({
          fig, img, epoch: dlEpoch,
          url: thumbUrlFull, rawUrl: thumbUrlFull, thumb: true,
          bytes: 0, total: 0, pct: 0, started: false, blobUrl: null,
        });
      }
    } else {
      // 下载交给下载器：它自己决定是流式自取（有百分比与增量显形）还是退回原生加载
      dlLoad({
        fig, img, epoch: dlEpoch,
        url: useThumb ? thumbUrlFull : rawUrl,
        rawUrl, thumb: useThumb,
        bytes: 0, total: 0, pct: 0, started: false, blobUrl: null,
      });
    }
    // 悬停意图：停够一会儿就预取原图，点开大图时正好命中缓存（见 pfHover）。
    // 被遮罩的卡片不预取：遮罩的规矩是「点一下才算同意查看」，而预取拉的是**原图** ——
    // 鼠标顺路扫过就把敏感原图落进缓存，等于绕过遮罩（详见 renderGridItem 里 covered 那支）。
    if (!covered) {
      fig.addEventListener('mouseenter', () => pfHover(it.key));
      fig.addEventListener('mouseleave', pfCancel);
    }
    if (img.complete && img.naturalWidth) fig.classList.remove('ph'); // 兜底：内存缓存命中时不再派发 load
    // 显示原始文件名：新键是时间戳+随机（不含文件名），名字保存在数据库里
    const name = it.filename || it.key.split('/').pop();
    const cap = document.createElement('figcaption');
    if (!isPublic) {
      // 文件名前的公开状态徽标：不悬停也能看到是否公开
      const badge = document.createElement('span');
      badge.className = 'pub-badge';
      badge.textContent = it.rating === 'unspecified' ? '' : it.rating; // 能进相册才显示分级
      badge.className = 'pub-badge r-' + it.rating; // 按档位着色，一眼分出哪些是敏感内容
      badge.hidden = !isPublished(it);
      cap.appendChild(badge);
    }
    cap.appendChild(document.createTextNode(name));
    fig.append(img, cap);
    // 链接**到点击时现算**，不要在渲染时算成常量：重命名会就地改 it.filename，
    // 而渲染时算好的那份会一直停在旧名字上 —— 表现是「改完名字，右键复制的 alt 还是旧的」。
    const links = () => makeLinks(rawUrl, it.filename || it.key.split('/').pop());
    if (isPublic) {
      // 游客视图：只读。被遮住的先揭开（第一下点击不下图，是「同意查看」那一下）
      fig.onclick = () => {
        if (fig.classList.contains('is-covered')) return revealCover(fig, it);
        openLightbox(it);
      };
      fig.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        showCtxMenu(e.clientX, e.clientY, [
          { icon: 'zoom', label: '查看大图', onClick: () => openLightbox(it) },
          '-',
          { icon: 'link', label: '复制 URL', onClick: () => copyText(links().url) },
          { icon: 'md', label: '复制 Markdown', onClick: () => copyText(links().markdown) },
          { icon: 'code', label: '复制 HTML', onClick: () => copyText(links().html) },
          '-',
          { icon: 'download', label: '下载', onClick: () => downloadImage(it) },
        ]);
      });
      return fig;
    }
    // 公开状态切换：先给默认值，公开状态加载完成前按钮也不会空白
    const pub = document.createElement('button');
    pub.className = 'pub-toggle';
    pub.appendChild(icon(it.is_hidden ? 'moon' : 'globe'));
    pub.title = it.is_hidden ? '已隐藏（点击取消隐藏）' : '隐藏（不进相册，直链仍可打开）';
    pub.classList.toggle('on', !it.is_hidden);
    pub.onclick = (e) => { e.stopPropagation(); togglePublic(it.key); };
    fig.appendChild(pub);
    // 拖拽移动：多选模式下拖动已选中的图片会移动整批
    fig.draggable = true;
    fig.addEventListener('dragstart', (e) => {
      const keys = selectMode && selectedKeys.has(it.key) ? [...selectedKeys] : [it.key];
      dragPayload = { kind: 'image', keys };
      e.dataTransfer.effectAllowed = 'move';
      try {
        e.dataTransfer.setData('application/x-picbed-move', 'image');
        e.dataTransfer.setData('text/plain', keys.join('\n'));
      } catch (err) {}
      fig.classList.add('dragging');
    });
    fig.addEventListener('dragend', () => {
      fig.classList.remove('dragging');
      dragPayload = null;
    });
    // 多选：单击选中、Ctrl/Cmd+单击反选、Shift+单击连选
    fig.onclick = (e) => {
      if (!selectMode) { openLightbox(it); return; }
      if (e.shiftKey && anchorFig && anchorFig !== fig) {
        selectRange(anchorFig, fig, !!(e.ctrlKey || e.metaKey));
      } else if (e.ctrlKey || e.metaKey) {
        setFigSelected(fig, !selectedKeys.has(fig.dataset.key));
        anchorFig = fig;
      } else {
        clearSelection();
        setFigSelected(fig, true);
        anchorFig = fig;
      }
      updateBulkBar();
    };
    // 右键菜单：常用的单图操作
    fig.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const hidden = !!it.is_hidden;
      showCtxMenu(e.clientX, e.clientY, [
        { icon: 'zoom', label: '查看大图', onClick: () => openLightbox(it) },
        '-',
        { icon: 'link', label: '复制 URL', onClick: () => copyText(links().url) },
        { icon: 'md', label: '复制 Markdown', onClick: () => copyText(links().markdown) },
        { icon: 'code', label: '复制 HTML', onClick: () => copyText(links().html) },
        { icon: 'download', label: '下载', onClick: () => downloadImage(it) },
        '-',
        { icon: hidden ? 'globe' : 'moon', label: hidden ? '取消隐藏' : '隐藏', onClick: () => togglePublic(it.key) },
        '-',
        // 分级：只决定「进不进相册」，不影响直链
        ...['G', 'R12', 'R15', 'R18', 'unspecified'].map((r) => ({
          label: (it.rating === r ? '✓ ' : '') + '分级：' + (r === 'unspecified' ? '未分类' : r),
          onClick: () => setRating(it.key, r),
        })),
        '-',
        { icon: 'pencil', label: '重命名…', onClick: () => renameImage(it.key) },
        { icon: 'move', label: '移动到相册…', onClick: () => moveImagesDialog([it.key]) },
        '-',
        { icon: 'trash', label: '删除图片', danger: true, onClick: () => deleteImagesDialog([it.key]) },
      ]);
    });
    return fig;
  }

  // ---------- 灯箱 ----------
  let lightboxItem = null;
  let lightboxJob = null; // 灯箱大图当前那次下载（关灯箱时掐掉）

  /**
   * 把「这张图叫什么」相关的东西绑到灯箱上：标题 + 三个复制按钮。
   *
   * 单独拎成一个函数，是因为**改名之后必须重绑一次** —— 复制按钮的 onclick 捕获的是当时算好的
   * links，不重绑的话，从灯箱里改完名字再复制，粘出去还是旧 alt（灯箱不关就看不出问题）。
   */
  function bindLightboxName(item) {
    const url = publicUrl(item.key);
    // 显示名字（键是时间戳+随机，对人不友好）
    $('lightboxName').textContent = item.filename || item.key;
    // alt 用**显示名**（没有才退到键的最后一段 —— 那串时间戳+随机是给人看的最差选择）
    const links = makeLinks(url, item.filename || item.key.split('/').pop());
    document.querySelectorAll('.lightbox-actions [data-fmt]').forEach((b) => {
      b.onclick = () => copyText(links[b.dataset.fmt]);
    });
  }

  function updateLightboxPublicBtn() {
    if (!lightboxItem) return;
    const row = itemsByKey.get(lightboxItem.key);
    const hidden = !!(row && row.is_hidden);
    const btn = $('togglePublicBtn');
    setIcon(btn, hidden ? 'globe' : 'moon');
    setLabel(btn, hidden ? '取消隐藏' : '隐藏');
    btn.title = hidden ? '已隐藏（点击取消隐藏）' : '隐藏（不进相册，直链仍可打开）';
    btn.classList.toggle('on', !hidden);
  }

  function openLightbox(item) {
    lightboxItem = item;
    const url = publicUrl(item.key);
    // 原图走同一套流式下载：几 MB 的大图是全站最需要进度的地方。
    // 先把 src 清掉，免得新图还没到就先行显示上一张（灯箱的 img 会记住上次的图）。
    if (lightboxJob) { // 上一次还没收干净（连点两张）：连它的 blob 一起收掉，别留在集合里
      lightboxJob.cancelled = true;
      if (lightboxJob.ctrl) lightboxJob.ctrl.abort();
      if (lightboxJob.blobUrl) { dlBlobs.delete(lightboxJob.blobUrl); URL.revokeObjectURL(lightboxJob.blobUrl); }
    }
    pfCancel(); // 预取和这次下载是同一个 URL，别让它俩并行各下一遍
    const img = $('lightboxImg');
    img.removeAttribute('src');
    $('lightboxDl').hidden = true;
    lightboxJob = { img, url, rawUrl: url, thumb: false, epoch: dlEpoch, bytes: 0, total: 0, pct: 0, started: false, blobUrl: null };
    dlStream(lightboxJob, dlBoxSink(lightboxJob)).catch(() => {});
    bindLightboxName(item);
    $('downloadBtn').onclick = () => downloadImage(item, $('downloadBtn'));
    $('renameBtn').onclick = () => renameImage(item.key);
    // 游客视图只读：隐藏删除、重命名与公开切换
    const isAdmin = view === 'admin';
    $('deleteBtn').hidden = !isAdmin;
    $('renameBtn').hidden = !isAdmin;
    $('togglePublicBtn').hidden = !isAdmin;
    $('lightboxRatingWrap').hidden = !isAdmin;
    if (isAdmin) {
      const row = itemsByKey.get(item.key);
      $('lightboxRating').value = (row && row.rating) || 'unspecified';
      updateLightboxPublicBtn();
    }
    $('lightbox').hidden = false;
  }

  function closeLightbox() {
    // 关灯箱就别让大图继续下了：几 MB 的东西，用户已经不想看了
    if (lightboxJob) {
      lightboxJob.cancelled = true; // 正在等解码的那次换帧也得作废（见 dlSwap 的注释）
      if (lightboxJob.ctrl) lightboxJob.ctrl.abort();
      if (lightboxJob.blobUrl) { dlBlobs.delete(lightboxJob.blobUrl); URL.revokeObjectURL(lightboxJob.blobUrl); }
      lightboxJob = null;
    }
    $('lightboxDl').hidden = true;
    $('lightbox').hidden = true;
    lightboxItem = null;
  }

  /**
   * 存盘用的文件名：以显示名为准，它没写扩展名就把真实的补上。
   * 补扩展名是因为显示名是自己起的（可能就叫「风景 01」），那样存下来没有扩展名，
   * 系统不给它配图标、也不好双击打开。非法字符换成 _ —— 显示名里允许有它们（它只是界面文本），
   * 但当文件名用会被系统拦下或悄悄替换掉。
   */
  function downloadName(item) {
    const base = String(item.filename || item.key.split('/').pop() || 'image')
      .replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_')
      .trim() || 'image';
    if (/\.[A-Za-z0-9]{1,8}$/.test(base)) return base; // 已经带扩展名了：尊重用户起的名字
    const ext = /\.[^./]+$/.exec(item.key);
    return base + (ext ? ext[0] : '');
  }

  /**
   * 下载这张图 —— 先把字节取成 blob 再存盘，为的是能控制存下来的文件名。
   *
   * 为什么不直接写 `<a href="直链" download="名字">`：
   *   1. download 属性只在**同源**下生效，图在 img.ohtoai.top、页面在 picbed.ohtoai.top，会被忽略；
   *   2. 服务端也没法可靠地把名字告诉浏览器：Content-Disposition 的 `inline; filename=`
   *      不被「图片另存为」采纳（规范只保证 attachment 会预填对话框），而 attachment 会强制下载、
   *      图片再也不能内嵌显示 —— 对图床是自毁。
   * 自己取成 blob 就没这些限制：blob 是本站源的，download 一定生效，什么浏览器都按这个名字存。
   * 字节要过一遍 JS，但多半不用走网络：灯箱刚用同一个 URL 下过原图，服务端给了 Cache-Control，
   * 这一趟基本命中 HTTP 缓存。
   */
  async function downloadImage(item, btn) {
    const name = downloadName(item);
    const url = item.url || publicUrl(item.key);
    const label = btn && btn.querySelector('.lbl');
    if (btn) btn.disabled = true;
    if (label) label.textContent = '下载中…';
    else toast('正在下载…'); // 右键菜单那条路没有按钮可以显示状态，只能靠 toast（大图会等一会儿）
    try {
      const res = await fetch(url, { mode: 'cors' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl;
      a.download = name;
      document.body.appendChild(a); // Firefox 要求节点在文档里才认这次点击
      a.click();
      a.remove();
      // 延后回收：click() 之后浏览器才去读这个 blob，立刻 revoke 会把下载打断
      setTimeout(() => URL.revokeObjectURL(objUrl), 30000);
      toast('已保存 ' + name);
    } catch (e) {
      toast('下载失败：' + errMsg(e), true);
    } finally {
      if (btn) btn.disabled = false;
      if (label) label.textContent = '下载';
    }
  }

  // ---------- URL 转存 ----------
  async function transferUrl() {
    const input = $('urlInput');
    const url = input.value.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) return toast('请输入 http(s) 链接', true);
    if (!needWorker()) return;
    const release = beginLoad(); // 转存要等 Worker 抓远程图片，可能好几秒
    const btn = $('urlBtn');
    btn.disabled = true;
    setLabel(btn, '转存中…');
    try {
      // 由 Worker 抓取远程图片并存进 R2（大小上限同上传、15 秒超时）
      const data = await apiSend('/api/transfer', 'POST', { url, rating: currentUploadRating() });
      input.value = '';
      const image = data.image;
      toast('转存成功');
      addResult(image.url, image.filename);
      saveHistory(image.url, image.filename);
      // 转存的图没有缩略图（服务端生成不了），会进「批量补缩略图」的队列
      remember(image);
      loadGallery(true);
    } catch (e) {
      toast(e.message, true);
    } finally {
      release();
      btn.disabled = false;
      setLabel(btn, '转存');
    }
  }

  // ---------- 批量补缩略图 ----------
  // 没有缩略图的图（迁移过来的旧图、SVG/ICO 这类跳过处理的、生成失败的）一直是原图直出，
  // 在相册里就是又慢又费流量。这个工具在浏览器里逐张跑：拉原图 → canvas 生成 → 上传。
  // 免费、可中断、下次接着补
  // （补好的会自动从「还没有缩略图」的查询里消失）。
  let backfilling = false;

  /** 拉原图并生成缩略图。先 fetch 成 blob 再交给 canvas —— 这样画布同源、不被污染，toBlob 才可用 */
  async function fetchThumbSource(url) {
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) return null;
    const blob = await res.blob();
    if (!blob.size) return null;
    return await makeThumb(new File([blob], 'source', { type: blob.type }));
  }

  async function backfillThumbs() {
    if (backfilling) return toast('补全任务正在跑', true);
    const btn = $('backfillThumbs');

    let probe;
    try {
      probe = await api('/api/images?thumb=missing&pageSize=1');
    } catch (e) {
      return toast('查询失败：' + errMsg(e), true);
    }
    if (!probe.total) return toast('所有图片都有缩略图了');

    const ok = await confirmDialog({
      title: '批量补缩略图',
      message: `还有 ${probe.total} 张图没有缩略图。补全需要逐张重新下载原图、在本地生成后上传，会花一些时间并消耗下行流量。`
        + '中途可以刷新页面中断，下次会接着补。',
      okText: '开始补全',
    });
    if (!ok) return;

    backfilling = true;
    btn.disabled = true;
    const release = beginLoad();
    let done = 0;
    let skipped = 0;
    // 有些图永远生成不出缩略图（浏览器解不开的格式、超过尺寸门槛），记下来跳过，
    // 否则每轮都会把它们捞出来，循环停不下来
    const giveUp = new Set();

    try {
      for (;;) {
        // 每轮都取第一页：补好的会自动从 ?thumb=missing 里消失
        const page = await api('/api/images?thumb=missing&pageSize=5');
        const todo = (page.images || []).filter((r) => !giveUp.has(r.id));
        if (!todo.length) break;

        for (const row of todo) {
          setLabel(btn, `补全中 ${done + skipped}`);
          try {
            const blob = await fetchThumbSource(row.url);
            if (!blob) { giveUp.add(row.id); skipped++; continue; }
            await api('/api/images/' + row.id + '/thumb', {
              method: 'PUT',
              headers: { 'content-type': blob.type || 'image/webp' },
              body: blob,
            });
            invalidateListCache(); // 这张的 thumb_url 变了，缓存的列表里还是 NULL
            done++;
          } catch (e) {
            console.warn('[picbed] 补缩略图失败 id=' + row.id + '：' + (e.message || e));
            giveUp.add(row.id);
            skipped++;
          }
        }
      }
      toast(`补缩略图完成：成功 ${done} 张${skipped ? `，跳过 ${skipped} 张（格式不支持或过大）` : ''}`);
      loadGallery(true);
    } catch (e) {
      toast('补缩略图中断：' + errMsg(e), true);
    } finally {
      backfilling = false;
      btn.disabled = false;
      setLabel(btn, '补缩略图');
      release();
    }
  }

  // ---------- 设置 ----------
  function openSettings() {
    $('setWorker').value = cfg.api;
    $('setPassword').value = cfg.password;
    $('setFormat').value = cfg.format;
    $('settingsDialog').hidden = false;
  }

  function closeSettings() { $('settingsDialog').hidden = true; }

  function applySettings() {
    cfg.api = $('setWorker').value.trim().replace(/\/+$/, '');
    cfg.password = $('setPassword').value;
    cfg.format = $('setFormat').value;
    invalidateAlbumTree();
    dlOk = null; // 换了后端就重新判一次能不能自取（CORS 是域名级的，新域名可能是另一回事）
    saveSettings();
    toast('设置已保存');
    closeSettings();
    // 密码与后端地址都填好才能进管理视图，否则留在公开画廊
    switchView(cfg.api && cfg.password ? 'admin' : 'public');
  }

  // ---------- 事件绑定 ----------
  // 选择文件与全页拖放上传
  $('uploadBtn').onclick = () => $('fileInput').click();
  $('fileInput').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
  // 文件夹上传：webkitRelativePath 形如 "我的相册/2024/a.jpg"
  $('uploadDirBtn').onclick = () => $('dirInput').click();
  $('dirInput').onchange = (e) => {
    const files = [...e.target.files];
    for (const f of files) {
      // 保留最外层文件夹名：选「我的相册」→ 当前目录下生成「我的相册」相册
      const rel = (f.webkitRelativePath || f.name).replace(/\\/g, '/');
      try { Object.defineProperty(f, '__relPath', { value: rel }); } catch (err) {}
    }
    if (files.length) toast(`正在扫描文件夹…（${files.length} 个文件）`);
    addFiles(files);
    e.target.value = '';
  };
  // 上传目标提示：悬停在子相册上时显示该相册名
  function updateDropLabel() {
    const album = uploadTargetPrefix === null || uploadTargetPrefix === undefined ? galleryAlbum : uploadTargetPrefix;
    const name = album ? album.split('/').pop() : '全部图片';
    $('dropTargetLabel').textContent = `松开鼠标，上传到「${name}」`;
  }
  let dragDepth = 0;
  // 结束一次文件拖放：隐藏遮罩并复位拖拽状态
  function endFileDrag() {
    dragDepth = 0;
    $('dropOverlay').hidden = true;
    uploadTargetPrefix = null; // 复位后后续拖拽默认「上传到当前相册」
  }
  window.addEventListener('dragenter', (e) => {
    if (view !== 'admin') return; // 游客视图不接受上传
    if (!hasFilePayload(e.dataTransfer)) return;
    e.preventDefault();
    dragDepth++;
    $('dropOverlay').hidden = false;
    updateDropLabel();
  });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) endFileDrag();
  });
  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    endFileDrag();
    if (view !== 'admin') return;
    const files = await collectFromDataTransfer(e.dataTransfer);
    if (files.length) addFiles(files);
  });

  document.addEventListener('paste', (e) => {
    if (view !== 'admin') return;
    if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
    const files = [];
    for (const it of (e.clipboardData || {}).items || []) {
      if (it.kind === 'file' && it.type && it.type.startsWith('image/')) files.push(it.getAsFile());
    }
    if (files.length) { e.preventDefault(); addFiles(files); return; }
    const text = e.clipboardData && e.clipboardData.getData ? e.clipboardData.getData('text').trim() : '';
    if (/^https?:\/\//i.test(text)) {
      e.preventDefault();
      $('urlInput').value = text;
      toast('检测到链接，已填入转存框');
    }
  });

  $('urlBtn').onclick = transferUrl;
  $('urlInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') transferUrl(); });
  $('copyAllBtn').onclick = copyAllResults;
  $('settingsBtn').onclick = () => openSettings();
  // 直接打一次列表接口：既验证地址可达，也验证密码对不对。
  $('probeBtn').onclick = async () => {
    const out = $('probeResult');
    out.textContent = '测试中…';
    try {
      const data = await api('/api/images?pageSize=1');
      out.textContent = `连接正常\n后端：${cfg.api}\n当前共 ${data.total} 张图片`;
    } catch (e) {
      out.textContent = (e.status === 403 || e.status === 503 ? '密码不对或服务端未配置密码：' : '连接失败：') + errMsg(e);
    }
  };
  $('saveSettings').onclick = applySettings;
  $('closeSettings').onclick = closeSettings;
  $('settingsDialog').addEventListener('click', (e) => { if (e.target === $('settingsDialog')) closeSettings(); });
  $('refreshGallery').onclick = () => loadGallery(true);
  $('backfillThumbs').onclick = backfillThumbs;
  $('loadMore').onclick = () => (view === 'public' ? loadPublicGallery(false) : loadGallery(false));
  $('newAlbumBtn').onclick = newAlbum;
  $('selectModeBtn').onclick = toggleSelectMode;
  $('bulkSelectAllBtn').onclick = selectAllImages;
  $('bulkInvertBtn').onclick = invertSelection;
  $('bulkMoveBtn').onclick = () => moveImagesDialog([...selectedKeys]);
  $('bulkPublicBtn').onclick = bulkTogglePublic;
  $('bulkDeleteBtn').onclick = () => deleteImagesDialog([...selectedKeys]);
  $('bulkCancelBtn').onclick = clearSelection;
  // 视图切换
  $('tabPublic').onclick = () => { if (view !== 'public') switchView('public'); };
  $('tabAdmin').onclick = () => {
    if (view === 'admin') return;
    if (!cfg.api || !cfg.password) {
      openSettings();
      toast('请填写后端地址与上传密码后再进入管理视图', true);
      return;
    }
    switchView('admin');
  };
  $('clearHistory').onclick = () => { history = []; persistHistory(); renderHistory(); };
  $('deleteBtn').onclick = async () => {
    if (!lightboxItem) return;
    // 弹窗等待期间灯箱可能被关闭（closeLightbox 会清空 lightboxItem），先把 key 记下来
    const key = lightboxItem.key;
    const ok = await confirmDialog({
      title: '删除图片',
      message: '确定删除这张图片？此操作不可恢复。',
      okText: '删除',
    });
    if (!ok) return;
    closeLightbox();
    try {
      await deleteImages([key]); // 连带清理公开标记
    } catch (err) {
      toast('删除失败（走 CDN 的话缓存可能仍短暂可见）：' + (err.message || err), true);
    }
  };
  $('togglePublicBtn').onclick = () => { if (lightboxItem) togglePublic(lightboxItem.key); };
  $('lightboxRating').onchange = (e) => { if (lightboxItem) setRating(lightboxItem.key, e.target.value); };
  $('bulkRating').onchange = (e) => {
    const v = e.target.value;
    e.target.value = ''; // 选完复位，避免它看起来像个「当前值」
    if (v) bulkSetRating(v);
  };
  $('lightboxClose').onclick = closeLightbox;
  $('lightbox').addEventListener('click', (e) => { if (e.target === $('lightbox')) closeLightbox(); });

  // 上传状态悬浮按钮与面板
  $('uploadFab').onclick = togglePanel;
  $('panelClose').onclick = closePanel;
  $('panelBackdrop').onclick = closePanel;

  // Esc：只关闭最上面的一层（右键菜单 > 弹窗 > 灯箱 > 面板）；Ctrl/Cmd+A：多选模式下全选
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!$('ctxMenu').hidden) { hideCtxMenu(); return; }
      if (!$('promptDialog').hidden) { $('promptCancel').click(); return; }
      if (!$('confirmDialog').hidden) { $('confirmCancel').click(); return; }
      if (!$('settingsDialog').hidden) { closeSettings(); return; }
      if (!$('lightbox').hidden) { closeLightbox(); return; }
      if (!$('uploadPanel').hidden) { closePanel(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'a') {
      if (view !== 'admin' || !selectMode) return;
      const t = e.target;
      const tag = t && t.tagName ? String(t.tagName).toUpperCase() : '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) return;
      e.preventDefault();
      selectAllImages();
    }
  });

  // ---------- 初始化 ----------
  $('bucketInfo').textContent = 'R2 · D1';

  // 顶栏高度写回 --appbar-h，供吸顶的面包屑 / 多选栏避让。
  // 用 ResizeObserver 而不是写死数值：窄屏顶栏 wrap 换行后高度会变。
  const appbar = document.querySelector('.appbar');
  const syncAppbarH = () => {
    document.documentElement.style.setProperty('--appbar-h', appbar.offsetHeight + 'px');
  };
  syncAppbarH();
  if (window.ResizeObserver) new ResizeObserver(syncAppbarH).observe(appbar);

  // GitHub 入口：config.js 里没填 repo 就不显示（不硬编码地址）
  if (cfg.repo) {
    const link = $('repoLink');
    link.href = cfg.repo;
    link.title = '查看源码仓库';
    link.hidden = false;
  }

  // 浏览器前进/后退：相册现在是 URL 的一部分，所以要跟着走
  window.addEventListener('popstate', () => {
    if (view !== 'public') return; // 管理视图的相册不入地址栏，交给它自己
    publicAlbum = new URLSearchParams(location.search).get('album') || '';
    loadPublicGallery(true);
  });

  renderHistory();
  updateUploadFab();
  switchView(view); // 有密码直接进管理视图，否则先看公开画廊
  if (!cfg.api) openSettings();
})();
</script>
</body>
</html>
