<script src="config.js"></script>
<script>
(function () {
  'use strict';

  // ---------- 配置 ----------
  const DEFAULTS = {
    // api = 后端（Worker）地址；imageBase = 图片直链域名（R2 桶的自定义域名）
    api: '', imageBase: '',
    format: 'url', password: '',
    repo: '', // 源码仓库地址，填了就在顶栏给访客显示 GitHub 入口
  };
  let cfg = Object.assign({}, DEFAULTS, window.PICBED_CONFIG || {});
  const STORE_KEY = 'picbed_settings';
  try {
    // 本机只存 api / password / format（见 saveSettings）。老版本可能还存着 thumb、worker、
    // customDomain 之类的键 —— 那些字段现在没人读，合并进来也无害，不必专门删。
    cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(STORE_KEY) || '{}'));
  } catch (e) { /* 存的不是合法 JSON：当没有 */ }

  function saveSettings() {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      api: cfg.api, password: cfg.password, format: cfg.format,
    }));
  }

  // ---------- 通用 ----------
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const FMT = ['url', 'markdown', 'html'];
  const FMT_LABEL = { url: 'URL', markdown: 'MD', html: 'HTML' };
  const FMT_ICON = { url: 'link', markdown: 'md', html: 'code' };
  const IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'avif', 'bmp', 'ico'];

  function toast(msg, isError) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.className = ''; }, 2600);
  }

  // ---------- 图标 ----------
  // 引用 sprite 里的 <symbol>；viewBox 写在 symbol 上，外层 svg 不用再写
  function icon(name, cls) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', cls ? 'ic ' + cls : 'ic');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#i-' + name);
    svg.appendChild(use);
    return svg;
  }

  // 只换 <use href>，不动按钮上的文案节点（textContent 会连图标一起抹掉）
  function setIcon(el, name) {
    const use = el && el.querySelector('use');
    if (use) use.setAttribute('href', '#i-' + name);
  }

  // 改按钮文案：文案必须放在 .lbl 里，否则会把按钮内的图标一起抹掉
  function setLabel(el, text) {
    const lbl = el && el.querySelector('.lbl');
    if (lbl) lbl.textContent = text;
    else if (el) el.textContent = text;
  }

  // ---------- 加载指示：顶部进度条 + 网格骨架 ----------
  // 进度条走引用计数而不是 show/hide 配对：一次操作可能并发好几个请求
  // （比如上传在跑、同时还在拉列表），谁先返回谁先结束，
  // 配对的写法会让进度条在另一个还在请求时就消失。
  let busyCount = 0;
  let barShowTimer = 0;
  let barHideTimer = 0;

  function progressBar(show) {
    const bar = $('progressBar');
    if (!bar) return;
    // 必须先清掉显示定时器：否则「延迟 120ms 才亮」的它会在加载结束后才点亮进度条，再没人关
    clearTimeout(barShowTimer);
    clearTimeout(barHideTimer);
    if (!show) {
      bar.classList.remove('on');
      barHideTimer = setTimeout(() => { bar.hidden = true; }, 220); // 等淡出走完再 display:none
      return;
    }
    if (!bar.hidden) { bar.classList.add('on'); return; } // 已在显示，直接续上，不再等 120ms
    barShowTimer = setTimeout(() => { bar.hidden = false; bar.classList.add('on'); }, 120);
  }

  // 开始一次加载，返回幂等的 release()：catch 与 finally 里都调也不会把计数减穿
  function beginLoad() {
    busyCount++;
    if (busyCount === 1) progressBar(true);
    let released = false;
    return function release() {
      if (released) return; // 减两次会让计数永远回不到 0，进度条从此不再出现
      released = true;
      busyCount = Math.max(0, busyCount - 1);
      if (busyCount === 0) progressBar(false);
    };
  }

  // 加载态分两处表达：
  //   · 转圈 + 文案走 .gallery-meta 那一行（网格上方，高度写死，切换时不推动网格）
  //   · 骨架走 #gallerySkeleton —— 一个贴住网格位置的固定层，只在 reset 加载时铺
  // 骨架刻意**不**铺进 #galleryGrid：铺进去它就参与文档高度，估多几像素就是一条滚动条，
  // 于是只能反过来量 scrollHeight 一层层往回撤（上一版的写法，为此还顺手把页面滚动条藏了）。
  // 挪出文档流之后，「铺满一屏」和「不许冒滚动条」不再打架，多铺的格子被 overflow:hidden 裁掉即可。
  const SK_MAX = 60;            // 上限：超长屏上不必铺出几百个节点
  const SK_COUNT_FALLBACK = 12; // 量不到网格宽度时的保守数量（视图还没就绪）
  let gridLoaderSeq = 0;
  let gridLoaderOwner = 0;

  function skeletonTile() {
    const tile = document.createElement('div');
    tile.className = 'sk-tile';
    const im = document.createElement('div');
    im.className = 'sk-img';
    const cap = document.createElement('div');
    cap.className = 'sk-cap';
    tile.append(im, cap);
    return tile;
  }

  // 把骨架层贴到网格当前的盒子上再铺满它。
  // 列数、行高、行距全都从 CSS 现读（层与网格共用 .grid 的 grid-template-columns / gap），
  // 所以改样式不必回来同步 JS 常量 —— 整段只读一次布局，没有来回试探的循环。
  function fillSkeleton() {
    const grid = $('galleryGrid');
    const layer = $('gallerySkeleton');
    layer.hidden = false;
    layer.textContent = '';
    const r = grid.getBoundingClientRect();
    if (!r.width) { // 量不到网格宽度（视图还没就绪）：铺个保守数量，不做定位
      for (let i = 0; i < SK_COUNT_FALLBACK; i++) layer.appendChild(skeletonTile());
      return;
    }
    const top = Math.max(0, r.top); // 页面可能还停在滚动位置上，别把层顶出视口
    layer.style.top = top + 'px';
    layer.style.left = r.left + 'px';
    layer.style.width = r.width + 'px';
    layer.style.bottom = '0'; // 层高 = 视口余下的部分，交给这两条边夹出来
    // 先铺一格样板，量出卡片真实的高度（图片区 + 标题条 + 边框），再算需要几层
    const sample = skeletonTile();
    layer.appendChild(sample);
    const cs = getComputedStyle(layer);
    const gap = parseFloat(cs.rowGap) || 0;
    const cols = cs.gridTemplateColumns === 'none' ? 1 : cs.gridTemplateColumns.split(' ').length;
    const rows = Math.max(1, Math.ceil((layer.clientHeight + gap) / (sample.offsetHeight + gap)));
    const n = Math.min(SK_MAX, rows * cols);
    for (let i = 1; i < n; i++) layer.appendChild(skeletonTile());
  }

  // 窗口尺寸变了：网格的宽度、列数都跟着变，骨架还铺着的话得重新量一遍
  // （真实卡片靠 CSS 自己重排，骨架层的位置是量出来的，它自己跟不上）
  window.addEventListener('resize', () => {
    if (!$('gallerySkeleton').hidden) fillSkeleton();
  });

  // 缩略图是**独立的对象**（上传时在浏览器里用 canvas 生成），键存在数据库的 thumb_key 列，
  // 接口把 thumb_url 直接返回给前端（见 renderGridItem）。
  // 它跟原图一样是预先烘焙好的成品，尺寸在生成时就定死了（THUMB_SIZE = 512 的正方形），
  // 没法按视口变尺寸 —— 所以也没有「按格子宽度 × DPR 现算边长」这回事。
  //
  // 已知取舍：canvas 生成的是基线 WebP，不是渐进式，所以**缩略图卡片没有增量显形**
  // （那是服务端编码能力）。进度条照常；原图的显形取决于原文件本身是不是渐进式。

  function showGridLoader(opts) {
    const o = opts || {};
    const seq = ++gridLoaderSeq;
    gridLoaderOwner = seq; // 最新一次的调用取得所有权
    // 转圈与「已显示 N 张」共用同一行、互斥显示，行高不变
    $('galleryBusyText').textContent = o.text || '加载中…';
    $('galleryBusy').hidden = false;
    $('galleryCount').hidden = true;
    // 已经有骨架在屏幕上（上一次 reset 还没收尾）：沿用即可，不重复铺
    if (o.skeleton && $('gallerySkeleton').hidden) fillSkeleton();
    return seq;
  }

  // 收起骨架层。不判所有权：reset 时网格要重画，先确保上一轮铺的东西不在屏幕上
  function clearSkeleton() {
    const layer = $('gallerySkeleton');
    layer.hidden = true;
    layer.textContent = '';
    layer.removeAttribute('style'); // 位置/宽高是上一轮量的，留着会误导下一轮
  }

  // 只有「最新一次」加载有权收尾：先返回的旧请求不能把新请求的骨架撤掉，
  // 否则点相册与点刷新两次 reset 重叠时会退回空白网格 —— 正是要修的那个问题。
  function hideGridLoader(seq) {
    if (!seq || seq !== gridLoaderOwner) return;
    $('galleryBusy').hidden = true;
    $('galleryCount').hidden = false;
    clearSkeleton(); // 最新的 owner 收尾时把骨架层整个收掉（含它继承来的上一轮残留）
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('已复制');
  }

  // ---------- 后端接口 ----------
  // 所有请求都走这里：自动带密码头、统一抛错。
  // 错误对象上带 status 和 auth 两个标记，调用方据此决定是提示还是弹设置框。
  async function api(path, opts) {
    const o = opts || {};
    const headers = Object.assign({}, o.headers);
    // 公开接口不带密码：它不需要鉴权，带上反而会多一次预检，
    // 一旦服务端没在预检里放行这个头，整个请求会被浏览器拦掉（踩过一次）。
    if (cfg.password && !path.startsWith('/api/public/')) headers['x-picbed-key'] = cfg.password;
    const res = await fetch(cfg.api + path, Object.assign({}, o, { headers }));

    let data = null;
    try { data = await res.json(); } catch (e) { /* 有些响应没有 JSON 体 */ }

    if (!res.ok) {
      const err = new Error((data && data.error) || ('HTTP ' + res.status));
      err.status = res.status;
      err.auth = res.status === 403 || res.status === 503; // 密码错 / 服务端没配密码
      throw err;
    }
    return data;
  }
  const apiSend = (path, method, body) =>
    api(path, { method, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });

  // 图片直链：接口返回的 url / thumb_url 优先用；只有手上只有键时才用这里拼
  function publicUrl(key) {
    return String(cfg.imageBase || '').replace(/\/+$/, '') + '/' + key;
  }

  function needWorker() {
    if (cfg.api) return true;
    openSettings();
    toast('请先在设置中填写 Worker 地址', true);
    return false;
  }

  /**
   * 复制用的三种格式。alt 一律用**显示名**（那一行的 filename），也就是这张图在界面上的名字。
   *
   * 两种格式的转义规则不一样，不能共用一份：
   *   * markdown 的 alt 是方括号里的文本，`]` 会提前把它结束 → 反斜杠转义；
   *   * html 的 alt 是属性值，`"` 会把属性截断，`&`/`<` 会被当成实体/标签 → 转义成实体。
   * 早先的写法是把 `[]()` 直接从名字里删掉：既丢信息（括号在文件名里很常见），
   * 又挡不住显示名里的 `"` 把 html 的 alt 截断。
   */
  function makeLinks(url, name) {
    const display = String(name || 'image');
    const mdAlt = display.replace(/[\\[\]]/g, '\\$&');
    const htmlAlt = display
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
    return { url, markdown: `![${mdAlt}](${url})`, html: `<img src="${url}" alt="${htmlAlt}" />` };
  }

  // ---------- 相册名 ----------
  // 相册现在是数据库里的一列，不再是键路径。这一套函数负责它的净化与拼接，
  // 规则与 Worker 的 safeAlbum 保持一致（本地先挡一道，省得白跑一趟网络）。
  // 键由服务端生成、且不可变，所以前端不再参与拼键。

  function sanitizeAlbum(input) {
    const segs = String(input || '').replace(/\\/g, '/').split('/')
      .map((s) => s.trim())
      .filter((s) => s && s !== '.' && s !== '..');
    // _picbed 是保留名，判断前先剥掉前导的非字母数字（_picbed → picbed）
    if (segs.some((s) => s.replace(/^[^\p{L}\p{N}]+/u, '').toLowerCase() === 'picbed')) return null;
    return segs
      .map((s) => s.replace(/[\\:*?"<>|\u0000-\u001f]/g, '_').replace(/^[._]+|[._]+$/g, '').slice(0, 60))
      .filter(Boolean)
      .join('/');
  }

  /** 拼相册路径：父相册 + 子段 */
  function albumJoin(parent, child) {
    const a = String(parent || '').replace(/\/+$/, '');
    const b = String(child || '').replace(/^\/+|\/+$/g, '');
    return a && b ? a + '/' + b : (a || b);
  }

  /** 相册的父级（'' = 根） */
  function albumParent(album) {
    const i = String(album || '').lastIndexOf('/');
    return i > 0 ? album.slice(0, i) : '';
  }

  /** 文件夹上传时，文件相对路径里的子目录要拼进相册名（保留目录结构） */
  function relDirs(relPath) {
    const parts = String(relPath || '').replace(/\\/g, '/').split('/').filter(Boolean);
    parts.pop(); // 去掉文件名
    return parts.map((s) => s.replace(/[\\:*?"<>|\u0000-\u001f]/g, '_').replace(/^[._]+|[._]+$/g, '')).filter(Boolean).join('/');
  }

  function errMsg(e) {
    if (!e) return '未知错误';
    if (typeof e === 'string') return e;
    if (e.message) return e.message;
    if (e.status) return 'HTTP ' + e.status;
    try { return JSON.stringify(e); } catch (x) { return '未知错误'; }
  }

  function isImageFile(f) {
    if (f.type && f.type.startsWith('image/')) return true;
    return IMAGE_EXTS.includes((f.name.split('.').pop() || '').toLowerCase());
  }

  // ---------- 上传 ----------
  const queue = [];
  let processing = false;

  // targetAlbum 不传就传进当前所在的相册
  function addFiles(files, targetAlbum) {
    if (!needWorker()) return;
    const base = targetAlbum === undefined || targetAlbum === null ? galleryAlbum : targetAlbum;
    let added = 0;
    let skippedNonImage = 0;
    let skippedTooBig = 0;
    let skippedReserved = 0;
    for (const f of files) {
      if (!isImageFile(f)) { skippedNonImage++; continue; }
      if (f.size > 50 * 1024 * 1024) { skippedTooBig++; continue; }
      // 文件夹上传时把相对路径里的子目录并进相册名，保留目录结构
      const album = albumJoin(base, relDirs(f.__relPath || f.name));
      if (sanitizeAlbum(album) === null) { skippedReserved++; continue; } // 含保留段 _picbed
      enqueue(f, album);
      added++;
    }
    if (skippedNonImage) toast(`已跳过 ${skippedNonImage} 个非图片文件`, true);
    if (skippedTooBig) toast(`已跳过 ${skippedTooBig} 个超过 50MB 的文件`, true);
    if (skippedReserved) toast(`已跳过 ${skippedReserved} 个位于保留目录 _picbed 的文件`, true);
    if (added) {
      openPanel(); // 开始上传时自动展开进度面板
      processQueue();
    } else if (!skippedNonImage && !skippedTooBig && !skippedReserved) toast('没有找到可上传的图片', true);
  }

  // 递归收集拖入的文件夹里的图片（保留相对路径）
  function readEntry(entry, parentPath, out) {
    return new Promise((resolve) => {
      if (!entry) return resolve();
      if (entry.isFile) {
        entry.file((f) => {
          if (f && isImageFile(f)) {
            try { Object.defineProperty(f, '__relPath', { value: parentPath + f.name }); } catch (e) {}
            out.push(f);
          }
          resolve();
        }, () => resolve());
      } else if (entry.isDirectory) {
        const reader = entry.createReader();
        const sub = parentPath + entry.name + '/';
        const readBatch = () => {
          reader.readEntries(async (entries) => {
            if (!entries || !entries.length) return resolve();
            for (const e of entries) await readEntry(e, sub, out);
            readBatch(); // readEntries 每次最多返回 100 项，需要反复读直到为空
          }, () => resolve());
        };
        readBatch();
      } else {
        resolve();
      }
    });
  }

  async function collectFromDataTransfer(dt) {
    const out = [];
    const items = dt && dt.items ? [...dt.items] : [];
    const entries = items
      .filter((it) => it.kind === 'file' && typeof it.webkitGetAsEntry === 'function')
      .map((it) => { try { return it.webkitGetAsEntry(); } catch (e) { return null; } })
      .filter(Boolean);
    if (entries.length) {
      const hasDir = entries.some((e) => e && e.isDirectory);
      if (hasDir) toast('正在扫描文件夹…');
      for (const e of entries) await readEntry(e, '', out);
      return out;
    }
    return [...((dt && dt.files) || [])];
  }

  // ---------- 缩略图（浏览器端生成） ----------
  // 免费方案里唯一可行的一条：Cloudflare Image Resizing 要付费，Workers 免费版 10ms CPU
  // 也跑不动 WASM 编码。所以在**上传时**用 canvas 生成一张正方形缩略图，一起传到 R2。
  // 缩略图是独立的 R2 对象、独立的 URL —— 不是给原图加查询参数：R2 会忽略未知查询参数、
  // 拿原图回 200，那样「缩略图取不到就退回原图」的判断永远不会触发。
  const THUMB_SIZE = 512;                        // 与网格方格子对应（DPR2 下约覆盖 256px 的格子）
  const THUMB_QUALITY = 0.82;
  // 超过这个大小就不在**上传时**生成缩略图（解码一张超大图可能吃掉几百 MB 内存，
  // 而上传刚结束的页面正处于内存高峰）。取 48MB 是为了覆盖上传上限（50MB）——
  // 之前写的 20MB 太小，导致 20MB 以上的图全都静默地没有缩略图。
  // 真解不开也不会卡住上传：整段包在 try/catch 里，失败就退回原图。
  const THUMB_MAX_SRC_BYTES = 48 * 1024 * 1024;
  const THUMB_SKIP_TYPES = ['image/svg+xml', 'image/x-icon']; // canvas 处理不了

  /**
   * 生成缩略图。**任何失败都返回 null** —— 缩略图是锦上添花，绝不能因此让原图传不上去。
   *
   * 用 <img> 而不是 createImageBitmap：前者默认按 EXIF 方向摆正，而
   * createImageBitmap 的 imageOrientation:'from-image' 在部分 Safari 上是**被静默忽略**的，
   * 那会生成一张躺倒的缩略图，比没有缩略图还糟。
   */
  async function makeThumb(file) {
    const type = (file.type || '').toLowerCase();
    if (THUMB_SKIP_TYPES.includes(type)) return null;
    if (file.size > THUMB_MAX_SRC_BYTES) return null;

    let url = null;
    try {
      url = URL.createObjectURL(file);
      const img = new Image();
      img.src = url;
      await img.decode();

      const w = img.naturalWidth;
      const h = img.naturalHeight;
      if (!w || !h) return null;

      // 居中正方裁切，和网格里的方格子一一对应（横竖图都不浪费像素）
      const side = Math.min(w, h);
      const sx = Math.floor((w - side) / 2);
      const sy = Math.floor((h - side) / 2);

      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = THUMB_SIZE;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, sx, sy, side, side, 0, 0, THUMB_SIZE, THUMB_SIZE);

      // 浏览器不支持 WebP 时 toBlob 会静默退回 PNG —— 一律以 blob.type 为准，别写死
      const blob = await new Promise((r) => canvas.toBlob(r, 'image/webp', THUMB_QUALITY));
      if (!blob) return null;
      if (blob.size >= file.size) return null; // 比原图还大就没有意义
      return blob;
    } catch (e) {
      return null; // 解不开的格式（例如 Chrome 里的 HEIC）就当没有缩略图
    } finally {
      if (url) URL.revokeObjectURL(url);
    }
  }

  /** 上传时用的分级。默认 unspecified = 不进任何相册：要手动设过分级才出现在相册里 */
  function currentUploadRating() {
    const el = $('uploadRating');
    return (el && el.value) || 'unspecified';
  }

  /**
   * 单文件上传。用 XHR 而不是 fetch，是因为 fetch 读不到上传进度。
   * 分级与相册走 query 参数（中文相册名在 URL 里天然安全，空串能表达「传到根目录」）。
   */
  function uploadOne(file, album, rating, onProgress) {
    return new Promise((resolve, reject) => {
      const qs = new URLSearchParams();
      qs.set('album', album || '');
      qs.set('rating', rating || 'unspecified');

      const xhr = new XMLHttpRequest();
      xhr.open('POST', cfg.api + '/api/upload?' + qs.toString());
      if (cfg.password) xhr.setRequestHeader('x-picbed-key', cfg.password);
      xhr.setRequestHeader('x-filename', encodeURIComponent(file.name)); // 头只能放 Latin-1，中文名要先编码
      xhr.setRequestHeader('content-type', file.type || 'application/octet-stream');

      xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload = () => {
        let data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) { /* 可能没有 JSON 体 */ }
        if (xhr.status >= 200 && xhr.status < 300 && data && data.image) return resolve(data.image);
        const err = new Error((data && data.error) || ('HTTP ' + xhr.status));
        err.status = xhr.status;
        err.auth = xhr.status === 403 || xhr.status === 503;
        reject(err);
      };
      xhr.onerror = () => reject(new Error('网络错误'));
      xhr.send(file);
    });
  }

  function enqueue(file, uploadAlbum) {
    const row = document.createElement('div');
    row.className = 'q-item';
    const thumb = document.createElement('img');
    thumb.className = 'q-thumb';
    thumb.alt = '';
    const body = document.createElement('div');
    body.className = 'q-body';
    const name = document.createElement('div');
    name.className = 'q-name';
    name.textContent = file.__relPath || file.name;
    name.title = name.textContent;
    const bar = document.createElement('div');
    bar.className = 'q-bar';
    const fill = document.createElement('div');
    fill.className = 'q-fill';
    bar.appendChild(fill);
    const status = document.createElement('div');
    status.className = 'q-status';
    status.textContent = '等待上传';
    body.append(name, bar, status);
    row.append(thumb, body);
    if (URL.createObjectURL) {
      const u = URL.createObjectURL(file);
      thumb.src = u;
      thumb.onload = () => URL.revokeObjectURL(u);
    }
    $('queue').appendChild(row);
    queue.push({ file, row, fill, status, done: false, failed: false, pct: 0, album: uploadAlbum || null });
    updateUploadFab();
  }

  async function uploadFile(file, item) {
    const { fill, status } = item;
    // 文件夹上传时把相对路径里的子目录并进相册名，保留目录结构
    const album = albumJoin(item.album || '', relDirs(file.__relPath || file.name));

    const image = await uploadOne(file, album, currentUploadRating(), (p) => {
      const pct = Math.min(100, Math.round(p * 100));
      item.pct = pct;
      fill.style.width = pct + '%';
      status.textContent = pct >= 100 ? '处理中…' : pct + '%';
      updateUploadFab();
    });

    // 缩略图单独一步：生成或上传失败都不影响原图（D1 里 thumb_key 留空，网格会退回原图）。
    // 但**要让用户知道**——否则他只会在相册里发现这张图加载特别慢，却不知道为什么。
    status.textContent = '生成缩略图…';
    try {
      const blob = await makeThumb(file);
      if (blob) {
        await api('/api/images/' + image.id + '/thumb', {
          method: 'PUT',
          headers: { 'content-type': blob.type || 'image/webp' },
          body: blob,
        });
        item.thumbOk = true;
      }
    } catch (e) {
      console.warn('[picbed] 缩略图没传成：', e.message || e);
    }
    invalidateListCache(); // 相册里多了一张，缓存那份列表已经旧了
    return image;
  }

  async function processQueue() {
    if (processing) return;
    processing = true;
    let uploadedAny = false;
    let thumbFailed = 0;
    try {
      for (const item of queue) {
        if (item.done) continue;
        item.pct = 0;
        item.status.textContent = '上传中…';
        try {
          const image = await uploadFile(item.file, item);
          item.done = true;
          uploadedAny = true;
          if (!item.thumbOk) thumbFailed++;
          item.pct = 100;
          item.fill.style.width = '100%';
          item.status.textContent = '完成';
          item.row.classList.add('done');
          addResult(image.url, item.file.name);
          saveHistory(image.url, item.file.name);
          updateUploadFab();
          await sleep(350);
          item.row.remove();
        } catch (e) {
          console.error('[picbed] 上传失败:', e);
          item.failed = true;
          item.status.textContent = '失败：' + errMsg(e) + '（点此重试）';
          item.row.classList.add('error');
          item.status.onclick = () => {
            item.status.onclick = null;
            item.failed = false;
            item.status.textContent = '重试中…';
            item.row.classList.remove('error');
            updateUploadFab();
            processQueue();
          };
          updateUploadFab();
        }
      }
    } finally {
      processing = false;
      updateUploadFab();
      if (uploadedAny) loadGallery(true);
      // 有图没生成缩略图就说一声：这些图在相册里会直接下载原图，慢得多。
      // 不提示的话用户只会觉得「怎么有的图特别慢」，查不到原因。
      if (thumbFailed) {
        toast(`有 ${thumbFailed} 张图没生成缩略图（格式或尺寸不支持）。可用工具栏的「补缩略图」重试`, true);
      }
    }
  }

  // ---------- 结果 ----------
  const sessionResults = [];
  function addResult(url, name) {
    sessionResults.unshift({ url, name });
    $('resultsSection').hidden = false;
    const box = document.createElement('div');
    box.className = 'result';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = url;
    img.onerror = () => img.remove();
    const info = document.createElement('div');
    info.className = 'result-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'result-name';
    nameEl.textContent = name;
    const btns = document.createElement('div');
    btns.className = 'result-btns';
    const links = makeLinks(url, name);
    FMT.forEach((k) => {
      const b = document.createElement('button');
      b.className = 'btn small';
      b.appendChild(icon(FMT_ICON[k]));
      const lbl = document.createElement('span');
      lbl.textContent = FMT_LABEL[k];
      b.appendChild(lbl);
      b.onclick = () => copyText(links[k]);
      btns.appendChild(b);
    });
    info.append(nameEl, btns);
    box.append(img, info);
    $('results').prepend(box);
    updateUploadFab();
  }

  function copyAllResults() {
    if (!sessionResults.length) return toast('还没有上传结果');
    copyText(sessionResults.map((r) => makeLinks(r.url, r.name)[cfg.format]).join('\n'));
  }

  // ---------- 历史 ----------
  const HISTORY_KEY = 'picbed_history';
  let history = [];
  try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (e) {}

  function persistHistory() { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }

  function saveHistory(url, name) {
    history.unshift({ url, name, time: Date.now() });
    history = history.slice(0, 200);
    persistHistory();
    renderHistory();
  }

  function renderHistory() {
    const ul = $('historyList');
    ul.textContent = '';
    if (!history.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '暂无记录';
      ul.appendChild(li);
      updateUploadFab();
      return;
    }
    for (const h of history) {
      const li = document.createElement('li');
      const name = document.createElement('span');
      name.className = 'h-name';
      name.textContent = h.name || h.url.split('/').pop();
      name.title = h.url;
      const time = document.createElement('span');
      time.className = 'h-time';
      time.textContent = new Date(h.time).toLocaleString();
      const btns = document.createElement('span');
      btns.className = 'h-btns';
      const links = makeLinks(h.url, h.name);
      FMT.forEach((k) => {
        const b = document.createElement('button');
        b.className = 'btn small';
        b.appendChild(icon(FMT_ICON[k]));
        const lbl = document.createElement('span');
        lbl.textContent = FMT_LABEL[k];
        b.appendChild(lbl);
        b.onclick = () => copyText(links[k]);
        btns.appendChild(b);
      });
      const del = document.createElement('button');
      del.className = 'btn small danger';
      del.appendChild(icon('x'));
      del.title = '删除记录';
      del.onclick = () => { history = history.filter((x) => x !== h); persistHistory(); renderHistory(); };
      btns.appendChild(del);
      li.append(name, time, btns);
      ul.appendChild(li);
    }
    updateUploadFab();
  }

  // ---------- 上传状态面板（右下悬浮按钮） ----------
  // 视图模式：'admin' = 管理视图，'public' = 游客公开视图（见 switchView）
  // 本机已保存密码则直接进管理视图，否则默认展示公开画廊
  // 记住上次看的视图：刷新后回到原处，不再每次都被拽进「我的相册」。
  // 首次访问（没记录）时，配了密码就直接进管理视图 —— 保持原来的习惯。
  const VIEW_KEY = 'picbed_view';
  let view = (() => {
    let saved = '';
    try { saved = localStorage.getItem(VIEW_KEY) || ''; } catch (e) { /* 隐私模式下可能读不到 */ }
    const canAdmin = !!(cfg.password && cfg.api);
    if (saved === 'admin') return canAdmin ? 'admin' : 'public';
    if (saved === 'public') return 'public';
    return canAdmin ? 'admin' : 'public';
  })();
  let panelOpen = false;

  function openPanel() {
    if (view !== 'admin') return;
    panelOpen = true;
    $('uploadPanel').hidden = false;
    $('panelBackdrop').hidden = false;
  }

  function closePanel() {
    panelOpen = false;
    $('uploadPanel').hidden = true;
    $('panelBackdrop').hidden = true;
  }

  function togglePanel() { if (panelOpen) closePanel(); else openPanel(); }

  function updateUploadFab() {
    const uploading = queue.filter((it) => !it.done && !it.failed);
    const failed = queue.filter((it) => !it.done && it.failed);
    const hasContent = !!(uploading.length || failed.length || sessionResults.length || history.length);
    $('uploadFab').hidden = view !== 'admin' || !hasContent;
    $('uploadFab').classList.toggle('idle', !uploading.length && !failed.length);
    const badge = $('fabBadge');
    if (uploading.length) {
      const avg = Math.round(uploading.reduce((s, it) => s + (it.pct || 0), 0) / uploading.length);
      badge.className = 'fab-badge';
      badge.textContent = avg + '%';
      $('panelBadge').textContent = `上传中 ${uploading.length} 个`;
    } else if (failed.length) {
      badge.className = 'fab-badge';
      badge.textContent = '失败 ' + failed.length;
      $('panelBadge').textContent = `失败 ${failed.length} 个（点列表中的失败项可重试）`;
    } else if (sessionResults.length) {
      badge.className = 'fab-badge ok';
      badge.textContent = '完成 ' + sessionResults.length;
      $('panelBadge').textContent = `本次已完成 ${sessionResults.length} 个`;
    } else {
      badge.className = 'fab-badge idle';
      badge.textContent = '';
      $('panelBadge').textContent = '';
    }
    // 没有可展示的内容时收起面板（不调用 closePanel，避免递归）
    if (!hasContent && panelOpen) {
      panelOpen = false;
      $('uploadPanel').hidden = true;
      $('panelBackdrop').hidden = true;
    }
  }

  // ---------- 相册 ----------
  let galleryLoaded = 0;
  let galleryPage = 1;   // 页码分页（接口按 page/pageSize 取）
  let galleryTotal = 0;
  let galleryMaxPage = 1;
  let galleryAlbum = ''; // 当前相册名（'' = 根）。相册是数据库里的一列，不再是键前缀
  // 相册内容的世代号：每次发起加载都 ++（管理视图与公开画廊共用同一个 #galleryGrid，
  // 所以也共用一个世代号）。await 返回后只有「最新一次」请求有权往网格里写内容与分页
  // 状态 —— 否则「打开子相册，还没加载完就退回父目录」时，子相册的响应会晚于父目录
  // 到达，把子相册的条目追加到已经渲染好的父目录下面。与 gridLoaderSeq 同一套思路，
  // 区别是那个只管骨架/转圈的收尾，这个管网格内容。
  let galleryReqSeq = 0;
  let selectMode = false;
  const selectedKeys = new Set();
  let anchorFig = null; // Shift 连选的锚点卡片

  // 公开画廊（访客视图）：同样按相册名浏览，另外带一个分级档位
  // 相册进 URL：这样「某个相册」本身就可以被分享出去（见 albumShareUrl）。
  // 分级档位同理，从 ?rating= 读。
  let publicAlbum = new URLSearchParams(location.search).get('album') || '';
  let publicLoaded = 0;
  let publicPage = 1;
  let publicTotal = 0;
  let publicMaxPage = 1;
  // 分级档位来自 URL 的 ?rating= 参数（r15 = G+R12+R15 / r15_only = 仅 R15），
  // 是个「安静」的开关，页面上不放控件；空串表示用服务端的默认档。
  const publicRatingParam = () => new URLSearchParams(location.search).get('rating') || '';
  // 敏感内容遮罩：出现在相册里的 R15/R18 默认糊住，点一下才显示（类似 Twitter 的做法）。
  // 想整体放开就在地址后面加 ?reveal=1 —— 同样是个安静的参数，页面上不放控件。
  // 注意它和 ?rating= 是两件事：rating 决定「列不列出来」，reveal 决定「糊不糊」。
  const COVERED_RATINGS = ['R15', 'R18'];
  const publicRevealAll = () => new URLSearchParams(location.search).get('reveal') === '1';

  /** 把当前相册写回地址栏（replace=true 时不新增一条历史记录） */
  function syncAlbumUrl(replace) {
    const q = new URLSearchParams(location.search);
    if (publicAlbum) q.set('album', publicAlbum); else q.delete('album');
    const url = location.pathname + (q.toString() ? '?' + q : '');
    // ⚠️ 必须写 window.history：本文件里有个同名局部变量 history（上传历史数组），
    // 直接把浏览器那个 history 遮住了 —— 不写全名会报 "history.pushState is not a function"
    if (replace) window.history.replaceState(null, '', url);
    else window.history.pushState(null, '', url);
  }

  /** 某个相册的分享链接：指向公开画廊的那个相册，并带上当前的分级档位 */
  function albumShareUrl(album) {
    const q = new URLSearchParams(location.search);
    if (album) q.set('album', album); else q.delete('album');
    // 不把 reveal 带出去 —— 分享链接不该替对方决定「要不要显示敏感内容」
    q.delete('reveal');
    return location.origin + location.pathname + (q.toString() ? '?' + q : '');
  }

  // ---------- 图片数据缓存 ----------
  // 网格里每一项都缓存**整行数据**（id / url / thumb_url / rating / is_hidden / album），
  // 按 r2_key 索引。rating / is_hidden 这些状态就在行里，不用再单独拉一份。
  const itemsByKey = new Map();
  function remember(row) {
    itemsByKey.set(row.key, row);
    return row;
  }

  /** 对访客是否可见：没被隐藏，且分过级（unspecified 不进任何相册）—— 两个维度是独立的 */
  function isPublished(row) {
    return !!row && !row.is_hidden && row.rating !== 'unspecified';
  }

  // 批量改动。后端单次上限 500 条，前端按 500 分块（「跨页全选」很容易超）
  const BULK_CHUNK = 500;
  // 改完之后列表缓存就旧了：立刻作废，免得下次进相册先闪一眼改动前的内容
  // （就算这里漏了某处也不会显示错 —— 后台那道刷新会把结果纠正回来）
  async function bulkUpdate(ids, patch) {
    let n = 0;
    for (let i = 0; i < ids.length; i += BULK_CHUNK) {
      const r = await apiSend('/api/images/bulk', 'POST', Object.assign({ ids: ids.slice(i, i + BULK_CHUNK) }, patch));
      n += r.updated || 0;
    }
    invalidateListCache();
    return n;
  }
  async function bulkDelete(ids) {
    let n = 0;
    for (let i = 0; i < ids.length; i += BULK_CHUNK) {
      const r = await apiSend('/api/images/bulk', 'POST', { ids: ids.slice(i, i + BULK_CHUNK), delete: true });
      n += r.deleted || 0;
    }
    invalidateListCache();
    return n;
  }

  /** 单张改分级 / 隐藏状态 / 改名，成功后把本地的行更新掉 */
  async function patchImage(id, patch) {
    const data = await apiSend('/api/images/' + id, 'PATCH', patch);
    invalidateListCache();
    const image = data && data.image;
    if (image) {
      // ⚠️ 必须**就地更新** itemsByKey 里那一行，不能换成接口返回的新对象：
      // 卡片上每个处理器（点击开灯箱、右键菜单、悬停预取）捕获的都是渲染时的那个行对象，
      // 换掉 map 里那份之后，它们还指着旧的 —— 表现是「改完名字点开还是旧名字」，
      // 而按 key 回查的路径（改分级、隐藏、灯箱里的当前状态）拿到的却已经是新的，两边对不上。
      const cur = itemsByKey.get(image.key);
      if (cur) Object.assign(cur, image);
      else remember(image); // map 里还没有（正常不该发生）：至少别丢了这一行
    }
    return image;
  }

  // 这里原本还有一套「重名冲突」流程（比对内容、覆盖/自动改名/跳过）。
  // 现在服务端每次上传都生成随机且不可变的键，**键永远不会冲突**，那套流程整体删掉了：
  // 同一个相册里可以存在两个同名文件，互不影响。

  // ---------- 相册工具 ----------
  // 相册不再是键前缀，就是一个以 / 分隔的名字。下面这些函数负责它的解析与校验。

  /** 把用户输入解析成相册名：留空 = 根；以 / 开头 = 从根算起；否则相对当前相册 */
  function parseTargetAlbum(raw) {
    const text = String(raw == null ? '' : raw).trim();
    const abs = text.startsWith('/');
    const album = sanitizeAlbum(text.replace(/^\/+/, ''));
    if (album === null) return null; // 含保留段
    if (!album) return '';
    return abs ? album : albumJoin(galleryAlbum, album);
  }

  /** target 是否落在 base 子树里（含自身）。按路径段比较 —— 不能用 startsWith，否则 a 会吃掉 ab */
  function inSubtree(target, base) {
    if (!base) return true;
    return target === base || target.startsWith(base + '/');
  }

  // ---------- 自定义弹窗 ----------
  // 统一的文本输入弹窗：确定返回输入值（未输入返回空串），取消返回 null
  function promptDialog(opts) {
    const o = opts || {};
    return new Promise((resolve) => {
      const dlg = $('promptDialog');
      const input = $('promptInput');
      $('promptTitle').textContent = o.title || '输入';
      $('promptLabel').textContent = o.label || '内容';
      $('promptHelp').textContent = o.help || '';
      $('promptOk').textContent = o.confirmText || '确定';
      input.value = o.value || '';
      input.placeholder = o.placeholder || '';
      $('promptTreeWrap').hidden = !o.tree;
      let done = false;
      const finish = (val) => {
        if (done) return;
        done = true;
        dlg.hidden = true;
        resolve(val);
      };
      if (o.tree) {
        // 点击树节点：填入路径；若输入框里已有一个纯名称（如重命名时的相册名）则保留在末尾
        const onPick = (p) => {
          const cur = input.value.trim();
          const keep = cur && !cur.includes('/') ? cur : '';
          input.value = keep ? p + keep : p;
          input.focus();
        };
        // 自动补全的查询词取「目录部分」，纯名称不参与过滤（否则重命名时树会被自己的名字过滤掉）
        const treeQuery = () => {
          const v = input.value.trim().replace(/^\/+/, '');
          return v.endsWith('/') ? v : v.split('/').slice(0, -1).join('/');
        };
        const refresh = () => renderAlbumTree(treeQuery, onPick);
        input.oninput = refresh;
        refresh();
      } else {
        input.oninput = null;
      }
      input.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); finish(input.value); }
      };
      $('promptOk').onclick = () => finish(input.value);
      $('promptCancel').onclick = () => finish(null);
      dlg.onclick = (e) => { if (e.target === dlg) finish(null); };
      dlg.hidden = false;
      input.focus();
      input.select();
    });
  }

  // 统一的确认弹窗：确定返回 true，取消返回 false
  function confirmDialog(opts) {
    const o = opts || {};
    return new Promise((resolve) => {
      const dlg = $('confirmDialog');
      $('confirmTitle').textContent = o.title || '确认';
      $('confirmMsg').textContent = o.message || '';
      const ok = $('confirmOk');
      ok.textContent = o.okText || '删除';
      ok.className = o.danger === false ? 'btn primary' : 'btn danger-solid';
      let done = false;
      const finish = (val) => {
        if (done) return;
        done = true;
        dlg.hidden = true;
        resolve(val);
      };
      ok.onclick = () => finish(true);
      $('confirmCancel').onclick = () => finish(false);
      dlg.onclick = (e) => { if (e.target === dlg) finish(false); };
      dlg.hidden = false;
      ok.focus();
    });
  }

  // ---------- 相册目录树（弹窗内补全用） ----------
  let albumTreePaths = null;   // 扁平的相册名数组，供输入框的自动补全树使用
  let albumTreeLoading = null;

  function invalidateAlbumTree() { albumTreePaths = null; }

  /** 把相册名展开成含所有祖先层级的路径数组（'a/b' 会同时产出 'a' 和 'a/b'）
   *  接口给的是「有图的那些相册」，中间的层级要靠这一步补齐 ——
   *  比如只传过 旅行/2024 的图，「旅行」这一层也要能出现在树里。 */
  function buildAlbumPaths(albums) {
    const set = new Set();
    for (const a of albums) {
      const name = String(a || '').replace(/^\/+|\/+$/g, '');
      if (!name) continue;
      let acc = '';
      for (const p of name.split('/')) {
        acc = acc ? acc + '/' + p : p;
        set.add(acc);
      }
    }
    return [...set].sort();
  }

  async function ensureAlbumTree() {
    if (albumTreePaths) return albumTreePaths;
    if (albumTreeLoading) return albumTreeLoading;
    albumTreeLoading = (async () => {
      // 相册列表直接来自数据库（DISTINCT album），不再靠列举对象存储里的目录占位对象
      const data = await api('/api/albums');
      albumTreePaths = buildAlbumPaths((data.albums || []).map((r) => r.album));
      return albumTreePaths;
    })();
    try {
      return await albumTreeLoading;
    } finally {
      albumTreeLoading = null;
    }
  }

  // 扁平路径 → 嵌套树
  function albumTreeFromPaths(paths) {
    const root = { name: '', rel: '', children: new Map() };
    for (const p of paths) {
      let node = root;
      let acc = '';
      for (const seg of p.replace(/\/+$/, '').split('/')) {
        if (!seg) continue;
        acc += seg + '/';
        if (!node.children.has(seg)) node.children.set(seg, { name: seg, rel: acc, children: new Map() });
        node = node.children.get(seg);
      }
    }
    return root;
  }

  // 递归渲染一级节点；子层懒展开
  function appendTreeLevel(node, container, onPick) {
    const kids = [...node.children.values()];
    if (!kids.length) return;
    const ul = document.createElement('ul');
    for (const k of kids) {
      const li = document.createElement('li');
      const row = document.createElement('div');
      row.className = 'tree-row';
      const sub = document.createElement('div');
      sub.hidden = true;
      const caret = document.createElement('button');
      caret.type = 'button';
      caret.className = 'tree-caret' + (k.children.size ? '' : ' leaf');
      caret.appendChild(icon('chevron'));
      if (k.children.size) {
        caret.onclick = (e) => {
          e.stopPropagation();
          if (sub.hidden && !sub.dataset.built) {
            sub.dataset.built = '1';
            appendTreeLevel(k, sub, onPick);
          }
          sub.hidden = !sub.hidden;
          caret.classList.toggle('open', !sub.hidden);
        };
      }
      const label = document.createElement('button');
      label.type = 'button';
      label.className = 'tree-label';
      label.textContent = k.name;
      label.title = '/' + k.rel;
      label.onclick = () => onPick('/' + k.rel);
      row.append(caret, label);
      li.append(row, sub);
      ul.appendChild(li);
    }
    container.appendChild(ul);
  }

  // 渲染目录树：输入框有内容时改为匹配结果列表（自动补全），否则展示完整树
  let treeRenderSeq = 0;
  async function renderAlbumTree(getQuery, onPick) {
    const seq = ++treeRenderSeq;
    const box = $('promptTree');
    const empty = (msg) => {
      box.textContent = '';
      const div = document.createElement('div');
      div.className = 'tree-empty';
      div.textContent = msg;
      box.appendChild(div);
    };
    let paths;
    try {
      paths = await ensureAlbumTree();
    } catch (e) {
      empty('无法加载相册列表，可手动输入路径');
      return;
    }
    if (seq !== treeRenderSeq) return; // 已有更新的渲染，丢弃本次
    if (!paths.length) { empty('还没有相册，直接输入路径即可创建'); return; }
    const query = String(getQuery ? getQuery() : '').trim().replace(/^\/+/, '').toLowerCase();
    box.textContent = '';
    if (query) {
      const hits = paths.filter((p) => p.toLowerCase().includes(query));
      if (!hits.length) { empty('没有匹配的相册'); return; }
      const ul = document.createElement('ul');
      for (const p of hits.slice(0, 50)) {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tree-label';
        b.textContent = p;
        b.onclick = () => onPick('/' + p);
        li.appendChild(b);
        ul.appendChild(li);
      }
      box.appendChild(ul);
      return;
    }
    appendTreeLevel(albumTreeFromPaths(paths), box, onPick);
  }

  // 「加载更多」按钮的加载态：转圈 + 文案，只改 .lbl，不碰按钮里的其它节点
  function loadMoreState(loading) {
    const btn = $('loadMore');
    btn.disabled = loading;
    const sp = btn.querySelector('.spin');
    if (sp) sp.hidden = !loading;
    setLabel(btn, loading ? '加载中…' : '加载更多');
  }

  // 每页张数：接口的 pageSize 硬上限是 200（传大了会被夹到 200）
  const PAGE_SIZE = 100;

  // ---------- 相册列表缓存：先把上次那份画上，后台再刷新 ----------
  // 进过的相册把**第一页**记在内存里：再进时直接拿它把网格画满 —— 缩略图多半也还在 HTTP 缓存里，
  // 基本是秒出，骨架于是只留给从没看过的相册。后台照常请求，结果一模一样就不碰 DOM
  // （重画会让每张缩略图重新闪一次骨架），不一样才原地换掉。
  // 增删改一律清空整个缓存：个人站就这几个相册，不值得做细粒度失效；
  // 万一漏了哪一处也不会显示错东西 —— 后台那道刷新会把结果纠正回来。
  const listCache = new Map();    // key -> { total, folders, images, sig }
  const listInflight = new Map(); // key -> Promise：悬停预取与正式加载共用同一次请求

  function listKey(mode, album) {
    return mode === 'public' ? `pub|${publicRatingParam()}|${album}` : `adm|${album}`;
  }

  /** 列表内容指纹：只取「变了就该重画」的那几列 */
  function listSig(images) {
    return images.map((r) => [r.id, r.rating, r.is_hidden, r.filename, r.thumb_url || ''].join('\u0001')).join('\u0002');
  }

  function invalidateListCache() { listCache.clear(); }

  function listUrl(mode, album, page) {
    const qs = new URLSearchParams({ album, page: String(page), pageSize: String(PAGE_SIZE) });
    // 分级档位只从 URL 的 ?rating= 来（r15 = G+R12+R15，r15_only = 仅 R15），页面上不放控件
    if (mode === 'public') {
      const rating = publicRatingParam();
      if (rating) qs.set('rating', rating);
    }
    return (mode === 'public' ? '/api/public/images?' : '/api/images?') + qs.toString();
  }

  function cacheList(mode, album, data) {
    listCache.set(listKey(mode, album), {
      total: data.total || 0,
      folders: data.folders || [],
      images: data.images || [],
      sig: listSig(data.images || []),
    });
  }

  /** 鼠标停在相册卡片上就把那一页拉回来：点下去多半正好命中（已缓存/在途都不会重发） */
  function prefetchAlbum(mode, album) {
    const key = listKey(mode, album);
    if (listCache.has(key) || listInflight.has(key)) return;
    const p = api(listUrl(mode, album, 1))
      .then((data) => { cacheList(mode, album, data); return data; })
      .catch(() => null) // 预取失败无所谓：点进去照旧走正常流程
      .finally(() => listInflight.delete(key));
    listInflight.set(key, p);
  }

  /** 取一页列表。第一页可能撞上悬停预取：那就等那一份，别发第二次请求 */
  async function fetchList(mode, album, page) {
    if (page === 1) {
      const pending = listInflight.get(listKey(mode, album));
      if (pending) {
        const data = await pending;
        if (data) return data;
      }
    }
    return await api(listUrl(mode, album, page));
  }

  /** 把一份列表画进网格：缓存命中时先画它，接口回来后内容有变也走这里重画 */
  function renderList(mode, data) {
    const grid = $('galleryGrid');
    // 子相册由接口随第一页一起给，翻页时不追加
    for (const f of data.folders || []) {
      grid.appendChild(mode === 'public' ? renderPublicFolderTile(f.album, f.n) : renderFolderTile(f.album, f.n));
    }
    for (const row of data.images || []) {
      remember(row);
      grid.appendChild(renderGridItem(row, mode));
    }
  }

  async function loadGallery(reset) {
    if (!needWorker()) return; // 提前返回前不作废在途请求：这条路不清网格，让它照常渲染
    const seq = ++galleryReqSeq; // 本次加载取得所有权，所有在途请求就此作废
    const album = galleryAlbum; // 快照：await 期间用户可能已经切到别的相册
    const cached = reset ? listCache.get(listKey('admin', album)) : null;
    if (reset) {
      galleryPage = 1;
      galleryLoaded = 0;
      clearSkeleton(); // 上一轮可能还铺着：这一轮要么重铺，要么直接用缓存画
      $('galleryGrid').textContent = '';
      dlCancelAll(); // 和在途下载成对：卡片都没了，就别再往下下（blob 也在这里一起回收）
      clearSelection();
      if (cached) {
        renderList('admin', cached); // 先画上次那份：用户立刻看到真实卡片，而不是一屏灰格子
        galleryLoaded = cached.images.length;
      }
    } else {
      galleryPage++;
    }
    // 提前渲染面包屑：既让导航目标立刻可见，也让下面骨架量高度时量的是最终布局
    // （空的面包屑比填满后矮约 29px，量早了会多算一行骨架）
    renderBreadcrumb();
    const release = beginLoad();
    // 命中缓存就不摆加载态：内容是现成的，后台那次刷新不该在屏幕上闪
    const gridSeq = cached ? 0 : showGridLoader(reset
      ? { skeleton: true, text: '正在加载相册…' }
      : { text: `正在加载更多…（已显示 ${galleryLoaded} 张）` });
    const btn = $('loadMore');
    loadMoreState(true);
    try {
      const data = await fetchList('admin', album, galleryPage);
      if (seq !== galleryReqSeq) return; // 已经切走：这份结果作废，一个节点都不许写进网格
      // 面包屑已在上面提前渲染过；await 期间一旦切走这里就已返回，无需再渲染一次
      const items = data.images || [];
      if (reset) {
        cacheList('admin', album, data);
        // 和缓存那份一模一样就一个节点都不碰：重画会让每张缩略图重新闪一次骨架
        if (!cached || cached.sig !== listSig(items) || cached.total !== (data.total || 0)) {
          $('galleryGrid').textContent = '';
          dlCancelAll();
          renderList('admin', data);
        }
        galleryLoaded = items.length;
      } else {
        for (const row of items) {
          remember(row);
          $('galleryGrid').appendChild(renderGridItem(row, 'admin'));
        }
        galleryLoaded += items.length;
      }
      galleryTotal = data.total || 0;
      galleryMaxPage = Math.max(1, Math.ceil(galleryTotal / PAGE_SIZE));
      $('galleryCount').textContent = galleryTotal > 0
        ? `已显示 ${galleryLoaded} / ${galleryTotal} 张`
        : '这个相册还是空的';
      btn.hidden = galleryPage >= galleryMaxPage;
    } catch (e) {
      console.error('[picbed] 相册加载失败:', e.message || e);
      // 已经切走就连报错都不弹：用户看的是别的目录，这次失败与他无关
      if (seq === galleryReqSeq) toast('相册加载失败：' + errMsg(e), true);
    } finally {
      hideGridLoader(gridSeq); // 内部按 gridLoaderOwner 判断，旧请求撤不掉新请求的骨架
      release();
      if (seq === galleryReqSeq) loadMoreState(false); // 旧请求收尾时别解开新请求的「加载中」
    }
  }

  // ---------- 公开画廊（游客视图） ----------
  function publicGridHint(msg, iconName) {
    const grid = $('galleryGrid');
    grid.textContent = '';
    const div = document.createElement('div');
    div.className = 'gallery-empty';
    div.appendChild(icon(iconName || 'image'));
    const span = document.createElement('span');
    span.textContent = msg;
    div.appendChild(span);
    grid.appendChild(div);
  }

  async function loadPublicGallery(reset) {
    const seq = ++galleryReqSeq; // 与 loadGallery 共用世代号：网格是同一个
    const cached = reset ? listCache.get(listKey('public', publicAlbum)) : null;
    if (reset) {
      publicPage = 1;
      publicLoaded = 0;
      clearSkeleton();
      $('galleryGrid').textContent = '';
      dlCancelAll(); // 同上：网格清了，在途的缩略图请求与 blob 一起收掉
      if (cached) {
        renderList('public', cached); // 同上：先把上次那份画上
        publicLoaded = cached.images.length;
      }
    } else {
      publicPage++;
    }
    // 离线访客不点亮任何加载指示：beginLoad 必须在这些提前返回之后
    if (!cfg.api) {
      // 上面已经清空网格并作废了在途请求，那条路的 loadMoreState(false) 不会再执行，这里补上
      loadMoreState(false);
      renderBreadcrumb();
      publicGridHint('还没有配置后端地址，无法加载公开画廊。', 'alert');
      return;
    }
    renderBreadcrumb(); // 同上：先渲染，骨架才量得准
    const release = beginLoad();
    // 命中缓存就不摆加载态（同 loadGallery）
    const gridSeq = cached ? 0 : showGridLoader(reset
      ? { skeleton: true, text: '正在加载公开画廊…' }
      : { text: `正在加载更多…（已显示 ${publicLoaded} 张）` });
    const btn = $('loadMore');
    loadMoreState(true);
    try {
      const data = await fetchList('public', publicAlbum, publicPage);
      if (seq !== galleryReqSeq) return; // 已经切走：这份结果作废，一个节点都不许写进网格
      // 面包屑已在上面提前渲染过；await 期间一旦切走这里就已返回，无需再渲染一次
      const files = data.images || [];
      if (reset) {
        cacheList('public', publicAlbum, data);
        if (!cached || cached.sig !== listSig(files) || cached.total !== (data.total || 0)) {
          $('galleryGrid').textContent = '';
          dlCancelAll();
          renderList('public', data);
        }
        publicLoaded = files.length;
      } else {
        for (const row of files) {
          remember(row);
          $('galleryGrid').appendChild(renderGridItem(row, 'public'));
        }
        publicLoaded += files.length;
      }
      publicTotal = data.total || 0;
      publicMaxPage = Math.max(1, Math.ceil(publicTotal / PAGE_SIZE));
      $('galleryCount').textContent = publicTotal > 0
        ? `已显示 ${publicLoaded} / ${publicTotal} 张公开图片`
        : '这里还没有可看的图片';
      btn.hidden = publicPage >= publicMaxPage;
      if (reset && publicTotal === 0 && !(data.folders || []).length) {
        publicGridHint(publicAlbum
          ? '这个相册里还没有可看的图片。'
          : '还没有公开的图片。管理员可以在「我的相册」里给图片设置分级。');
      }
    } catch (e) {
      console.error('[picbed] 公开画廊加载失败:', e.message || e);
      if (seq !== galleryReqSeq) return; // 已经切走：别用错误提示盖掉新视图的内容
      if (reset) publicGridHint('公开画廊加载失败：' + (e.message || '无法连接服务') + '（若刚更新过页面，请确认 Worker 已重新部署）', 'alert');
      toast('公开画廊加载失败：' + (e.message || e), true);
    } finally {
      hideGridLoader(gridSeq); // 内部按 gridLoaderOwner 判断，旧请求撤不掉新请求的骨架
      release();
      if (seq === galleryReqSeq) loadMoreState(false); // 旧请求收尾时别解开新请求的「加载中」
    }
  }

  /** 访客视图的子相册卡片。album 是完整相册名，n 是子树里的可看图数 */
  function renderPublicFolderTile(album, n) {
    const name = String(album).split('/').pop() || album;
    const fig = document.createElement('figure');
    fig.className = 'folder-tile';
    const iconEl = document.createElement('div');
    iconEl.className = 'folder-icon';
    iconEl.appendChild(icon('folder'));
    const cap = document.createElement('figcaption');
    cap.textContent = n ? `${name}（${n}）` : name;
    fig.append(iconEl, cap);
    const open = () => { publicAlbum = album; syncAlbumUrl(false); loadPublicGallery(true); };
    fig.onclick = open;
    // 悬停即预取：停一下就把那一页拉回来，点进去多半正好命中（见 prefetchAlbum）
    fig.addEventListener('mouseenter', () => prefetchAlbum('public', album));
    // 右键：相册本身是可以分享的（地址栏里带着 album 参数）
    fig.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      showCtxMenu(e.clientX, e.clientY, [
        { icon: 'folder', label: '打开相册', onClick: open },
        '-',
        { icon: 'link', label: '复制相册链接', onClick: () => copyText(albumShareUrl(album)) },
      ]);
    });
    return fig;
  }

  // ---------- 分级 / 隐藏（管理视图） ----------
  // 状态（rating / is_hidden）就在每张图的列表行里，改完直接更新本地行 + 重画徽标，
  // 不用再单独拉一份「谁公开了」的缓存。

  /** 重画网格里每张卡片的分级徽标与隐藏态 */
  function refreshPublicIndicators() {
    document.querySelectorAll('#galleryGrid figure[data-key]').forEach((fig) => {
      const row = itemsByKey.get(fig.dataset.key);
      if (!row) return;
      const badge = fig.querySelector('.pub-badge');
      if (badge) {
        // 文字也要一起更新 —— 它只在渲染卡片时设过一次，
        // 只改 hidden 的话，改完分级看到的还是旧档位（得刷新页面才对）
        badge.textContent = row.rating === 'unspecified' ? '' : row.rating;
        badge.className = 'pub-badge r-' + row.rating; // 改档位时颜色也要跟着变
        badge.hidden = !isPublished(row); // 能进相册才显示
      }
      const btn = fig.querySelector('.pub-toggle');
      if (btn) {
        setIcon(btn, row.is_hidden ? 'moon' : 'globe');
        btn.title = row.is_hidden ? '已隐藏（点击取消隐藏）' : '隐藏（不进相册，直链仍可打开）';
        btn.classList.toggle('on', !row.is_hidden);
      }
    });
    if (lightboxItem && !$('togglePublicBtn').hidden) updateLightboxPublicBtn();
  }

  /** 切换单张图的隐藏状态。隐藏 = 不进任何相册，但直链照常能打开（这是刻意的） */
  async function togglePublic(key) {
    const row = itemsByKey.get(key);
    if (!row) return;
    const btn = document.querySelector(`#galleryGrid figure[data-key="${CSS.escape(key)}"] .pub-toggle`);
    if (btn) btn.disabled = true;
    try {
      const image = await patchImage(row.id, { is_hidden: row.is_hidden ? 0 : 1 });
      if (image) Object.assign(row, image);
      refreshPublicIndicators();
      updateBulkBar();
      toast(row.is_hidden ? '已隐藏，不再出现在相册里（直链仍可打开）' : '已取消隐藏');
    } catch (e) {
      toast('操作失败：' + errMsg(e), true);
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  /**
   * 重命名图片：改的是**这张图的名字**（D1 的 filename 列），它有三个用处 ——
   * 卡片与灯箱的标题、复制 Markdown/HTML 时的 alt、以及「下载」存盘时的文件名。
   *
   * r2_key 保持不可变（这是「分享出去的链接永不失效」的前提），所以直链不会变 ——
   * 这也是为什么它和「相册重命名」一样，属于纯元数据改动。
   * 想让名字真的落到存盘的文件上，走的是灯箱里的下载按钮：右键「图片另存为」的名字
   * 由浏览器按 URL 决定，服务端影响不了（详见 downloadImage 的注释）。
   */
  async function renameImage(key) {
    const row = itemsByKey.get(key);
    if (!row) return;
    const raw = await promptDialog({
      title: '重命名图片',
      label: '新的名称',
      value: row.filename || '',
      help: '用在卡片标题、复制出去的 alt、以及「下载」存盘的文件名上。图片直链不会变，之前分享出去的链接照样有效。',
      confirmText: '重命名',
    });
    if (raw === null) return;
    const name = String(raw).trim();
    if (!name || name === row.filename) return;

    try {
      const image = await patchImage(row.id, { filename: name });
      if (image) Object.assign(row, image);
      // 就地更新卡片上的名字：figcaption 里是「徽标 + 文本节点」，只换文本
      const fig = document.querySelector(`#galleryGrid figure[data-key="${CSS.escape(key)}"]`);
      const cap = fig && fig.querySelector('figcaption');
      if (cap) {
        [...cap.childNodes].forEach((n) => { if (n.nodeType === 3) n.remove(); });
        cap.appendChild(document.createTextNode(name));
      }
      // 灯箱正开着这张图（从灯箱里改的名）：标题和复制按钮都要重绑，
      // 否则标题还挂着旧名字、复制出去的还是旧 alt
      if (lightboxItem && lightboxItem.key === key) bindLightboxName(row);
      toast('已重命名（直链不变；下载存盘也用这个名字）');
    } catch (e) {
      toast('重命名失败：' + errMsg(e), true);
    }
  }

  /** 改单张图的分级。unspecified = 不进任何相册 */
  async function setRating(key, rating) {
    const row = itemsByKey.get(key);
    if (!row) return;
    try {
      const image = await patchImage(row.id, { rating });
      if (image) Object.assign(row, image);
      refreshPublicIndicators();
      updateBulkBar();
      toast(rating === 'unspecified' ? '已设为未分类，不进相册' : '已设为 ' + rating);
    } catch (e) {
      toast('操作失败：' + errMsg(e), true);
    }
  }

  async function bulkTogglePublic() {
    const keys = [...selectedKeys];
    if (!keys.length) return;
    const rows = keys.map((k) => itemsByKey.get(k)).filter(Boolean);
    const allHidden = rows.length > 0 && rows.every((r) => r.is_hidden);
    const btn = $('bulkPublicBtn');
    btn.disabled = true;
    try {
      await bulkUpdate(rows.map((r) => r.id), { is_hidden: allHidden ? 0 : 1 });
      rows.forEach((r) => { r.is_hidden = allHidden ? 0 : 1; });
      refreshPublicIndicators();
      updateBulkBar();
      toast(allHidden ? `已取消隐藏 ${rows.length} 张` : `已隐藏 ${rows.length} 张`);
    } catch (e) {
      toast('操作失败：' + errMsg(e), true);
    } finally {
      btn.disabled = false;
    }
  }

  /** 批量改分级 */
  async function bulkSetRating(rating) {
    const rows = [...selectedKeys].map((k) => itemsByKey.get(k)).filter(Boolean);
    if (!rows.length) return;
    try {
      await bulkUpdate(rows.map((r) => r.id), { rating });
      rows.forEach((r) => { r.rating = rating; });
      refreshPublicIndicators();
      updateBulkBar();
      toast(rating === 'unspecified' ? `已设为未分类 ${rows.length} 张` : `已全部设为 ${rating}`);
    } catch (e) {
      toast('操作失败：' + errMsg(e), true);
    }
  }

  // ---------- 视图切换 ----------
  function switchView(next) {
    view = next;
    // 记下来，刷新后停在同一个视图（见上面的 VIEW_KEY）
    try { localStorage.setItem(VIEW_KEY, view); } catch (e) { /* 存不下就算了，不影响使用 */ }
    document.body.classList.toggle('view-public', view === 'public');
    $('tabPublic').classList.toggle('active', view === 'public');
    $('tabAdmin').classList.toggle('active', view === 'admin');
    // 切视图时重置与视图相关的临时状态
    selectMode = false;
    $('selectModeBtn').classList.remove('active');
    clearSelection();
    closePanel();
    closeLightbox();
    $('galleryCount').textContent = '';
    $('galleryGrid').textContent = '';
    dlCancelAll(); // 切视图：上一个视图还在下的缩略图立刻停掉
    $('loadMore').hidden = true;
    if (view === 'public') {
      loadPublicGallery(true);
    } else {
      loadGallery(true);
    }
    updateUploadFab();
  }

  // ---------- 拖拽移动（图片 / 相册） ----------
  let dragPayload = null;
  let uploadTargetPrefix = null; // 文件上传悬停的目标相册（null = 当前相册）
  let uploadHoverTimer = null;

  function hasFilePayload(dt) {
    return !!(dt && dt.types && [...dt.types].includes('Files'));
  }

  function canDropInto(targetAlbum) {
    if (!dragPayload) return false;
    if (dragPayload.kind === 'folder') {
      // 不能拖进自己或自己的子相册（否则会无限自我嵌套）。
      // 用路径段比较而不是 startsWith —— 否则相册 a 会被当成 ab 的父级。
      return !inSubtree(targetAlbum, dragPayload.album);
    }
    return targetAlbum !== galleryAlbum; // 图片已在当前相册，拖回来是空操作
  }

  function makeDropTarget(el, getTargetPrefix, allowUpload) {
    el.addEventListener('dragover', (e) => {
      if (dragPayload) {
        if (!canDropInto(getTargetPrefix())) return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        el.classList.add('drop-hover');
        return;
      }
      // 外部文件拖到相册卡片上：悬停即把上传目标切换为该相册
      if (allowUpload && view === 'admin' && hasFilePayload(e.dataTransfer)) {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'copy';
        el.classList.add('drop-hover');
        clearTimeout(uploadHoverTimer);
        if (uploadTargetPrefix !== getTargetPrefix()) {
          uploadTargetPrefix = getTargetPrefix();
          updateDropLabel();
        }
      }
    });
    el.addEventListener('dragleave', () => {
      el.classList.remove('drop-hover');
      if (!dragPayload && allowUpload) {
        // 移到别的卡片上时先由对方的 dragover 接管，这里延迟复位避免相互打架
        const t = getTargetPrefix();
        clearTimeout(uploadHoverTimer);
        uploadHoverTimer = setTimeout(() => {
          if (uploadTargetPrefix === t) {
            uploadTargetPrefix = null;
            updateDropLabel();
          }
        }, 60);
      }
    });
    el.addEventListener('drop', async (e) => {
      el.classList.remove('drop-hover');
      if (dragPayload) {
        if (!canDropInto(getTargetPrefix())) return;
        e.preventDefault();
        e.stopPropagation();
        performDrop(getTargetPrefix());
        return;
      }
      if (allowUpload && view === 'admin' && hasFilePayload(e.dataTransfer)) {
        e.preventDefault();
        e.stopPropagation(); // 拦住窗口处理器，否则同一批文件会上传两次
        const target = getTargetPrefix();
        endFileDrag(); // 拦下了窗口处理器，遮罩与拖拽状态得自己复位
        const files = await collectFromDataTransfer(e.dataTransfer);
        if (files.length) addFiles(files, target);
      }
    });
  }

  async function performDrop(targetAlbum) {
    const payload = dragPayload;
    dragPayload = null;
    if (!payload) return;
    if (payload.kind === 'folder') {
      const from = payload.album;
      if (albumParent(from) === targetAlbum) return toast('已经在该位置', true);
      if (inSubtree(targetAlbum, from)) return toast('不能移动到自身或其子相册下', true);
      await moveAlbum(from, albumJoin(targetAlbum, from.split('/').pop()));
    } else {
      await moveImagesTo(payload.keys, targetAlbum);
    }
  }

  /**
   * 把选中的图片移动到目标相册。
   * 只改数据库里的一列 —— R2 对象一个都不动，**直链保持不变**（这是刻意的：
   * 分享出去的链接不会因为整理相册而失效）。
   */
  async function moveImagesTo(keys, targetAlbum) {
    if (!keys || !keys.length) return;
    if (targetAlbum === galleryAlbum) return toast('图片已经在该相册', true);
    const rows = keys.map((k) => itemsByKey.get(k)).filter(Boolean);
    if (!rows.length) return toast('找不到这些图片的记录', true);
    try {
      await bulkUpdate(rows.map((r) => r.id), { album: targetAlbum });
      rows.forEach((r) => { r.album = targetAlbum; });
      toast(`已移动 ${rows.length} 张到「${targetAlbum || '根目录'}」（直链不变）`);
      clearSelection();
      loadGallery(true);
    } catch (err) {
      toast('移动失败：' + errMsg(err), true);
    }
  }

  /** 重命名 / 移动整个相册（含子相册）：服务端一条 UPDATE 搞定，不搬 R2 里的文件 */
  async function moveAlbum(from, to) {
    if (!from || from === to) return;
    try {
      const r = await apiSend('/api/albums/rename', 'POST', { from, to });
      invalidateAlbumTree();
      invalidateListCache(); // 相册名变了，缓存里那些条目的 album 也旧了
      toast(`已移到「${to || '根目录'}」，${r.changed} 张图受影响（直链不变）`);
      // 当前正待在被移动的相册里时，跟着导航过去
      if (inSubtree(galleryAlbum, from)) galleryAlbum = to + galleryAlbum.slice(from.length);
      loadGallery(true);
    } catch (e) {
      toast('移动失败：' + errMsg(e), true);
    }
  }

  function renderBreadcrumb() {
    const el = $('galleryPath');
    el.textContent = '';
    const isPublic = view === 'public';
    const current = isPublic ? publicAlbum : galleryAlbum; // 相册名，'' = 根
    const go = (album) => {
      if (isPublic) {
        publicAlbum = album;
        syncAlbumUrl(false); // 面包屑导航也写回地址栏，随时可复制当前路径
        loadPublicGallery(true);
      } else {
        galleryAlbum = album;
        loadGallery(true);
      }
    };
    const crumb = (label, album, isCurrent, iconName) => {
      const b = document.createElement('button');
      b.className = 'crumb' + (isCurrent ? ' current' : '');
      if (iconName) b.appendChild(icon(iconName));
      b.appendChild(document.createTextNode(label));
      if (!isCurrent) b.onclick = () => go(album);
      if (!isPublic) makeDropTarget(b, () => album); // 可把图片/相册拖到上级相册
      el.appendChild(b);
    };
    const sep = () => {
      const s = document.createElement('span');
      s.className = 'sep';
      s.textContent = '/';
      el.appendChild(s);
    };
    crumb(isPublic ? '公开画廊' : '全部', '', current === '', isPublic ? 'globe' : 'folder');
    if (current) {
      let acc = '';
      const parts = current.split('/').filter(Boolean);
      parts.forEach((p, i) => {
        sep();
        acc = acc ? acc + '/' + p : p;
        crumb(p, acc, i === parts.length - 1);
      });
    }
  }

  // 相册的「重命名 / 移动 / 删除」（悬浮按钮与右键菜单共用）。
  // 三者都只改数据库里的 album 列 —— R2 里一个对象都不动，所以**图片直链永远不变**。
  async function renameAlbumDialog(album, name) {
    const raw = await promptDialog({
      title: '重命名 / 移动相册',
      label: '新的位置（含相册名）',
      value: name,
      help: '可用 / 创建多级；以 / 开头表示从图床根目录开始；点击下方相册可填入其路径',
      tree: true,
    });
    if (raw === null || !String(raw).trim()) return;
    const to = parseTargetAlbum(raw);
    if (to === null) return toast('_picbed 是保留目录名，不能使用', true);
    if (to === album) return;
    if (inSubtree(to, album)) return toast('不能移动到自身或其子相册', true);
    await moveAlbum(album, to);
  }

  async function moveAlbumDialog(album, name) {
    const raw = await promptDialog({
      title: `移动相册「${name}」`,
      label: '移动到哪个相册',
      placeholder: '留空 = 移到根目录',
      help: '可用 / 指定多级；以 / 开头表示从图床根目录开始；点击下方相册可直接填入',
      tree: true,
    });
    if (raw === null) return;
    const parent = parseTargetAlbum(raw);
    if (parent === null) return toast('_picbed 是保留目录名，不能使用', true);
    if (parent === albumParent(album)) return toast('目标就是当前位置', true);
    if (inSubtree(parent, album)) return toast('不能移动到自身或其子相册', true);
    await moveAlbum(album, albumJoin(parent, name));
  }

  async function deleteAlbumDialog(album, name) {
    try {
      // 先问服务端要统计（图片数 / 子相册数 / 字节数），确认框里如实写出来
      const stats = await api('/api/albums/stats?album=' + encodeURIComponent(album));
      if (!stats.images && !stats.folders) return toast('相册是空的');
      const extra = stats.folders ? ` 和 ${stats.folders} 个子相册` : '';
      const mb = stats.bytes ? `（共 ${(stats.bytes / 1048576).toFixed(1)} MB）` : '';
      const ok = await confirmDialog({
        title: '删除相册',
        message: `确定删除相册「${name}」？将删除其中 ${stats.images} 张图片${extra}${mb}，不可恢复！`,
        okText: '删除相册',
      });
      if (!ok) return;

      const r = await api('/api/albums?album=' + encodeURIComponent(album), { method: 'DELETE' });
      invalidateAlbumTree();
      toast(`已删除相册（${r.deleted} 张图）`);
      // 删的正是当前所在相册（或它的子相册）时就退回父级
      if (inSubtree(galleryAlbum, album)) galleryAlbum = albumParent(album);
      loadGallery(true);
    } catch (err) {
      toast('删除失败：' + errMsg(err), true);
    }
  }

  /** 管理视图的子相册卡片。album 是完整相册名，n 是子树里的图片数 */
  function renderFolderTile(album, n) {
    const name = String(album).split('/').pop() || album;
    const fig = document.createElement('figure');
    fig.className = 'folder-tile';
    const iconEl = document.createElement('div');
    iconEl.className = 'folder-icon';
    iconEl.appendChild(icon('folder'));
    const cap = document.createElement('figcaption');
    cap.textContent = n ? `${name}（${n}）` : name;
    const actions = document.createElement('div');
    actions.className = 'folder-actions';
    const rename = document.createElement('button');
    rename.appendChild(icon('pencil'));
    rename.title = '重命名相册（可用 / 创建多级）';
    rename.onclick = (e) => { e.stopPropagation(); renameAlbumDialog(album, name); };
    const move = document.createElement('button');
    move.appendChild(icon('folder-move'));
    move.title = '移动相册到其他位置';
    move.onclick = (e) => { e.stopPropagation(); moveAlbumDialog(album, name); };
    const del = document.createElement('button');
    del.appendChild(icon('trash'));
    del.title = '删除相册及其全部图片';
    del.onclick = (e) => { e.stopPropagation(); deleteAlbumDialog(album, name); };
    actions.append(rename, move, del);
    fig.append(iconEl, actions, cap);
    fig.onclick = () => { galleryAlbum = album; loadGallery(true); };
    // 悬停即预取：停一下就把那一页拉回来，点进去多半正好命中（见 prefetchAlbum）
    fig.addEventListener('mouseenter', () => prefetchAlbum('admin', album));
    // 右键菜单：与悬浮按钮相同的操作
    fig.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      showCtxMenu(e.clientX, e.clientY, [
        { icon: 'folder', label: '打开相册', onClick: () => { galleryAlbum = album; loadGallery(true); } },
        '-',
        // 分享的是「公开画廊里的这个相册」—— 管理员自己看的是全部，访客只看得到可陈列的那些
        { icon: 'link', label: '复制相册链接（给访客）', onClick: () => copyText(albumShareUrl(album)) },
        '-',
        { icon: 'pencil', label: '重命名 / 移动相册', onClick: () => renameAlbumDialog(album, name) },
        { icon: 'folder-move', label: '移动到其他位置', onClick: () => moveAlbumDialog(album, name) },
        '-',
        { icon: 'trash', label: '删除相册', danger: true, onClick: () => deleteAlbumDialog(album, name) },
      ]);
    });
    // 可拖拽（移动相册），也可作为放置目标：接收图片/相册，外部文件拖上来则直接上传到该相册
    fig.draggable = true;
    fig.addEventListener('dragstart', (e) => {
      dragPayload = { kind: 'folder', album };
      e.dataTransfer.effectAllowed = 'move';
      try {
        e.dataTransfer.setData('application/x-picbed-move', 'folder');
        e.dataTransfer.setData('text/plain', album);
      } catch (err) {}
      fig.classList.add('dragging');
    });
    fig.addEventListener('dragend', () => {
      fig.classList.remove('dragging');
      dragPayload = null;
    });
    makeDropTarget(fig, () => album, true);
    return fig;
  }


  // 「新建相册」在新模型下不再需要占位对象：相册由图片的 album 列派生，没有图片就没有相册。
  // 所以这个按钮变成「进入某个相册」——先把界面导航过去，往里传第一张图，相册就存在了。

  function toggleSelectMode() {
    selectMode = !selectMode;
    $('selectModeBtn').classList.toggle('active', selectMode);
    document.querySelectorAll('#galleryGrid figure').forEach((f) => {
      const check = f.querySelector('.sel-check');
      if (!check) return; // 文件夹卡片不参与多选
      f.classList.toggle('selectable', selectMode);
      check.hidden = !selectMode;
    });
    if (!selectMode) clearSelection();
    updateBulkBar();
  }

  // ---------- 拖动框选 ----------
  // 多选模式下，在网格空白处按下并拖动出一个选择框，框到的图片都会被选中；
  // Ctrl/Cmd 按住则为追加模式，保留原有选择
  $('galleryGrid').addEventListener('mousedown', (e) => {
    if (!selectMode || view !== 'admin' || e.button !== 0) return;
    if (e.target.closest('figure')) return; // 卡片上的按下交给点击/拖拽处理
    e.preventDefault();
    const gridRect = $('galleryGrid').getBoundingClientRect();
    const marquee = $('marquee');
    const additive = !!(e.ctrlKey || e.metaKey);
    const base = new Map(); // 按下时每张卡的选中状态（追加模式下移出框时恢复）
    selectableFigs().forEach((f) => base.set(f, f.classList.contains('selected')));
    if (!additive) clearSelection();
    document.body.classList.add('marqueeing');
    const sx = e.clientX, sy = e.clientY;
    let drawn = false;
    const paint = (cx, cy) => {
      const x1 = Math.max(gridRect.left, Math.min(sx, cx));
      const x2 = Math.min(gridRect.right, Math.max(sx, cx));
      const y1 = Math.max(gridRect.top, Math.min(sy, cy));
      const y2 = Math.min(gridRect.bottom, Math.max(sy, cy));
      marquee.hidden = false;
      marquee.style.left = x1 + 'px';
      marquee.style.top = y1 + 'px';
      marquee.style.width = Math.max(0, x2 - x1) + 'px';
      marquee.style.height = Math.max(0, y2 - y1) + 'px';
      for (const fig of selectableFigs()) {
        const r = fig.getBoundingClientRect();
        const hit = r.left < x2 && r.right > x1 && r.top < y2 && r.bottom > y1;
        setFigSelected(fig, hit || (additive && base.get(fig)));
      }
      updateBulkBar();
      drawn = true;
    };
    const stop = () => {
      document.body.classList.remove('marqueeing');
      marquee.hidden = true;
      window.removeEventListener('mousemove', paint);
      window.removeEventListener('mouseup', stop);
      if (drawn) {
        const first = selectableFigs().find((f) => f.classList.contains('selected'));
        if (first) anchorFig = first;
      }
    };
    window.addEventListener('mousemove', paint);
    window.addEventListener('mouseup', stop);
  });

  function clearSelection() {
    selectedKeys.clear();
    document.querySelectorAll('#galleryGrid figure.selected').forEach((f) => f.classList.remove('selected'));
    anchorFig = null;
    updateBulkBar();
  }

  // ---------- 多选辅助（全选 / 反选 / Shift 连选） ----------
  function selectableFigs() {
    return [...document.querySelectorAll('#galleryGrid figure.selectable')];
  }
  function setFigSelected(fig, on) {
    if (on) { selectedKeys.add(fig.dataset.key); fig.classList.add('selected'); }
    else { selectedKeys.delete(fig.dataset.key); fig.classList.remove('selected'); }
  }
  function selectAllImages() {
    const figs = selectableFigs();
    if (!figs.length) return toast('当前目录没有可选的图片');
    figs.forEach((f) => setFigSelected(f, true));
    updateBulkBar();
  }
  function invertSelection() {
    selectableFigs().forEach((f) => setFigSelected(f, !selectedKeys.has(f.dataset.key)));
    updateBulkBar();
  }
  // Shift 连选：从锚点卡片到目标卡片（DOM 顺序）整段选中；Ctrl+Shift 时保留原选择
  function selectRange(fromFig, toFig, additive) {
    const figs = selectableFigs();
    const a = figs.indexOf(fromFig);
    const b = figs.indexOf(toFig);
    if (a < 0 || b < 0) return;
    if (!additive) {
      clearSelection();
      anchorFig = fromFig; // 替换选择后锚点保持不变，连续 Shift+单击可持续扩展
    }
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) setFigSelected(figs[i], true);
    updateBulkBar();
  }

  function updateBulkBar() {
    const bar = $('bulkBar');
    const n = selectedKeys.size;
    $('bulkCount').textContent = `已选 ${n} 张`;
    bar.hidden = !selectMode; // 多选模式下常驻，便于使用全选/反选
    $('bulkMoveBtn').disabled = !n;
    $('bulkPublicBtn').disabled = !n;
    $('bulkDeleteBtn').disabled = !n;

      const rows = [...selectedKeys].map((k) => itemsByKey.get(k)).filter(Boolean);
      const allHidden = rows.length > 0 && rows.every((r) => r.is_hidden);
      const btn = $('bulkPublicBtn');
      setIcon(btn, allHidden ? 'globe' : 'moon');
      setLabel(btn, allHidden ? '取消隐藏' : '隐藏');
    }
  }

  // ---------- 右键菜单 ----------
  function hideCtxMenu() { $('ctxMenu').hidden = true; }
  function showCtxMenu(x, y, items) {
