<script>
(function () {
  'use strict';

  // ---------- 配置 ----------
  const DEFAULTS = {
    worker: '', bucket: 'album-1255316209', region: 'ap-shanghai',
    prefix: 'img', customDomain: '', maxKeys: 500,
    format: 'url', password: '', thumb: false,
    repo: '', // 源码仓库地址，填了就在顶栏给访客显示 GitHub 入口
  };
  let cfg = Object.assign({}, DEFAULTS, window.PICBED_CONFIG || {});
  const STORE_KEY = 'picbed_settings';
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    // 缩略图已改为整站统一（只由 config.js 的 thumb 决定），本机不再保留这个开关。
    // 旧版本存过 thumb:false 的话，留着会永远盖住 config.js —— 而工具栏的勾选框已经去掉，
    // 用户再也找不到地方改回来 —— 所以直接丢掉这个键
    delete saved.thumb;
    cfg = Object.assign(cfg, saved);
  } catch (e) {}

  function saveSettings() {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      worker: cfg.worker, password: cfg.password,
      customDomain: cfg.customDomain, format: cfg.format,
    }));
  }

  // ---------- 通用 ----------
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const FMT = ['url', 'markdown', 'html'];
  const FMT_LABEL = { url: 'URL', markdown: 'MD', html: 'HTML' };
  const FMT_ICON = { url: 'link', markdown: 'md', html: 'code' };
  const IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'avif', 'bmp', 'ico'];
  const TYPE_BY_EXT = {
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif',
    webp: 'image/webp', svg: 'image/svg+xml', avif: 'image/avif', bmp: 'image/bmp', ico: 'image/x-icon',
  };

  function toast(msg, isError) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.className = ''; }, 2600);
  }

  // ---------- 图标 ----------
  // 引用 sprite 里的 <symbol>；viewBox 写在 symbol 上，外层 svg 不用再写
  function icon(name, cls) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', cls ? 'ic ' + cls : 'ic');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#i-' + name);
    svg.appendChild(use);
    return svg;
  }

  // 只换 <use href>，不动按钮上的文案节点（textContent 会连图标一起抹掉）
  function setIcon(el, name) {
    const use = el && el.querySelector('use');
    if (use) use.setAttribute('href', '#i-' + name);
  }

  // 改按钮文案：文案必须放在 .lbl 里，否则会把按钮内的图标一起抹掉
  function setLabel(el, text) {
    const lbl = el && el.querySelector('.lbl');
    if (lbl) lbl.textContent = text;
    else if (el) el.textContent = text;
  }

  // ---------- 加载指示：顶部进度条 + 网格骨架 ----------
  // 进度条走引用计数而不是 show/hide 配对：管理视图的 loadGallery 与 loadPublicMarkers
  // 是并发的，谁先返回谁先结束，配对的写法会让进度条在另一个还在请求时就消失。
  let busyCount = 0;
  let barShowTimer = 0;
  let barHideTimer = 0;

  function progressBar(show) {
    const bar = $('progressBar');
    if (!bar) return;
    // 必须先清掉显示定时器：否则「延迟 120ms 才亮」的它会在加载结束后才点亮进度条，再没人关
    clearTimeout(barShowTimer);
    clearTimeout(barHideTimer);
    if (!show) {
      bar.classList.remove('on');
      barHideTimer = setTimeout(() => { bar.hidden = true; }, 220); // 等淡出走完再 display:none
      return;
    }
    if (!bar.hidden) { bar.classList.add('on'); return; } // 已在显示，直接续上，不再等 120ms
    barShowTimer = setTimeout(() => { bar.hidden = false; bar.classList.add('on'); }, 120);
  }

  // 开始一次加载，返回幂等的 release()：catch 与 finally 里都调也不会把计数减穿
  function beginLoad() {
    busyCount++;
    if (busyCount === 1) progressBar(true);
    let released = false;
    return function release() {
      if (released) return; // 减两次会让计数永远回不到 0，进度条从此不再出现
      released = true;
      busyCount = Math.max(0, busyCount - 1);
      if (busyCount === 0) progressBar(false);
    };
  }

  // 加载态分两处表达：
  //   · 转圈 + 文案走 .gallery-meta 那一行（网格上方，高度写死，切换时不推动网格）
  //   · 骨架格子铺进网格，只在 reset 加载时铺
  // 骨架必须是 <div> 而不是 <figure>：refreshPublicIndicators / 多选 / 框选都会扫
  // #galleryGrid figure，混进 figure 会被当成真实图片。
  // 网格几何：骨架数量和缩略图尺寸都按它算，必须与 .grid 的样式保持一致
  const GRID_GAP = 12;       // .grid 的 gap
  const GRID_TILE_MIN = 150; // .grid 的 minmax(150px, 1fr)

  // 当前布局下网格的列数
  function gridCols() {
    const w = $('galleryGrid').clientWidth;
    if (!w) return 0; // 布局未就绪或元素不可见
    return Math.max(1, Math.floor((w + GRID_GAP) / (GRID_TILE_MIN + GRID_GAP)));
  }

  // 当前布局下每个格子的实际宽度（CSS 像素）
  function gridTileSize() {
    const cols = gridCols();
    if (!cols) return 0;
    const w = $('galleryGrid').clientWidth;
    return (w - (cols - 1) * GRID_GAP) / cols;
  }

  // 骨架要铺满一屏，又必须自己不撑出滚动条 —— 而这个「一屏」只能量、不能算：
  // 格子宽度是分数像素、卡片带边框、网格下方还压着 .gallery-more 的间距与 .wrap 的 64px 底衬，
  // 估算只要多算几像素，「视口刚好容纳整数层」时骨架就顶出一条滚动条来。
  // 所以铺的时候按估算来（一次到位，够快），末尾按实测撤整层（够准）。
  const SK_CHROME_H = 32;  // 卡片标题条(.sk-cap 10px + 上下 margin 20px) + 上下边框 2px；只喂估算，量偏了有实测兜底
  const SK_MAX = 60;       // 上限，防止超长屏上铺出几百个节点
  const SK_ROWS_MIN = 1;   // 层数下限：矮视口里宁可少铺一层也不冒滚动条；连一层都放不下才认输
  const SK_COUNT_FALLBACK = 12; // 量不到宽度时的保守数量
  let gridLoaderSeq = 0;
  let gridLoaderOwner = 0;

  // 估算层数：只按「填满视口」算，不算网格下方的内容 —— 宁可多铺一层，
  // 多出来的那层会被 trimSkeleton 撤掉；估少了才吃亏，屏幕底部会空一块。
  function skeletonRows() {
    const tileW = gridTileSize();
    if (!tileW) return SK_ROWS_MIN;
    const availH = window.innerHeight - $('galleryGrid').getBoundingClientRect().top;
    const rowH = tileW + SK_CHROME_H + GRID_GAP; // 图片区是正方形，宽即高
    return Math.max(SK_ROWS_MIN, Math.floor((availH + GRID_GAP) / rowH));
  }

  function skeletonTile() {
    const tile = document.createElement('div');
    tile.className = 'sk-tile';
    const im = document.createElement('div');
    im.className = 'sk-img';
    const cap = document.createElement('div');
    cap.className = 'sk-cap';
    tile.append(im, cap);
    return tile;
  }

  // 实测收尾：整层整层往下撤，直到页面不再出现纵向滚动条。
  // 判据直接用 scrollHeight/clientHeight，而不是「网格底边 + 手写的预留量」：
  // 网格下方还有什么（加载更多、.wrap 底衬、以后的页脚）由 DOM 说了算，滚动条本来就是这么冒出来的。
  function trimSkeleton(grid, cols) {
    const doc = document.documentElement;
    let tiles = grid.querySelectorAll('.sk-tile');
    // 循环体一次撤一整层：读一次 scrollHeight 就要强制一次布局，逐格试探不如整层跳
    while (tiles.length > cols * SK_ROWS_MIN && doc.scrollHeight > doc.clientHeight) {
      const keep = tiles.length - cols;
      for (let i = tiles.length - 1; i >= keep; i--) tiles[i].remove();
      tiles = grid.querySelectorAll('.sk-tile');
    }
  }

  function fillSkeleton() {
    const grid = $('galleryGrid');
    const cols = gridCols();
    if (!cols) { // 量不到宽度（视图还没就绪）：铺个保守数量就收手，不做实测
      for (let i = 0; i < SK_COUNT_FALLBACK; i++) grid.appendChild(skeletonTile());
      return;
    }
    const n = Math.min(SK_MAX, cols * skeletonRows());
    for (let i = 0; i < n; i++) grid.appendChild(skeletonTile());
    trimSkeleton(grid, cols);
  }

  // 缩略图边长 = 格子实际宽度 × 屏幕像素比。
  // 这里能直接乘、不留余量，是因为用的是 crop 而不是 thumbnail：
  // 格子只显示居中的正方形（.grid img 是 aspect-ratio:1 + object-fit:cover），
  // crop/NxN/gravity/center 裁出来的正好就是那一块，和显示区域一比一对应。
  // （thumbnail 只能按长边限制，而正方形取的是短边，横向的图会白白多下 25%~44%）
  const THUMB_DPR_CAP = 2;    // 屏幕像素比封顶 2x；3x 屏再多 2.25 倍像素，观感提升很小
  const THUMB_STEP = 50;      // 量化到 50px 台阶：否则每个视口宽度都算出一个新 URL，缓存会被打散
  const THUMB_MIN = 200;
  const THUMB_MAX = 1000;
  const THUMB_FALLBACK = 500; // 布局未就绪时的保守值

  function thumbSize() {
    const tile = gridTileSize();
    if (!tile) return THUMB_FALLBACK;
    const dpr = Math.min(window.devicePixelRatio || 1, THUMB_DPR_CAP);
    const need = tile * dpr;
    return Math.min(THUMB_MAX, Math.max(THUMB_MIN, Math.ceil(need / THUMB_STEP) * THUMB_STEP));
  }

  // 缩略图地址的唯一构造点：自家下载和原生加载必须拿到同一个字符串，
  // 否则 fetch 与 <img> 会各打一次网络，那 30 天的 HTTP 缓存也白攒。
  //
  // JPEG 带 /interlace/1 让服务端输出渐进式 JPEG（实测 SOF2），这是「加载多少显示多少」的关键：
  // 截断的渐进式 JPEG 会渲染出整张模糊图，而不是半张。
  // PNG 改成 WebP：实测裁切后的 PNG 缩略图比 JPEG 重 6~8 倍（350px 要 99~182KB，WebP q85 只要 9~22KB），
  // 画质差在缩略图尺寸下看不出来（与原 PNG 逐像素平均差 1.7~2.4，满值 255）。
  // 只动这两种扩展名 —— 其它格式没验过，万一不支持就是一次 400 + 退回原图，不值当。
  // 已知取舍：WebP 截断状态下画不出东西，所以这些卡片不做增量显形（见 dlRun 里的 revealable），
  // 另外若将来有真正带透明的 PNG，缩略图会丢掉透明（原图不受影响，灯箱照旧）。
  function thumbUrl(rawUrl, key, thumbN) {
    const base = rawUrl + '?imageMogr2/crop/' + thumbN + 'x' + thumbN + '/gravity/center';
    if (/\.jpe?g$/i.test(key)) return base + '/interlace/1';
    if (/\.png$/i.test(key)) return base + '/format/webp/quality/85';
    return base;
  }

  function showGridLoader(opts) {
    const o = opts || {};
    const seq = ++gridLoaderSeq;
    gridLoaderOwner = seq; // 最新一次的调用取得所有权
    // 转圈与「已显示 N 张」共用同一行、互斥显示，行高不变
    $('galleryBusyText').textContent = o.text || '加载中…';
    $('galleryBusy').hidden = false;
    $('galleryCount').hidden = true;
    const grid = $('galleryGrid');
    // 已经有骨架在屏幕上（上一次 reset 还没收尾）：沿用即可，不重复铺
    if (o.skeleton && !grid.querySelector('.sk-tile')) fillSkeleton(); // 只追加，永不清空网格
    return seq;
  }

  // 只有「最新一次」加载有权收尾：先返回的旧请求不能把新请求的骨架撤掉，
  // 否则点相册与点刷新两次 reset 重叠时会退回空白网格 —— 正是要修的那个问题。
  function hideGridLoader(seq) {
    if (!seq || seq !== gridLoaderOwner) return;
    $('galleryBusy').hidden = true;
    $('galleryCount').hidden = false;
    // 最新的 owner 收尾时顺手清干净所有骨架块（含它继承来的上一轮残留）
    $('galleryGrid').querySelectorAll('.sk-tile').forEach((el) => el.remove());
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('已复制');
  }

  function authHeaders() {
    const h = { 'content-type': 'application/json' };
    if (cfg.password) h['x-picbed-key'] = cfg.password;
    return h;
  }

  function listHeaders() {
    const h = {};
    if (cfg.password) h['x-picbed-key'] = cfg.password;
    return h;
  }

  function baseUrl() {
    return (cfg.customDomain || `https://${cfg.bucket}.cos.${cfg.region}.myqcloud.com`).replace(/\/+$/, '');
  }
  function publicUrl(key) { return `${baseUrl()}/${key}`; }

  function needWorker() {
    if (cfg.worker) return true;
    openSettings();
    toast('请先在设置中填写 Worker 地址', true);
    return false;
  }

  function makeLinks(url, name) {
    const alt = String(name || 'image').replace(/[\[\]()]/g, '');
    return { url, markdown: `![${alt}](${url})`, html: `<img src="${url}" alt="${alt}" />` };
  }

  const TYPE_EXT_MAP = {
    'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/webp': 'webp',
    'image/svg+xml': 'svg', 'image/avif': 'avif', 'image/bmp': 'bmp', 'image/x-icon': 'ico',
  };

  function sanitizeSegment(seg) {
    return String(seg || '').trim().replace(/[\\:*?"<>|]+/g, '_').replace(/^\.+$/, '');
  }

  // relPath 支持子目录（文件夹上传时保留目录结构）；prefix 指定上传目标相册（默认当前目录）
  function makeKey(relPath, type, prefix) {
    const parts = String(relPath || '').replace(/\\/g, '/').split('/').filter(Boolean).map(sanitizeSegment).filter(Boolean);
    let name = parts.pop() || '';
    if (!name || name === '_') name = 'image_' + Math.random().toString(36).slice(2, 8) + '.' + (TYPE_EXT_MAP[type] || 'bin');
    return (prefix || galleryPrefix) + (parts.length ? parts.join('/') + '/' : '') + name;
  }

  function errMsg(e) {
    if (!e) return '未知错误';
    if (typeof e === 'string') return e;
    if (e.message) return e.message;
    if (e.error) {
      if (typeof e.error === 'string') return e.error;
      if (e.error.Message) return e.error.Message;
      if (e.error.Code) return 'COS 错误 ' + e.error.Code;
    }
    if (e.statusCode) return 'HTTP ' + e.statusCode;
    try { return JSON.stringify(e); } catch (x) { return '未知错误'; }
  }

  function isImageFile(f) {
    if (f.type && f.type.startsWith('image/')) return true;
    return IMAGE_EXTS.includes((f.name.split('.').pop() || '').toLowerCase());
  }

  // ---------- COS SDK（临时密钥） ----------
  let tokenCache = null;
  async function fetchToken() {
    const now = Date.now() / 1000;
    if (tokenCache && tokenCache.expiredTime > now + 120) return tokenCache;
    const res = await fetch(`${cfg.worker}/token`, { method: 'POST', headers: authHeaders() });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '获取上传凭证失败');
    tokenCache = data;
    return data;
  }

  const cos = new COS({
    getAuthorization(options, callback) {
      fetchToken()
        .then((d) => callback({
          TmpSecretId: d.credentials.tmpSecretId,
          TmpSecretKey: d.credentials.tmpSecretKey,
          SecurityToken: d.credentials.sessionToken,
          StartTime: Math.floor(Date.now() / 1000),
          ExpiredTime: d.expiredTime,
        }))
        .catch((e) => {
          toast(e.message, true);
          if (String(e.message).includes('密码')) openSettings();
          callback(null);
        });
    },
  });

  // ---------- 上传 ----------
  const queue = [];
  let processing = false;

  function addFiles(files, targetPrefix) {
    if (!needWorker()) return;
    let added = 0;
    let skippedNonImage = 0;
    let skippedTooBig = 0;
    let skippedReserved = 0;
    for (const f of files) {
      if (!isImageFile(f)) { skippedNonImage++; continue; }
      if (f.size > 50 * 1024 * 1024) { skippedTooBig++; continue; }
      // _picbed 为公开标记的保留命名空间，禁止上传进去
      const rel = String(f.__relPath || f.name).replace(/\\/g, '/');
      if (hasReservedSegment(rel.split('/').slice(0, -1).join('/')) || hasReservedSegment(galleryPrefix)) {
        skippedReserved++;
        continue;
      }
      enqueue(f, targetPrefix);
      added++;
    }
    if (skippedNonImage) toast(`已跳过 ${skippedNonImage} 个非图片文件`, true);
    if (skippedTooBig) toast(`已跳过 ${skippedTooBig} 个超过 50MB 的文件`, true);
    if (skippedReserved) toast(`已跳过 ${skippedReserved} 个位于保留目录 _picbed 的文件`, true);
    if (added) {
      openPanel(); // 开始上传时自动展开进度面板
      processQueue();
    } else if (!skippedNonImage && !skippedTooBig && !skippedReserved) toast('没有找到可上传的图片', true);
  }

  // 递归收集拖入的文件夹里的图片（保留相对路径）
  function readEntry(entry, parentPath, out) {
    return new Promise((resolve) => {
      if (!entry) return resolve();
      if (entry.isFile) {
        entry.file((f) => {
          if (f && isImageFile(f)) {
            try { Object.defineProperty(f, '__relPath', { value: parentPath + f.name }); } catch (e) {}
            out.push(f);
          }
          resolve();
        }, () => resolve());
      } else if (entry.isDirectory) {
        const reader = entry.createReader();
        const sub = parentPath + entry.name + '/';
        const readBatch = () => {
          reader.readEntries(async (entries) => {
            if (!entries || !entries.length) return resolve();
            for (const e of entries) await readEntry(e, sub, out);
            readBatch(); // readEntries 每次最多返回 100 项，需要反复读直到为空
          }, () => resolve());
        };
        readBatch();
      } else {
        resolve();
      }
    });
  }

  async function collectFromDataTransfer(dt) {
    const out = [];
    const items = dt && dt.items ? [...dt.items] : [];
    const entries = items
      .filter((it) => it.kind === 'file' && typeof it.webkitGetAsEntry === 'function')
      .map((it) => { try { return it.webkitGetAsEntry(); } catch (e) { return null; } })
      .filter(Boolean);
    if (entries.length) {
      const hasDir = entries.some((e) => e && e.isDirectory);
      if (hasDir) toast('正在扫描文件夹…');
      for (const e of entries) await readEntry(e, '', out);
      return out;
    }
    return [...((dt && dt.files) || [])];
  }

  function enqueue(file, uploadPrefix) {
    const row = document.createElement('div');
    row.className = 'q-item';
    const thumb = document.createElement('img');
    thumb.className = 'q-thumb';
    thumb.alt = '';
    const body = document.createElement('div');
    body.className = 'q-body';
    const name = document.createElement('div');
    name.className = 'q-name';
    name.textContent = file.__relPath || file.name;
    name.title = name.textContent;
    const bar = document.createElement('div');
    bar.className = 'q-bar';
    const fill = document.createElement('div');
    fill.className = 'q-fill';
    bar.appendChild(fill);
    const status = document.createElement('div');
    status.className = 'q-status';
    status.textContent = '等待上传';
    body.append(name, bar, status);
    row.append(thumb, body);
    if (URL.createObjectURL) {
      const u = URL.createObjectURL(file);
      thumb.src = u;
      thumb.onload = () => URL.revokeObjectURL(u);
    }
    $('queue').appendChild(row);
    queue.push({ file, row, fill, status, done: false, failed: false, pct: 0, prefix: uploadPrefix || null });
    updateUploadFab();
  }

  async function uploadFile(file, item, dupCtx) {
    const { fill, status, prefix } = item;
    const relPath = file.__relPath || file.name;
    let key = makeKey(relPath, file.type, prefix);
    if ((await headP(key)).state === 'exists') {
      let action = dupCtx.action;
      if (!action) {
        const res = await askDialog(`目标位置已有「${relPath}」，如何处理？`, { cancel: '跳过', file, oldKey: key });
        action = res.action;
        if (res.applyAll) dupCtx.action = action;
      }
      if (action === 'cancel') return { skipped: true };
      if (action === 'rename') key = await autoRenameKey(key);
    }
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    return new Promise((resolve, reject) => {
      cos.uploadFile({
        Bucket: cfg.bucket,
        Region: cfg.region,
        Key: key,
        Body: file,
        ContentType: file.type || TYPE_BY_EXT[ext] || 'image/png',
        onProgress(p) {
          const pct = Math.min(100, Math.round((p.percent || 0) * 100));
          item.pct = pct;
          fill.style.width = pct + '%';
          status.textContent = pct >= 100 ? '处理中…' : pct + '%';
          updateUploadFab();
        },
      }, (err) => {
        if (err) return reject(err);
        resolve(publicUrl(key));
      });
    });
  }

  async function processQueue() {
    if (processing) return;
    processing = true;
    let uploadedAny = false;
    const dupCtx = { action: null };
    try {
      for (const item of queue) {
        if (item.done) continue;
        item.pct = 0;
        item.status.textContent = '上传中…';
        try {
          const url = await uploadFile(item.file, item, dupCtx);
          item.done = true;
          if (url && url.skipped) {
            item.status.textContent = '已跳过（同名文件）';
            item.row.classList.add('done');
            updateUploadFab();
            await sleep(350);
            item.row.remove();
            continue;
          }
          uploadedAny = true;
          item.pct = 100;
          item.fill.style.width = '100%';
          item.status.textContent = '完成';
          item.row.classList.add('done');
          addResult(url, item.file.name);
          saveHistory(url, item.file.name);
          updateUploadFab();
          await sleep(350);
          item.row.remove();
        } catch (e) {
          console.error('[picbed] 上传失败:', e);
          item.failed = true;
          item.status.textContent = '失败：' + errMsg(e) + '（点此重试）';
          item.row.classList.add('error');
          item.status.onclick = () => {
            item.status.onclick = null;
            item.failed = false;
            item.status.textContent = '重试中…';
            item.row.classList.remove('error');
            updateUploadFab();
            processQueue();
          };
          updateUploadFab();
        }
      }
    } finally {
      processing = false;
      updateUploadFab();
      if (uploadedAny) loadGallery(true);
    }
  }

  // ---------- 结果 ----------
  const sessionResults = [];
  function addResult(url, name) {
    sessionResults.unshift({ url, name });
    $('resultsSection').hidden = false;
    const box = document.createElement('div');
    box.className = 'result';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = url;
    img.onerror = () => img.remove();
    const info = document.createElement('div');
    info.className = 'result-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'result-name';
    nameEl.textContent = name;
    const btns = document.createElement('div');
    btns.className = 'result-btns';
    const links = makeLinks(url, name);
    FMT.forEach((k) => {
      const b = document.createElement('button');
      b.className = 'btn small';
      b.appendChild(icon(FMT_ICON[k]));
      const lbl = document.createElement('span');
      lbl.textContent = FMT_LABEL[k];
      b.appendChild(lbl);
      b.onclick = () => copyText(links[k]);
      btns.appendChild(b);
    });
    info.append(nameEl, btns);
    box.append(img, info);
    $('results').prepend(box);
    updateUploadFab();
  }

  function copyAllResults() {
    if (!sessionResults.length) return toast('还没有上传结果');
    copyText(sessionResults.map((r) => makeLinks(r.url, r.name)[cfg.format]).join('\n'));
  }

  // ---------- 历史 ----------
  const HISTORY_KEY = 'picbed_history';
  let history = [];
  try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (e) {}

  function persistHistory() { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }

  function saveHistory(url, name) {
    history.unshift({ url, name, time: Date.now() });
    history = history.slice(0, 200);
    persistHistory();
    renderHistory();
  }

  function renderHistory() {
    const ul = $('historyList');
    ul.textContent = '';
    if (!history.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '暂无记录';
      ul.appendChild(li);
      updateUploadFab();
      return;
    }
    for (const h of history) {
      const li = document.createElement('li');
      const name = document.createElement('span');
      name.className = 'h-name';
      name.textContent = h.name || h.url.split('/').pop();
      name.title = h.url;
      const time = document.createElement('span');
      time.className = 'h-time';
      time.textContent = new Date(h.time).toLocaleString();
      const btns = document.createElement('span');
      btns.className = 'h-btns';
      const links = makeLinks(h.url, h.name);
      FMT.forEach((k) => {
        const b = document.createElement('button');
        b.className = 'btn small';
        b.appendChild(icon(FMT_ICON[k]));
        const lbl = document.createElement('span');
        lbl.textContent = FMT_LABEL[k];
        b.appendChild(lbl);
        b.onclick = () => copyText(links[k]);
        btns.appendChild(b);
      });
      const del = document.createElement('button');
      del.className = 'btn small danger';
      del.appendChild(icon('x'));
      del.title = '删除记录';
      del.onclick = () => { history = history.filter((x) => x !== h); persistHistory(); renderHistory(); };
      btns.appendChild(del);
      li.append(name, time, btns);
      ul.appendChild(li);
    }
    updateUploadFab();
  }

  // ---------- 上传状态面板（右下悬浮按钮） ----------
  // 视图模式：'admin' = 管理视图，'public' = 游客公开视图（见 switchView）
  // 本机已保存密码则直接进管理视图，否则默认展示公开画廊
  let view = (cfg.password && cfg.worker) ? 'admin' : 'public';
  let panelOpen = false;

  function openPanel() {
    if (view !== 'admin') return;
    panelOpen = true;
    $('uploadPanel').hidden = false;
    $('panelBackdrop').hidden = false;
  }

  function closePanel() {
    panelOpen = false;
    $('uploadPanel').hidden = true;
    $('panelBackdrop').hidden = true;
  }

  function togglePanel() { if (panelOpen) closePanel(); else openPanel(); }

  function updateUploadFab() {
    const uploading = queue.filter((it) => !it.done && !it.failed);
    const failed = queue.filter((it) => !it.done && it.failed);
    const hasContent = !!(uploading.length || failed.length || sessionResults.length || history.length);
    $('uploadFab').hidden = view !== 'admin' || !hasContent;
    $('uploadFab').classList.toggle('idle', !uploading.length && !failed.length);
    const badge = $('fabBadge');
    if (uploading.length) {
      const avg = Math.round(uploading.reduce((s, it) => s + (it.pct || 0), 0) / uploading.length);
      badge.className = 'fab-badge';
      badge.textContent = avg + '%';
      $('panelBadge').textContent = `上传中 ${uploading.length} 个`;
    } else if (failed.length) {
      badge.className = 'fab-badge';
      badge.textContent = '失败 ' + failed.length;
      $('panelBadge').textContent = `失败 ${failed.length} 个（点列表中的失败项可重试）`;
    } else if (sessionResults.length) {
      badge.className = 'fab-badge ok';
      badge.textContent = '完成 ' + sessionResults.length;
      $('panelBadge').textContent = `本次已完成 ${sessionResults.length} 个`;
    } else {
      badge.className = 'fab-badge idle';
      badge.textContent = '';
      $('panelBadge').textContent = '';
    }
    // 没有可展示的内容时收起面板（不调用 closePanel，避免递归）
    if (!hasContent && panelOpen) {
      panelOpen = false;
      $('uploadPanel').hidden = true;
      $('panelBackdrop').hidden = true;
    }
  }

  // ---------- 相册 ----------
  let galleryMarker = '';
  let galleryLoaded = 0;
  let galleryPrefix = cfg.prefix + '/'; // 当前目录（尾部带 /）
  // 相册内容的世代号：每次发起加载都 ++（管理视图与公开画廊共用同一个 #galleryGrid，
  // 所以也共用一个世代号）。await 返回后只有「最新一次」请求有权往网格里写内容与分页
  // 状态 —— 否则「打开子相册，还没加载完就退回父目录」时，子相册的响应会晚于父目录
  // 到达，把子相册的条目追加到已经渲染好的父目录下面。与 gridLoaderSeq 同一套思路，
  // 区别是那个只管骨架/转圈的收尾，这个管网格内容。
  let galleryReqSeq = 0;
  let selectMode = false;
  const selectedKeys = new Set();
  let anchorFig = null; // Shift 连选的锚点卡片

  // 公开画廊：publicPrefix 是相对 cfg.prefix 的路径（'' 或 'xxx/'）
  let publicPrefix = '';
  let publicMarker = '';
  let publicLoaded = 0;
  const publicKeys = new Set(); // 已公开图片的相对键（相对 cfg.prefix）
  let publicKeysLoaded = false; // publicKeys 是否已完整加载过；未加载完成时缓存不可信

  function pubRelOf(key) {
    const root = cfg.prefix + '/';
    return key.startsWith(root) ? key.slice(root.length) : key;
  }
  // 公开标记键：img/_picbed/public/<相对键>（零字节对象）
  function pubMarkerOf(key) {
    return cfg.prefix + '/_picbed/public/' + pubRelOf(key);
  }

  // 收集 keys 中「实际已公开」的标记键。
  // publicKeys 已完整加载过时直接查缓存（未命中即「未公开」，零额外请求）；
  // 加载失败或尚未完成时缓存不可信，才逐张 HEAD COS 兜底 ——
  // 否则 /public 一次失败会让后续移动静默丢掉公开状态、删除残留孤儿标记
  async function collectPublicMarkers(keys) {
    const out = [];
    for (const k of keys) {
      if (publicKeys.has(pubRelOf(k))) { out.push(pubMarkerOf(k)); continue; }
      if (!publicKeysLoaded && (await headP(pubMarkerOf(k))).state === 'exists') out.push(pubMarkerOf(k));
    }
    return out;
  }

  function getBucketP(params) {
    return new Promise((resolve, reject) => {
      cos.getBucket({ Bucket: cfg.bucket, Region: cfg.region, ...params }, (err, data) => (err ? reject(err) : resolve(data)));
    });
  }
  function copyP(sourceKey, targetKey) {
    return new Promise((resolve, reject) => {
      cos.sliceCopyFile({
        Bucket: cfg.bucket,
        Region: cfg.region,
        Key: targetKey,
        CopySource: `${cfg.bucket}.cos.${cfg.region}.myqcloud.com/${sourceKey.split('/').map(encodeURIComponent).join('/')}`,
      }, (err, data) => (err ? reject(err) : resolve(data)));
    });
  }
  function putP(key, body) {
    return new Promise((resolve, reject) => {
      cos.putObject({ Bucket: cfg.bucket, Region: cfg.region, Key: key, Body: body || '' }, (err, data) => (err ? reject(err) : resolve(data)));
    });
  }
  function deleteKeysP(keys) {
    return new Promise((resolve, reject) => {
      const chunks = [];
      for (let i = 0; i < keys.length; i += 500) chunks.push(keys.slice(i, i + 500));
      let idx = 0;
      const next = () => {
        if (idx >= chunks.length) return resolve();
        cos.deleteMultipleObject({
          Bucket: cfg.bucket,
          Region: cfg.region,
          Objects: chunks[idx].map((k) => ({ Key: k })),
        }, (err) => {
          if (err) return reject(err);
          idx++;
          next();
        });
      };
      next();
    });
  }
  function headP(key) {
    return new Promise((resolve) => {
      cos.headObject({ Bucket: cfg.bucket, Region: cfg.region, Key: key }, (err, data) => {
        if (err) return resolve({ state: err.statusCode === 404 ? 'free' : 'error' });
        const size = data
          ? Number((data.headers && data.headers['content-length']) || data['content-length']) || 0
          : 0;
        resolve({ state: 'exists', size });
      });
    });
  }

  // 内容一致性检查：先比大小，大小相同则下载远端逐字节比对
  async function compareFiles(file, key) {
    const head = await headP(key);
    if (head.state !== 'exists') return 'unknown';
    if (head.size !== file.size) return 'diff';
    let remoteBuf;
    try {
      const resp = await fetch(publicUrl(key));
      if (!resp.ok) return 'size-same';
      remoteBuf = new Uint8Array(await resp.arrayBuffer());
    } catch (e) {
      return 'size-same';
    }
    const localBuf = new Uint8Array(await file.arrayBuffer());
    if (remoteBuf.length !== localBuf.length) return 'diff';
    for (let i = 0; i < localBuf.length; i++) {
      if (remoteBuf[i] !== localBuf[i]) return 'diff';
    }
    return 'same';
  }

  function askDialog(message, opts) {
    return new Promise((resolve) => {
      $('dupMsg').textContent = message;
      $('dupOverwrite').textContent = (opts && opts.overwrite) || '覆盖';
      $('dupRename').textContent = (opts && opts.rename) || '自动重命名';
      $('dupSkip').textContent = (opts && opts.cancel) || '取消';
      $('dupPreview').hidden = !(opts && opts.file);
      $('dupApplyAll').checked = false;
      if (opts && opts.file) {
        $('dupNewImg').src = URL.createObjectURL(opts.file);
        $('dupOldImg').src = publicUrl(opts.oldKey);
        compareFiles(opts.file, opts.oldKey).then((r) => {
          const el = $('dupCompare');
          const show = (cls, ic, text) => {
            el.textContent = '';
            el.className = 'dup-compare' + (cls ? ' ' + cls : '');
            if (ic) el.appendChild(icon(ic));
            if (text) el.appendChild(document.createTextNode(text));
          };
          if (r === 'same') show('same', 'check', '两个文件内容完全一致');
          else if (r === 'diff') show('diff', 'alert', '两个文件内容不同（覆盖会替换现有文件）');
          else if (r === 'size-same') show('', null, '大小一致，但无法完成内容比对');
          else show('', null, '');
        });
      } else {
        $('dupCompare').textContent = '';
        $('dupCompare').className = 'dup-compare';
      }
      $('dupDialog').hidden = false;
      const answer = (action) => {
        $('dupDialog').hidden = true;
        resolve({ action, applyAll: $('dupApplyAll').checked });
      };
      $('dupOverwrite').onclick = () => answer('overwrite');
      $('dupRename').onclick = () => answer('rename');
      $('dupSkip').onclick = () => answer('cancel');
    });
  }

  async function autoRenameKey(key) {
    const dot = key.lastIndexOf('.');
    const stem = dot > 0 ? key.slice(0, dot) : key;
    const ext = dot > 0 ? key.slice(dot) : '';
    for (let n = 1; n < 1000; n++) {
      const cand = `${stem} (${n})${ext}`;
      if ((await headP(cand)).state === 'free') return cand;
    }
    return `${stem}_${Date.now()}${ext}`;
  }

  async function resolveCollisions(pairs) {
    const collided = [];
    for (const p of pairs) {
      if ((await headP(p.targetKey)).state === 'exists') collided.push(p.targetKey);
    }
    if (!collided.length) return { action: 'go', map: {}, overwritten: [] };
    const { action } = await askDialog(`目标位置已有 ${collided.length} 个同名文件，如何处理？`, { cancel: '取消' });
    if (action === 'cancel') return { action: 'cancel', map: {}, overwritten: [] };
    // overwritten 非空表示这些目标键将被新内容覆盖，调用方需据此校正公开标记
    if (action === 'overwrite') return { action: 'go', map: {}, overwritten: collided };
    const map = {};
    for (const t of collided) map[t] = await autoRenameKey(t);
    return { action: 'go', map, overwritten: [] };
  }

  async function listAllKeys(prefix) {
    const all = [];
    let marker = '';
    for (;;) {
      const data = await getBucketP({ Prefix: prefix, MaxKeys: 1000, Marker: marker });
      all.push(...(data.Contents || []).map((c) => c.Key));
      if (String(data.IsTruncated) === 'true' && data.NextMarker) marker = data.NextMarker;
      else break;
    }
    return all;
  }

  // 相册路径：允许用 / 分隔多级目录，逐段清洗非法字符并过滤 . 与 ..
  function sanitizePath(input) {
    return String(input || '')
      .replace(/\\/g, '/')
      .split('/')
      .map((s) => sanitizeSegment(s).slice(0, 40))
      .filter(Boolean)
      .join('/');
  }

  // 保留命名空间：img/_picbed/ 存公开标记，禁止作为相册名/上传目录使用
  const RESERVED_SEGMENT = '_picbed';

  function hasReservedSegment(path) {
    return String(path || '')
      .replace(/\\/g, '/')
      .split('/')
      .some((s) => sanitizeSegment(s).toLowerCase() === RESERVED_SEGMENT);
  }

  // 逐级创建相册标记，保证多级路径下每一层都是真实存在的相册
  async function ensureAlbumPath(prefix) {
    const root = cfg.prefix + '/';
    if (!prefix || !prefix.startsWith(root)) return;
    const rel = prefix.slice(root.length).replace(/\/+$/, '');
    if (!rel || hasReservedSegment(rel)) return;
    let acc = root;
    for (const seg of rel.split('/')) {
      acc += seg + '/';
      await putP(acc, '');
    }
    invalidateAlbumTree();
  }

  // 解析「新建 / 移动 / 重命名」输入的目标目录：
  //   留空 = 图床根目录；以 / 开头 = 相对图床根目录；否则相对当前目录
  //   命中保留命名空间时返回 null
  function parseTargetPrefix(raw) {
    const text = String(raw == null ? '' : raw).trim();
    const abs = text.startsWith('/');
    const path = sanitizePath(text.replace(/^\/+/, ''));
    if (hasReservedSegment(path)) return null;
    if (!path) return cfg.prefix + '/';
    return abs ? cfg.prefix + '/' + path + '/' : galleryPrefix + path + '/';
  }

  // ---------- 自定义弹窗 ----------
  // 统一的文本输入弹窗：确定返回输入值（未输入返回空串），取消返回 null
  function promptDialog(opts) {
    const o = opts || {};
    return new Promise((resolve) => {
      const dlg = $('promptDialog');
      const input = $('promptInput');
      $('promptTitle').textContent = o.title || '输入';
      $('promptLabel').textContent = o.label || '内容';
      $('promptHelp').textContent = o.help || '';
      $('promptOk').textContent = o.confirmText || '确定';
      input.value = o.value || '';
      input.placeholder = o.placeholder || '';
      $('promptTreeWrap').hidden = !o.tree;
      let done = false;
      const finish = (val) => {
        if (done) return;
        done = true;
        dlg.hidden = true;
        resolve(val);
      };
      if (o.tree) {
        // 点击树节点：填入路径；若输入框里已有一个纯名称（如重命名时的相册名）则保留在末尾
        const onPick = (p) => {
          const cur = input.value.trim();
          const keep = cur && !cur.includes('/') ? cur : '';
          input.value = keep ? p + keep : p;
          input.focus();
        };
        // 自动补全的查询词取「目录部分」，纯名称不参与过滤（否则重命名时树会被自己的名字过滤掉）
        const treeQuery = () => {
          const v = input.value.trim().replace(/^\/+/, '');
          return v.endsWith('/') ? v : v.split('/').slice(0, -1).join('/');
        };
        const refresh = () => renderAlbumTree(treeQuery, onPick);
        input.oninput = refresh;
        refresh();
      } else {
        input.oninput = null;
      }
      input.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); finish(input.value); }
      };
      $('promptOk').onclick = () => finish(input.value);
      $('promptCancel').onclick = () => finish(null);
      dlg.onclick = (e) => { if (e.target === dlg) finish(null); };
      dlg.hidden = false;
      input.focus();
      input.select();
    });
  }

  // 统一的确认弹窗：确定返回 true，取消返回 false
  function confirmDialog(opts) {
    const o = opts || {};
    return new Promise((resolve) => {
      const dlg = $('confirmDialog');
      $('confirmTitle').textContent = o.title || '确认';
      $('confirmMsg').textContent = o.message || '';
      const ok = $('confirmOk');
      ok.textContent = o.okText || '删除';
      ok.className = o.danger === false ? 'btn primary' : 'btn danger-solid';
      let done = false;
      const finish = (val) => {
        if (done) return;
        done = true;
        dlg.hidden = true;
        resolve(val);
      };
      ok.onclick = () => finish(true);
      $('confirmCancel').onclick = () => finish(false);
      dlg.onclick = (e) => { if (e.target === dlg) finish(false); };
      dlg.hidden = false;
      ok.focus();
    });
  }

  // ---------- 相册目录树（弹窗内补全用） ----------
  let albumTreePaths = null;   // 扁平的相册路径数组（相对 cfg.prefix）
  let albumTreeLoading = null;

  function invalidateAlbumTree() { albumTreePaths = null; }

  // 从 /list 全量结果推导相册路径：标记对象（尾 /）直接成路径，
  // 普通对象则补上其所有祖先目录（覆盖文件夹上传产生的隐式目录）
  function buildAlbumPaths(items) {
    const root = cfg.prefix + '/';
    const set = new Set();
    for (const it of items) {
      const key = (it && it.key) || '';
      if (!key.startsWith(root)) continue;
      const rel = key.slice(root.length);
      if (!rel || hasReservedSegment(rel)) continue; // 保留命名空间不进目录树
      if (rel.endsWith('/')) { set.add(rel); continue; }
      const dirs = rel.split('/').slice(0, -1);
      let acc = '';
      for (const d of dirs) { acc += d + '/'; set.add(acc); }
    }
    return [...set].sort();
  }

  async function ensureAlbumTree() {
    if (albumTreePaths) return albumTreePaths;
    if (albumTreeLoading) return albumTreeLoading;
    albumTreeLoading = (async () => {
      const items = [];
      let marker = '';
      for (;;) {
        const res = await fetch(`${cfg.worker}/list${marker ? '?marker=' + encodeURIComponent(marker) : ''}`, { headers: listHeaders() });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || '加载相册列表失败');
        items.push(...(data.items || []));
        if (data.truncated && data.nextMarker) marker = data.nextMarker;
        else break;
      }
      albumTreePaths = buildAlbumPaths(items);
      return albumTreePaths;
    })();
    try {
      return await albumTreeLoading;
    } finally {
      albumTreeLoading = null;
    }
  }

  // 扁平路径 → 嵌套树
  function albumTreeFromPaths(paths) {
    const root = { name: '', rel: '', children: new Map() };
    for (const p of paths) {
      let node = root;
      let acc = '';
      for (const seg of p.replace(/\/+$/, '').split('/')) {
        if (!seg) continue;
        acc += seg + '/';
        if (!node.children.has(seg)) node.children.set(seg, { name: seg, rel: acc, children: new Map() });
        node = node.children.get(seg);
      }
    }
    return root;
  }

  // 递归渲染一级节点；子层懒展开
  function appendTreeLevel(node, container, onPick) {
    const kids = [...node.children.values()];
    if (!kids.length) return;
    const ul = document.createElement('ul');
    for (const k of kids) {
      const li = document.createElement('li');
      const row = document.createElement('div');
      row.className = 'tree-row';
      const sub = document.createElement('div');
      sub.hidden = true;
      const caret = document.createElement('button');
      caret.type = 'button';
      caret.className = 'tree-caret' + (k.children.size ? '' : ' leaf');
      caret.appendChild(icon('chevron'));
      if (k.children.size) {
        caret.onclick = (e) => {
          e.stopPropagation();
          if (sub.hidden && !sub.dataset.built) {
            sub.dataset.built = '1';
            appendTreeLevel(k, sub, onPick);
          }
          sub.hidden = !sub.hidden;
          caret.classList.toggle('open', !sub.hidden);
        };
      }
      const label = document.createElement('button');
      label.type = 'button';
      label.className = 'tree-label';
      label.textContent = k.name;
      label.title = '/' + k.rel;
      label.onclick = () => onPick('/' + k.rel);
      row.append(caret, label);
      li.append(row, sub);
      ul.appendChild(li);
    }
    container.appendChild(ul);
  }

  // 渲染目录树：输入框有内容时改为匹配结果列表（自动补全），否则展示完整树
  let treeRenderSeq = 0;
  async function renderAlbumTree(getQuery, onPick) {
    const seq = ++treeRenderSeq;
    const box = $('promptTree');
    const empty = (msg) => {
      box.textContent = '';
      const div = document.createElement('div');
      div.className = 'tree-empty';
      div.textContent = msg;
      box.appendChild(div);
    };
    let paths;
    try {
      paths = await ensureAlbumTree();
    } catch (e) {
      empty('无法加载相册列表，可手动输入路径');
      return;
    }
    if (seq !== treeRenderSeq) return; // 已有更新的渲染，丢弃本次
    if (!paths.length) { empty('还没有相册，直接输入路径即可创建'); return; }
    const query = String(getQuery ? getQuery() : '').trim().replace(/^\/+/, '').toLowerCase();
    box.textContent = '';
    if (query) {
      const hits = paths.filter((p) => p.toLowerCase().includes(query));
      if (!hits.length) { empty('没有匹配的相册'); return; }
      const ul = document.createElement('ul');
      for (const p of hits.slice(0, 50)) {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tree-label';
        b.textContent = p;
        b.onclick = () => onPick('/' + p);
        li.appendChild(b);
        ul.appendChild(li);
      }
      box.appendChild(ul);
      return;
    }
    appendTreeLevel(albumTreeFromPaths(paths), box, onPick);
  }

  // 「加载更多」按钮的加载态：转圈 + 文案，只改 .lbl，不碰按钮里的其它节点
  function loadMoreState(loading) {
    const btn = $('loadMore');
    btn.disabled = loading;
    const sp = btn.querySelector('.spin');
    if (sp) sp.hidden = !loading;
    setLabel(btn, loading ? '加载中…' : '加载更多');
  }

  async function loadGallery(reset) {
    if (!needWorker()) return; // 提前返回前不作废在途请求：这条路不清网格，让它照常渲染
    const seq = ++galleryReqSeq; // 本次加载取得所有权，所有在途请求就此作废
    const prefix = galleryPrefix; // 快照：await 期间用户可能已经切到别的目录
    if (reset) {
      galleryMarker = '';
      galleryLoaded = 0;
      $('galleryGrid').textContent = '';
      dlCancelAll(); // 和在途下载成对：卡片都没了，就别再往下下（blob 也在这里一起回收）
      clearSelection();
    }
    // 提前渲染面包屑：既让导航目标立刻可见，也让下面骨架量高度时量的是最终布局
    // （空的面包屑比填满后矮约 29px，量早了会多算一行骨架）
    renderBreadcrumb();
    const release = beginLoad();
    const gridSeq = showGridLoader(reset
      ? { skeleton: true, text: '正在加载相册…' }
      : { text: `正在加载更多…（已显示 ${galleryLoaded} 张）` });
    const btn = $('loadMore');
    loadMoreState(true);
    try {
      const data = await getBucketP({
        Prefix: prefix,
        Delimiter: '/',
        MaxKeys: cfg.maxKeys || 500,
        Marker: galleryMarker,
      });
      if (seq !== galleryReqSeq) return; // 已经切走：这份结果作废，一个节点都不许写进网格
      // 面包屑已在上面提前渲染过；await 期间一旦切走这里就已返回，无需再渲染一次
      if (reset) {
        const reserved = cfg.prefix + '/_picbed/';
        for (const f of data.CommonPrefixes || []) {
          if (f.Prefix === reserved) continue; // 公开标记的保留命名空间，管理视图不展示
          $('galleryGrid').appendChild(renderFolderTile(f.Prefix));
        }
      }
      const items = (data.Contents || [])
        .filter((c) => !c.Key.endsWith('/') && c.Key !== prefix)
        .reverse();
      const thumbN = cfg.thumb ? thumbSize() : 0; // 量一次布局，循环里复用
      for (const it of items) $('galleryGrid').appendChild(renderGridItem({ key: it.Key }, '', thumbN));
      refreshPublicIndicators(); // 公开状态可能先于/后于相册加载完成，渲染后再同步一次
      galleryLoaded += items.length;
      $('galleryCount').textContent = `已显示 ${galleryLoaded} 张`;
      galleryMarker = String(data.IsTruncated) === 'true' ? data.NextMarker : '';
      btn.hidden = !galleryMarker;
    } catch (e) {
      console.error('[picbed] 相册加载失败:', e.message || e);
      // 已经切走就连报错都不弹：用户看的是别的目录，这次失败与他无关
      if (seq === galleryReqSeq) toast('相册加载失败：' + ((e && e.error && e.error.Message) || e.message || e), true);
    } finally {
      hideGridLoader(gridSeq); // 内部按 gridLoaderOwner 判断，旧请求撤不掉新请求的骨架
      release();
      if (seq === galleryReqSeq) loadMoreState(false); // 旧请求收尾时别解开新请求的「加载中」
    }
  }

  // ---------- 公开画廊（游客视图） ----------
  function publicGridHint(msg, iconName) {
    const grid = $('galleryGrid');
    grid.textContent = '';
    const div = document.createElement('div');
    div.className = 'gallery-empty';
    div.appendChild(icon(iconName || 'image'));
    const span = document.createElement('span');
    span.textContent = msg;
    div.appendChild(span);
    grid.appendChild(div);
  }

  async function loadPublicGallery(reset) {
    const seq = ++galleryReqSeq; // 与 loadGallery 共用世代号：网格是同一个
    if (reset) {
      publicMarker = '';
      publicLoaded = 0;
      $('galleryGrid').textContent = '';
      dlCancelAll(); // 同上：网格清了，在途的缩略图请求与 blob 一起收掉
    }
    // 离线访客不点亮任何加载指示：beginLoad 必须在这些提前返回之后
    if (!cfg.worker) {
      // 上面已经清空网格并作废了在途请求，那条路的 loadMoreState(false) 不会再执行，这里补上
      loadMoreState(false);
      renderBreadcrumb();
      publicGridHint('还没有配置图片服务地址，无法加载公开画廊。', 'alert');
      return;
    }
    renderBreadcrumb(); // 同上：先渲染，骨架才量得准
    const release = beginLoad();
    const gridSeq = showGridLoader(reset
      ? { skeleton: true, text: '正在加载公开画廊…' }
      : { text: `正在加载更多…（已显示 ${publicLoaded} 张）` });
    const btn = $('loadMore');
    loadMoreState(true);
    try {
      const q = new URLSearchParams();
      if (publicPrefix) q.set('prefix', publicPrefix);
      if (publicMarker) q.set('marker', publicMarker);
      const res = await fetch(`${cfg.worker}/public?${q.toString()}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      if (seq !== galleryReqSeq) return; // 已经切走：这份结果作废，一个节点都不许写进网格
      // 面包屑已在上面提前渲染过；await 期间一旦切走这里就已返回，无需再渲染一次
      if (reset) {
        for (const folder of data.folders || []) $('galleryGrid').appendChild(renderPublicFolderTile(folder));
      }
      const files = (data.files || []).slice().reverse();
      const thumbN = cfg.thumb ? thumbSize() : 0; // 量一次布局，循环里复用
      for (const f of files) {
        $('galleryGrid').appendChild(renderGridItem({ key: cfg.prefix + '/' + f.key }, 'public', thumbN));
      }
      publicLoaded += files.length;
      $('galleryCount').textContent = `已显示 ${publicLoaded} 张公开图片`;
      publicMarker = data.truncated && data.nextMarker ? data.nextMarker : '';
      btn.hidden = !publicMarker;
      if (reset && !publicMarker && !publicLoaded && !(data.folders || []).length) {
        publicGridHint(publicPrefix ? '这个相册里还没有公开的图片。' : '还没有公开的图片。管理员可在「我的相册」里点图片右上角的公开按钮设为公开。');
      }
    } catch (e) {
      console.error('[picbed] 公开画廊加载失败:', e.message || e);
      if (seq !== galleryReqSeq) return; // 已经切走：别用错误提示盖掉新视图的内容
      if (reset) publicGridHint('公开画廊加载失败：' + (e.message || '无法连接服务') + '（若刚更新过页面，请确认 Worker 已重新部署）', 'alert');
      toast('公开画廊加载失败：' + (e.message || e), true);
    } finally {
      hideGridLoader(gridSeq); // 内部按 gridLoaderOwner 判断，旧请求撤不掉新请求的骨架
      release();
      if (seq === galleryReqSeq) loadMoreState(false); // 旧请求收尾时别解开新请求的「加载中」
    }
  }

  function renderPublicFolderTile(relPrefix) {
    const name = relPrefix.replace(/\/+$/, '').split('/').pop() || relPrefix;
    const fig = document.createElement('figure');
    fig.className = 'folder-tile';
    const iconEl = document.createElement('div');
    iconEl.className = 'folder-icon';
    iconEl.appendChild(icon('folder'));
    const cap = document.createElement('figcaption');
    cap.textContent = name;
    fig.append(iconEl, cap);
    fig.onclick = () => { publicPrefix = relPrefix; loadPublicGallery(true); };
    return fig;
  }

  // ---------- 公开状态（管理视图） ----------
  // 拉取全部公开标记，填充 publicKeys（以 /public 接口为准，无需密码）
  // 必须带 flat=1：否则子相册里的标记会被折叠进 folders，公开状态读不全
  async function loadPublicMarkers() {
    if (!cfg.worker) return;
    const release = beginLoad();
    // try/finally 必须在本函数内：调用点（switchView）的 .catch 在另一个函数里，
    // 那边只弹 toast，请求抛错时计数永远收不回来 → 进度条永久卡住
    try {
      const next = new Set();
      let marker = '';
      for (;;) {
        const q = new URLSearchParams();
        q.set('flat', '1');
        if (marker) q.set('marker', marker);
        const res = await fetch(`${cfg.worker}/public?${q.toString()}`);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        for (const f of data.files || []) next.add(f.key);
        if (data.truncated && data.nextMarker) marker = data.nextMarker;
        else break;
      }
      publicKeys.clear();
      next.forEach((k) => publicKeys.add(k));
      publicKeysLoaded = true; // 完整走完一轮才标记为可信
      refreshPublicIndicators();
      updateBulkBar();
    } finally {
      release();
    }
  }

  function refreshPublicIndicators() {
    document.querySelectorAll('#galleryGrid figure[data-key]').forEach((fig) => {
      const on = publicKeys.has(pubRelOf(fig.dataset.key));
      const btn = fig.querySelector('.pub-toggle');
      if (btn) {

  // ---------- 拖拽移动（图片 / 相册） ----------
  let dragPayload = null;
  let uploadTargetPrefix = null; // 文件上传悬停的目标相册（null = 当前相册）
  let uploadHoverTimer = null;

  function hasFilePayload(dt) {
    return !!(dt && dt.types && [...dt.types].includes('Files'));
  }

  function canDropInto(targetPrefix) {
    if (!dragPayload) return false;
    if (dragPayload.kind === 'folder') {
      // 不能拖进自己或自己的子相册（否则会无限自我复制）
      return !targetPrefix.startsWith(dragPayload.prefix);
    }
    return targetPrefix !== galleryPrefix; // 图片已在当前目录，拖回当前目录是空操作
  }

  function makeDropTarget(el, getTargetPrefix, allowUpload) {
    el.addEventListener('dragover', (e) => {
      if (dragPayload) {
        if (!canDropInto(getTargetPrefix())) return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        el.classList.add('drop-hover');
        return;
      }
      // 外部文件拖到相册卡片上：悬停即把上传目标切换为该相册
      if (allowUpload && view === 'admin' && hasFilePayload(e.dataTransfer)) {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'copy';
        el.classList.add('drop-hover');
        clearTimeout(uploadHoverTimer);
        if (uploadTargetPrefix !== getTargetPrefix()) {
          uploadTargetPrefix = getTargetPrefix();
          updateDropLabel();
        }
      }
    });
    el.addEventListener('dragleave', () => {
      el.classList.remove('drop-hover');
      if (!dragPayload && allowUpload) {
        // 移到别的卡片上时先由对方的 dragover 接管，这里延迟复位避免相互打架
        const t = getTargetPrefix();
        clearTimeout(uploadHoverTimer);
        uploadHoverTimer = setTimeout(() => {
          if (uploadTargetPrefix === t) {
            uploadTargetPrefix = null;
            updateDropLabel();
          }
        }, 60);
      }
    });
    el.addEventListener('drop', async (e) => {
      el.classList.remove('drop-hover');
      if (dragPayload) {
        if (!canDropInto(getTargetPrefix())) return;
        e.preventDefault();
        e.stopPropagation();
        performDrop(getTargetPrefix());
        return;
      }
      if (allowUpload && view === 'admin' && hasFilePayload(e.dataTransfer)) {
        e.preventDefault();
        e.stopPropagation(); // 拦住窗口处理器，否则同一批文件会上传两次
        const target = getTargetPrefix();
        endFileDrag(); // 拦下了窗口处理器，遮罩与拖拽状态得自己复位
        const files = await collectFromDataTransfer(e.dataTransfer);
        if (files.length) addFiles(files, target);
      }
    });
  }

  async function performDrop(targetPrefix) {
    const payload = dragPayload;
    dragPayload = null;
    if (!payload) return;
    if (payload.kind === 'folder') {
      const name = payload.prefix.slice(0, -1).split('/').pop();
      const parent = payload.prefix.slice(0, -(name.length + 1));
      if (targetPrefix === parent) return toast('已经在该位置', true);
      try {
        await ensureAlbumPath(targetPrefix);
      } catch (e) {}
      await moveFolder(payload.prefix, targetPrefix + name + '/');
    } else {
      await moveImagesTo(payload.keys, targetPrefix);
    }
  }

  async function moveImagesTo(keys, targetPrefix) {
    if (!keys || !keys.length) return;
    if (targetPrefix === galleryPrefix) return toast('图片已经在该目录', true);
    const pairs = keys.map((k) => ({ key: k, targetKey: targetPrefix + k.split('/').pop() }));
    const { action, map, overwritten } = await resolveCollisions(pairs);
    if (action === 'cancel') return toast('已取消');
    try {
      await ensureAlbumPath(targetPrefix);
      for (let i = 0; i < pairs.length; i++) {
        await copyP(pairs[i].key, map[pairs[i].targetKey] || pairs[i].targetKey);
        if (i % 5 === 0 || i === pairs.length - 1) toast(`移动中 ${i + 1}/${pairs.length}`);
      }
      // 公开标记跟随图片移动（保持公开状态），旧标记随原图一起删除
      const oldMarkers = await collectPublicMarkers(keys);
      const movedPublic = pairs.filter((p) => oldMarkers.includes(pubMarkerOf(p.key)));
      for (const p of movedPublic) {
        const newKey = map[p.targetKey] || p.targetKey;
        await putP(pubMarkerOf(newKey), '');
        publicKeys.delete(pubRelOf(p.key));
        publicKeys.add(pubRelOf(newKey));
      }
      // 覆盖移动时校正目标位置的公开标记：不公开的图覆盖掉公开的同名图时，
      // 那个标记是上一个占用者留下的，会让新图凭空变公开
      const staleTargets = (overwritten || []).filter((t) => {
        const p = pairs.find((x) => x.targetKey === t);
        return p && !oldMarkers.includes(pubMarkerOf(p.key));
      });
      const staleMarkers = await collectPublicMarkers(staleTargets);
      staleTargets.forEach((t) => publicKeys.delete(pubRelOf(t)));
      await deleteKeysP(keys.concat(oldMarkers, staleMarkers));
      toast('移动完成');
      clearSelection();
      loadGallery(true);
    } catch (err) {
      toast('移动失败（已复制的文件保留在目标相册）：' + (err.message || err), true);
    }
  }

  function renderBreadcrumb() {
    const el = $('galleryPath');
    el.textContent = '';
    const isPublic = view === 'public';
    const rootPrefix = cfg.prefix + '/';
    const relCurrent = isPublic ? publicPrefix : galleryPrefix.slice(rootPrefix.length);
    const go = (prefix) => {
      if (isPublic) {
        publicPrefix = prefix.slice(rootPrefix.length);
        loadPublicGallery(true);
      } else {
        galleryPrefix = prefix;
        loadGallery(true);
      }
    };
    const crumb = (label, prefix, isCurrent, iconName) => {
      const b = document.createElement('button');
      b.className = 'crumb' + (isCurrent ? ' current' : '');
      if (iconName) b.appendChild(icon(iconName));
      b.appendChild(document.createTextNode(label));
      if (!isCurrent) b.onclick = () => go(prefix);
      if (!isPublic) makeDropTarget(b, () => prefix); // 可把图片/相册拖到上级目录
      el.appendChild(b);
    };
    const sep = () => {
      const s = document.createElement('span');
      s.className = 'sep';
      s.textContent = '/';
      el.appendChild(s);
    };
    crumb(isPublic ? '公开画廊' : '全部', rootPrefix, relCurrent === '', isPublic ? 'globe' : 'folder');
    if (relCurrent) {
      let acc = rootPrefix;
      const parts = relCurrent.replace(/\/$/, '').split('/');
      parts.forEach((p, i) => {
        sep();
        acc += p + '/';
        crumb(p, acc, i === parts.length - 1);
      });
    }
  }

  async function deleteAlbumDialog(prefix, name) {
    try {
      const keys = await listAllKeys(prefix);
      if (!keys.length) return toast('相册为空');
      const files = keys.filter((k) => !k.endsWith('/'));
      // 子相册（含空相册）也有零字节标记对象，必须一并删除，否则父相册删不掉
      const subAlbums = keys.filter((k) => k.endsWith('/') && k !== prefix).length;
      const extra = subAlbums ? ` 和 ${subAlbums} 个子相册` : '';
      const ok = await confirmDialog({
        title: '删除相册',
        message: `确定删除相册「${name}」？将删除其中 ${files.length} 张图片${extra}，不可恢复！`,
        okText: '删除相册',
      });
      if (!ok) return;
      // 公开标记也要一并清掉，否则会残留指向已删图片的孤儿标记
      const pubRoot = cfg.prefix + '/_picbed/public/';
      const rel = prefix.slice((cfg.prefix + '/').length);
      let pubMarkers = [];
      if (rel) {
        try {
          pubMarkers = await listAllKeys(pubRoot + rel);
        } catch (e) {
          pubMarkers = [];
        }
      }
      await deleteKeysP(keys.concat(pubMarkers)); // 文件 + 本相册标记 + 全部子相册标记 + 公开标记
      pubMarkers.forEach((m) => publicKeys.delete(m.slice(pubRoot.length)));
      invalidateAlbumTree();
      toast('相册已删除');
      loadGallery(true);
    } catch (err) {
      toast('删除失败：' + (err.message || err), true);

  async function moveFolder(oldPrefix, newPrefix) {
    if (!newPrefix || newPrefix === oldPrefix) return;
    invalidateAlbumTree(); // 目录结构即将变化
    const keys = await listAllKeys(oldPrefix);
    if (!keys.length) return toast('相册为空');
    const files = keys.filter((k) => !k.endsWith('/'));
    // 子相册标记（含空相册）也要一起搬走，否则旧相册会残留在父目录
    const markers = keys.filter((k) => k.endsWith('/') && k !== oldPrefix);
    const pairs = files.map((k) => ({ key: k, targetKey: newPrefix + k.slice(oldPrefix.length) }));
    const { action, map, overwritten } = await resolveCollisions(pairs);
    if (action === 'cancel') return toast('已取消');
    // 相册内已公开的图片：标记要跟着一起搬
    const root = cfg.prefix + '/';
    const pubRoot = cfg.prefix + '/_picbed/public/';
    const oldRel = oldPrefix.slice(root.length); // 旧相册相对路径（尾部带 /）
    let pubMarkers = [];
    if (oldRel) {
      try {
        pubMarkers = await listAllKeys(pubRoot + oldRel);
      } catch (e) {
        pubMarkers = [];
      }
    }
    // 本次移动中「源图公开」的图片（以服务端列出的标记为准，与上面的 pubMarkers 同源）
    const publicSourceKeys = new Set(
      pubMarkers.map((m) => cfg.prefix + '/' + oldRel + m.slice((pubRoot + oldRel).length))
    );
    // 覆盖移动时，被覆盖的目标键上遗留的公开标记必须清掉：
    // 不公开的图覆盖掉公开的同名图，旧标记会让新图凭空变公开
    const staleTargets = (overwritten || []).filter((t) => {
      const p = pairs.find((x) => x.targetKey === t);
      return p && !publicSourceKeys.has(p.key);
    });
    const staleMarkers = await collectPublicMarkers(staleTargets);
    staleTargets.forEach((t) => publicKeys.delete(pubRelOf(t)));
    const total = pairs.length + markers.length + pubMarkers.length; // staleMarkers 在最后批量删除，不计入逐项进度
    let done = 0;
    try {
      for (const p of pairs) {
        await copyP(p.key, map[p.targetKey] || p.targetKey);
        done++;
        if (done % 5 === 0 || done === total) toast(`移动中 ${done}/${total}`);
      }
      for (const m of markers) {
        await putP(newPrefix + m.slice(oldPrefix.length), '');
        done++;
        if (done % 5 === 0 || done === total) toast(`移动中 ${done}/${total}`);
      }
      for (const m of pubMarkers) {
        const inside = m.slice((pubRoot + oldRel).length); // 相册内的相对键
        const oldReal = cfg.prefix + '/' + oldRel + inside;
        // map 以「目标键」为键（resolveCollisions 的约定），必须用 newPrefix+inside 查，
        // 不能用 oldReal —— 否则目标有同名文件被自动重命名时，标记会写到旧的路径上
        const newReal = map[newPrefix + inside] || newPrefix + inside;
        await putP(pubMarkerOf(newReal), '');
        publicKeys.delete(pubRelOf(oldReal));
        publicKeys.add(pubRelOf(newReal));
        done++;
        if (done % 5 === 0 || done === total) toast(`移动中 ${done}/${total}`);
      }
      await deleteKeysP(keys.concat(pubMarkers, staleMarkers)); // 文件 + 旧相册标记 + 子相册旧标记 + 旧公开标记 + 被覆盖目标的遗留标记
      await ensureAlbumPath(newPrefix); // 多级路径逐层建好，并补上新相册标记
      toast('移动完成');
      loadGallery(true);
    } catch (err) {
      toast('移动失败（已复制的文件保留在新相册）：' + (err.message || err), true);
      loadGallery(true);
    }
  }
