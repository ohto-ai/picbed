<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicBed 图床</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%BC%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f6f8;
  --panel: #ffffff;
  --text: #1a1d24;
  --muted: #6b7280;
  --border: #e4e7ec;
  --accent: #2563eb;
  --accent-strong: #1d4ed8;
  --accent-soft: rgba(37, 99, 235, 0.10);
  --danger: #dc2626;
  --ok: #16a34a;
  --shadow: 0 2px 8px rgba(16, 24, 40, 0.08);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12141a;
    --panel: #1b1e27;
    --text: #e6e8ee;
    --muted: #8b93a5;
    --border: #2a2f3d;
    --accent: #3b82f6;
    --accent-strong: #60a5fa;
    --accent-soft: rgba(59, 130, 246, 0.16);
    --danger: #f87171;
    --ok: #4ade80;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px 64px; }

/* 头部 */
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 20px 0 12px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { font-size: 30px; }
h1 { margin: 0; font-size: 20px; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }

/* 视图切换（公开 / 我的相册） */
.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.tabs button { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 6px 14px; border-radius: 8px; white-space: nowrap; }
.tabs button:hover { color: var(--text); }
.tabs button.active { background: var(--accent); color: #fff; }
.view-public .admin-only { display: none !important; }

/* 按钮 */
.btn {
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-strong); }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn:disabled { opacity: .6; cursor: not-allowed; }

/* 面包屑导航（GitHub 风格，紧贴图片上方并吸顶） */
.gallery-path { position: sticky; top: 8px; z-index: 6; display: flex; align-items: center; flex-wrap: wrap; font-size: 16px; margin: 14px 0 12px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
.gallery-path .crumb { border: none; background: none; color: var(--accent); cursor: pointer; font-size: 15px; padding: 3px 10px; border-radius: 6px; }
.gallery-path .crumb:hover { background: var(--accent-soft); }
.gallery-path .sep { color: var(--muted); }
.gallery-path .crumb.current { font-weight: 700; color: var(--text); cursor: default; }
.gallery-path .crumb.current:hover { background: none; }
.gallery-path .crumb.drop-hover { background: var(--accent-soft); outline: 2px dashed var(--accent); outline-offset: -2px; }

/* 拖拽移动反馈 */
.grid figure.dragging { opacity: .4; }
.grid figure.drop-hover { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }
.grid figure.drop-hover .folder-icon { transform: scale(1.08); }

/* 全页拖放遮罩 */
#dropOverlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; z-index: 70; padding: 20px; pointer-events: none; }
.drop-overlay-box { background: var(--panel); border: 3px dashed var(--accent); border-radius: var(--radius); padding: 48px 64px; text-align: center; }
.dz-icon { font-size: 40px; }
.drop-overlay-box p { margin: 8px 0 0; }
.dz-hint { font-size: 12px; color: var(--muted); }
.gallery-hint { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }

.urlbar { display: flex; gap: 8px; margin: 14px 0; }
.urlbar input {
  flex: 1; border: 1px solid var(--border); background: var(--panel); color: var(--text);
  border-radius: 8px; padding: 8px 12px; font-size: 13px; outline: none;
}
.urlbar input:focus { border-color: var(--accent); }

/* 上传队列 */
.q-item {
  display: flex; gap: 12px; align-items: center; background: var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 8px;
}
.q-item.done { border-color: var(--ok); }
.q-item.error { border-color: var(--danger); }
.q-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--border); flex-shrink: 0; }
.q-body { flex: 1; min-width: 0; }
.q-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-bar { height: 4px; background: var(--border); border-radius: 2px; margin: 6px 0; overflow: hidden; }
.q-fill { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .2s; }
.q-status { font-size: 12px; color: var(--muted); }
.q-item.error .q-status { color: var(--danger); cursor: pointer; }

/* 区块标题 */
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 10px; }
.section-head h2 { font-size: 15px; margin: 0; }

/* 上传结果 */
.results { display: flex; flex-direction: column; gap: 8px; }
.result { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }
.result img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--border); flex-shrink: 0; }
.result-info { flex: 1; min-width: 0; }
.result-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-btns { display: flex; gap: 6px; margin-top: 4px; }

/* 历史 */
.history { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 22px; padding: 4px 14px; }
.history summary { cursor: pointer; padding: 10px 0; font-size: 14px; }
.history-toolbar { text-align: right; padding: 4px 0; }
.history ul { list-style: none; margin: 0; padding: 0 0 10px; }
.history li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
.history li.empty { color: var(--muted); justify-content: center; }
.h-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-time { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.h-btns { display: flex; gap: 4px; flex-shrink: 0; }

/* 相册 */
.gallery-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.gallery-toolbar .check { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }
.gallery-spacer { flex: 1; }
.gallery-path { font-size: 13px; color: var(--muted); display: inline-flex; gap: 2px; align-items: center; }
.gallery-path .crumb { border: none; background: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 0 2px; }
#selectModeBtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
#galleryCount { color: var(--muted); font-size: 12px; }

.bulk-bar { position: sticky; top: 58px; z-index: 5; display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
#bulkCount { font-size: 13px; }

.folder-tile { cursor: pointer; }
.folder-tile .folder-icon { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 54px; background: linear-gradient(135deg, var(--accent-soft), transparent); }
.folder-tile .folder-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity .12s; z-index: 2; }
.folder-tile:hover .folder-actions { opacity: 1; }
.folder-tile .folder-actions button { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; cursor: pointer; font-size: 13px; padding: 2px 7px; box-shadow: var(--shadow); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.gallery-meta { font-size: 12px; color: var(--muted); margin: -4px 0 10px; min-height: 18px; }
.gallery-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 13px; padding: 28px 8px; }
/* 图片卡片上的公开切换按钮 */
.grid figure .pub-toggle { position: absolute; top: 6px; right: 6px; z-index: 2; border: 1px solid var(--border); background: var(--panel); border-radius: 6px; cursor: pointer; font-size: 13px; padding: 2px 7px; box-shadow: var(--shadow); opacity: 0; transition: opacity .12s; }
.grid figure:hover .pub-toggle { opacity: 1; }
/* 公开状态由文件名前的 pub 徽标表达，按钮只在悬停时出现；.on 仅保留高亮样式 */
.grid figure .pub-toggle.on { border-color: var(--accent); background: var(--accent-soft); }
.grid figure .pub-toggle:disabled { opacity: .5; cursor: not-allowed; }
.grid figure { position: relative; margin: 0; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: zoom-in; transition: transform .12s, box-shadow .12s; }
.grid figure:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.grid figure.selected { outline: 2px solid var(--accent); }
.grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--border); }
.grid figcaption { font-size: 12px; color: var(--muted); padding: 5px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel-check { position: absolute; top: 6px; left: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); border: 2px solid var(--border); z-index: 2; }
.grid figure.selected .sel-check { background: var(--accent); border-color: var(--accent); }
.grid figure.selected .sel-check::after { content: '✓'; color: #fff; font-size: 11px; position: absolute; top: -1px; left: 2px; }
.grid figure.selectable { cursor: pointer; }
/* 文件名前的公开状态徽标 */
.pub-badge { display: inline-block; font-size: 10px; font-weight: 600; line-height: 1.4; color: #fff; background: var(--ok); border-radius: 8px; padding: 0 5px; margin-right: 4px; vertical-align: 1px; }
/* 多选模式下的拖动框选 */
#marquee { position: fixed; z-index: 65; border: 1px solid var(--accent); background: var(--accent-soft); pointer-events: none; }
body.marqueeing { user-select: none; -webkit-user-select: none; }
body.marqueeing .grid figure { cursor: default; transform: none; }
/* 右键菜单 */
#ctxMenu { position: fixed; z-index: 90; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; min-width: 176px; }
#ctxMenu button { display: block; width: 100%; text-align: left; border: none; background: none; color: var(--text); font-size: 13px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
#ctxMenu button:hover { background: var(--accent-soft); color: var(--accent); }
#ctxMenu button.danger { color: var(--danger); }
#ctxMenu .ctx-sep { height: 1px; background: var(--border); margin: 4px 8px; }
.gallery-more { text-align: center; margin-top: 14px; }

/* 设置弹窗 */
/* z-index 70：必须盖过灯箱（60），灯箱里点删除弹出的确认框才可见 */
.dialog { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; z-index: 70; padding: 16px; }
.dialog-box { background: var(--panel); border-radius: var(--radius); padding: 20px 22px; width: 100%; max-width: 420px; box-shadow: var(--shadow); }
.dialog-box h2 { margin: 0 0 14px; font-size: 16px; }
.dialog-box p { margin: 0 0 14px; color: var(--muted); word-break: break-all; }
.dup-preview { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
.dup-side { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.dup-side img { width: 110px; height: 110px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); background: var(--border); }
.dup-arrow { font-size: 18px; color: var(--muted); }
.dup-compare { font-size: 12px; font-weight: 600; }
.dup-compare.same { color: var(--ok); }
.dup-compare.diff { color: var(--danger); }
.dup-apply { margin: 0 0 12px; }
.field { display: block; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
.field .req { color: var(--danger); }
.field input, .field select {
  width: 100%; margin-top: 4px; border: 1px solid var(--border); background: var(--bg);
  color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field .hint { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger-solid:hover { filter: brightness(1.1); }

/* 目录树（弹窗内选相册） */
.tree { max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; margin-top: 6px; background: var(--bg); }
.tree ul { list-style: none; margin: 0; padding-left: 14px; }
.tree > ul { padding-left: 0; }
.tree-empty { font-size: 12px; color: var(--muted); padding: 4px 2px; }
.tree-row { display: flex; align-items: center; }
.tree-caret { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 9px; padding: 3px 4px; line-height: 1; transition: transform .12s; }
.tree-caret.open { transform: rotate(90deg); }
.tree-caret.leaf { visibility: hidden; cursor: default; }
.tree-label { border: none; background: none; color: var(--text); cursor: pointer; font-size: 13px; padding: 3px 6px; border-radius: 6px; text-align: left; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-label:hover { background: var(--accent-soft); color: var(--accent); }

/* 灯箱 */
.lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .75); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
.lightbox-box { position: relative; max-width: min(920px, 94vw); max-height: 92vh; display: flex; flex-direction: column; gap: 10px; }
.lightbox img { max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: var(--radius); background: #000; }
.lightbox-close { position: absolute; top: -12px; right: -12px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; font-size: 15px; }
.lightbox-info { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.lightbox-name { font-size: 12px; color: #cbd5e1; word-break: break-all; text-align: center; }
.lightbox-actions { display: flex; gap: 8px; }

/* Toast */
#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 9px 18px; border-radius: 20px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 80; max-width: 90vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { background: var(--danger); color: #fff; }

/* 上传状态悬浮按钮 + 面板 */
.upload-fab {
  position: fixed; right: 20px; bottom: 24px; z-index: 40;
  width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--accent);
  background: var(--accent); color: #fff; font-size: 20px; cursor: pointer;
  box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center;
  transition: transform .12s, background .15s, border-color .15s;
}
.upload-fab:hover { transform: translateY(-2px); }
.upload-fab.idle { background: var(--panel); color: var(--text); border-color: var(--border); }
.fab-badge {
  position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px;
  border-radius: 10px; background: var(--danger); color: #fff; font-size: 11px; line-height: 20px;
  text-align: center; font-weight: 600;
}
.fab-badge.ok { background: var(--ok); }
.fab-badge.idle { display: none; }
#panelBackdrop { position: fixed; inset: 0; z-index: 39; background: transparent; }
.upload-panel {
  position: fixed; right: 16px; bottom: 88px; z-index: 40;
  width: min(380px, calc(100vw - 32px)); max-height: min(70vh, 640px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 12px 14px;
}
.panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.panel-head h2 { margin: 0; font-size: 15px; }
.panel-badge { font-size: 12px; color: var(--muted); }
.panel-close { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 2px 7px; border-radius: 6px; }
.panel-close:hover { background: var(--accent-soft); color: var(--text); }
.upload-panel .history { margin-top: 14px; }
.upload-panel .section-head { margin: 14px 0 8px; }
.upload-panel .section-head h2 { font-size: 14px; }
.upload-panel:empty { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="logo">🖼️</span>
      <div>
        <h1>PicBed 图床</h1>
        <p id="bucketInfo"></p>
      </div>
    </div>
    <nav id="viewTabs" class="tabs">
      <button id="tabPublic">🌍 公开画廊</button>
      <button id="tabAdmin">🔒 我的相册</button>
    </nav>
    <button id="settingsBtn" class="btn ghost admin-only">⚙️ 设置</button>
  </header>

  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <input type="file" id="dirInput" webkitdirectory directory multiple hidden>

  <div class="gallery-toolbar admin-only">
    <button id="uploadBtn" class="btn primary">⬆️ 上传到当前目录</button>
    <button id="uploadDirBtn" class="btn">📂 上传文件夹</button>
    <button id="newAlbumBtn" class="btn">📁 新建相册</button>
    <button id="selectModeBtn" class="btn">☑️ 多选</button>
    <button id="refreshGallery" class="btn">🔄 刷新</button>
    <span class="gallery-spacer"></span>
    <label class="check"><input type="checkbox" id="thumbMode"> 缩略图</label>
  </div>
  <div class="gallery-hint admin-only">拖拽图片或整个文件夹到页面任意位置即可上传（自动递归、仅图片）· 拖到子相册卡片上则上传到该相册 · <b>拖动图片/相册卡片到相册上可移动</b> · 支持 Ctrl+V 粘贴 · 单张 ≤ 50MB</div>

  <div class="urlbar admin-only">
    <input id="urlInput" type="text" placeholder="粘贴任意图片 URL，点「转存」保存到图床…">
    <button id="urlBtn" class="btn">转存</button>
  </div>

  <div id="bulkBar" class="bulk-bar admin-only" hidden>
    <button id="bulkSelectAllBtn" class="btn small">全选</button>
    <button id="bulkInvertBtn" class="btn small">反选</button>
    <span id="bulkCount"></span>
    <button id="bulkMoveBtn" class="btn small">📦 移动到相册</button>
    <button id="bulkPublicBtn" class="btn small">🌍 设为公开</button>
    <button id="bulkDeleteBtn" class="btn small danger">批量删除</button>
    <button id="bulkCancelBtn" class="btn small ghost">取消选择</button>
  </div>

  <div id="galleryPath" class="gallery-path"></div>
  <div class="gallery-meta"><span id="galleryCount"></span></div>

  <div id="galleryGrid" class="grid"></div>
  <div class="gallery-more"><button id="loadMore" class="btn" hidden>加载更多</button></div>

  <div id="dropOverlay" hidden>
    <div class="drop-overlay-box">
      <div class="dz-icon">⬆️</div>
      <p id="dropTargetLabel">松开鼠标，上传到当前目录</p>
      <p class="dz-hint">支持整个文件夹（自动递归、仅图片）· 支持批量 · Ctrl+V 粘贴也可以</p>
    </div>
  </div>
</div>

<div id="panelBackdrop" class="admin-only" hidden></div>
<div id="uploadPanel" class="upload-panel admin-only" hidden>
  <div class="panel-head">
    <h2>⬆️ 上传</h2>
    <span id="panelBadge" class="panel-badge"></span>
    <span class="gallery-spacer"></span>
    <button id="panelClose" class="panel-close" title="收起">✕</button>
  </div>
  <div id="queue"></div>
  <div id="resultsSection" hidden>
    <div class="section-head">
      <h2>本次上传</h2>
      <button id="copyAllBtn" class="btn small">复制全部（当前格式）</button>
    </div>
    <div id="results" class="results"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cos-js-sdk-v5@1/dist/cos-js-sdk-v5.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------- 配置 ----------
  const DEFAULTS = {
    worker: '', bucket: 'album-1255316209', region: 'ap-shanghai',
    prefix: 'img', customDomain: '', maxKeys: 500,
    format: 'url', password: '', thumb: false,
  };
  let cfg = Object.assign({}, DEFAULTS, window.PICBED_CONFIG || {});
  const STORE_KEY = 'picbed_settings';
  try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) {}

  function saveSettings() {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      worker: cfg.worker, password: cfg.password,
      customDomain: cfg.customDomain, format: cfg.format, thumb: cfg.thumb,
    }));
  }

  // ---------- 通用 ----------
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const FMT = ['url', 'markdown', 'html'];
  const FMT_LABEL = { url: 'URL', markdown: 'MD', html: 'HTML' };
  const IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'avif', 'bmp', 'ico'];
  const TYPE_BY_EXT = {
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif',
    webp: 'image/webp', svg: 'image/svg+xml', avif: 'image/avif', bmp: 'image/bmp', ico: 'image/x-icon',
  };

  function toast(msg, isError) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.className = ''; }, 2600);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('已复制');
  }

  function authHeaders() {
    const h = { 'content-type': 'application/json' };
    if (cfg.password) h['x-picbed-key'] = cfg.password;
    return h;
  }

  function listHeaders() {
    const h = {};
    if (cfg.password) h['x-picbed-key'] = cfg.password;
    return h;
  }

  function baseUrl() {
    return (cfg.customDomain || `https://${cfg.bucket}.cos.${cfg.region}.myqcloud.com`).replace(/\/+$/, '');
  }
  function publicUrl(key) { return `${baseUrl()}/${key}`; }

  function needWorker() {
    if (cfg.worker) return true;
    openSettings();
    toast('请先在设置中填写 Worker 地址', true);
    return false;
  }

  function makeLinks(url, name) {
    const alt = String(name || 'image').replace(/[\[\]()]/g, '');
    return { url, markdown: `![${alt}](${url})`, html: `<img src="${url}" alt="${alt}" />` };
  }

  const TYPE_EXT_MAP = {
    'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/webp': 'webp',
    'image/svg+xml': 'svg', 'image/avif': 'avif', 'image/bmp': 'bmp', 'image/x-icon': 'ico',
  };

  function sanitizeSegment(seg) {
    return String(seg || '').trim().replace(/[\\:*?"<>|]+/g, '_').replace(/^\.+$/, '');
  }

  // relPath 支持子目录（文件夹上传时保留目录结构）；prefix 指定上传目标相册（默认当前目录）
  function makeKey(relPath, type, prefix) {
    const parts = String(relPath || '').replace(/\\/g, '/').split('/').filter(Boolean).map(sanitizeSegment).filter(Boolean);
    let name = parts.pop() || '';
    if (!name || name === '_') name = 'image_' + Math.random().toString(36).slice(2, 8) + '.' + (TYPE_EXT_MAP[type] || 'bin');
    return (prefix || galleryPrefix) + (parts.length ? parts.join('/') + '/' : '') + name;
  }

  function errMsg(e) {
    if (!e) return '未知错误';
    if (typeof e === 'string') return e;
    if (e.message) return e.message;
    if (e.error) {
      if (typeof e.error === 'string') return e.error;
      if (e.error.Message) return e.error.Message;
      if (e.error.Code) return 'COS 错误 ' + e.error.Code;
    }
    if (e.statusCode) return 'HTTP ' + e.statusCode;
    try { return JSON.stringify(e); } catch (x) { return '未知错误'; }
  }

  function isImageFile(f) {
    if (f.type && f.type.startsWith('image/')) return true;
    return IMAGE_EXTS.includes((f.name.split('.').pop() || '').toLowerCase());
  }

  // ---------- COS SDK（临时密钥） ----------
  let tokenCache = null;
  async function fetchToken() {
    const now = Date.now() / 1000;
    if (tokenCache && tokenCache.expiredTime > now + 120) return tokenCache;
    const res = await fetch(`${cfg.worker}/token`, { method: 'POST', headers: authHeaders() });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '获取上传凭证失败');
    tokenCache = data;
    return data;
  }

  const cos = new COS({
    getAuthorization(options, callback) {
      fetchToken()
        .then((d) => callback({
          TmpSecretId: d.credentials.tmpSecretId,
          TmpSecretKey: d.credentials.tmpSecretKey,
          SecurityToken: d.credentials.sessionToken,
          StartTime: Math.floor(Date.now() / 1000),
          ExpiredTime: d.expiredTime,
        }))
        .catch((e) => {
          toast(e.message, true);
          if (String(e.message).includes('密码')) openSettings();
          callback(null);
        });
    },
  });

  // ---------- 上传 ----------
  const queue = [];
  let processing = false;

  function addFiles(files, targetPrefix) {
    if (!needWorker()) return;
    let added = 0;
    let skippedNonImage = 0;
    let skippedTooBig = 0;
    let skippedReserved = 0;
    for (const f of files) {
      if (!isImageFile(f)) { skippedNonImage++; continue; }
      if (f.size > 50 * 1024 * 1024) { skippedTooBig++; continue; }
      // _picbed 为公开标记的保留命名空间，禁止上传进去
      const rel = String(f.__relPath || f.name).replace(/\\/g, '/');
      if (hasReservedSegment(rel.split('/').slice(0, -1).join('/')) || hasReservedSegment(galleryPrefix)) {
        skippedReserved++;
        continue;
      }
      enqueue(f, targetPrefix);
      added++;
    }
    if (skippedNonImage) toast(`已跳过 ${skippedNonImage} 个非图片文件`, true);
    if (skippedTooBig) toast(`已跳过 ${skippedTooBig} 个超过 50MB 的文件`, true);
    if (skippedReserved) toast(`已跳过 ${skippedReserved} 个位于保留目录 _picbed 的文件`, true);
    if (added) {
      openPanel(); // 开始上传时自动展开进度面板
      processQueue();
    } else if (!skippedNonImage && !skippedTooBig && !skippedReserved) toast('没有找到可上传的图片', true);
  }

  // 递归收集拖入的文件夹里的图片（保留相对路径）
  function readEntry(entry, parentPath, out) {
    return new Promise((resolve) => {
      if (!entry) return resolve();
      if (entry.isFile) {
        entry.file((f) => {
          if (f && isImageFile(f)) {
            try { Object.defineProperty(f, '__relPath', { value: parentPath + f.name }); } catch (e) {}
            out.push(f);
          }
          resolve();
        }, () => resolve());
      } else if (entry.isDirectory) {
        const reader = entry.createReader();
        const sub = parentPath + entry.name + '/';
        const readBatch = () => {
          reader.readEntries(async (entries) => {
            if (!entries || !entries.length) return resolve();
            for (const e of entries) await readEntry(e, sub, out);
            readBatch(); // readEntries 每次最多返回 100 项，需要反复读直到为空
          }, () => resolve());
        };
        readBatch();
      } else {
        resolve();
      }
    });
  }

  async function collectFromDataTransfer(dt) {
    const out = [];
    const items = dt && dt.items ? [...dt.items] : [];
    const entries = items
      .filter((it) => it.kind === 'file' && typeof it.webkitGetAsEntry === 'function')
      .map((it) => { try { return it.webkitGetAsEntry(); } catch (e) { return null; } })
      .filter(Boolean);
    if (entries.length) {
      const hasDir = entries.some((e) => e && e.isDirectory);
      if (hasDir) toast('正在扫描文件夹…');
      for (const e of entries) await readEntry(e, '', out);
      return out;
    }
    return [...((dt && dt.files) || [])];
  }

  function enqueue(file, uploadPrefix) {
    const row = document.createElement('div');
    row.className = 'q-item';
    const thumb = document.createElement('img');
    thumb.className = 'q-thumb';
    thumb.alt = '';
    const body = document.createElement('div');
    body.className = 'q-body';
    const name = document.createElement('div');
    name.className = 'q-name';
    name.textContent = file.__relPath || file.name;
    name.title = name.textContent;
    const bar = document.createElement('div');
    bar.className = 'q-bar';
    const fill = document.createElement('div');
    fill.className = 'q-fill';
    bar.appendChild(fill);
    const status = document.createElement('div');
    status.className = 'q-status';
    status.textContent = '等待上传';
    body.append(name, bar, status);
    row.append(thumb, body);
    if (URL.createObjectURL) {
      const u = URL.createObjectURL(file);
      thumb.src = u;
      thumb.onload = () => URL.revokeObjectURL(u);
    }
    $('queue').appendChild(row);
    queue.push({ file, row, fill, status, done: false, failed: false, pct: 0, prefix: uploadPrefix || null });
    updateUploadFab();
  }

  async function uploadFile(file, item, dupCtx) {
    const { fill, status, prefix } = item;
    const relPath = file.__relPath || file.name;
    let key = makeKey(relPath, file.type, prefix);
    if ((await headP(key)).state === 'exists') {
      let action = dupCtx.action;
      if (!action) {
        const res = await askDialog(`目标位置已有「${relPath}」，如何处理？`, { cancel: '跳过', file, oldKey: key });
        action = res.action;
        if (res.applyAll) dupCtx.action = action;
      }
      if (action === 'cancel') return { skipped: true };
      if (action === 'rename') key = await autoRenameKey(key);
    }
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    return new Promise((resolve, reject) => {
      cos.uploadFile({
        Bucket: cfg.bucket,
        Region: cfg.region,
        Key: key,
        Body: file,
        ContentType: file.type || TYPE_BY_EXT[ext] || 'image/png',
        onProgress(p) {
          const pct = Math.min(100, Math.round((p.percent || 0) * 100));
          item.pct = pct;
          fill.style.width = pct + '%';
          status.textContent = pct >= 100 ? '处理中…' : pct + '%';
          updateUploadFab();
        },
      }, (err) => {
        if (err) return reject(err);
        resolve(publicUrl(key));
      });
    });
  }

  async function processQueue() {
    if (processing) return;
    processing = true;
    let uploadedAny = false;
    const dupCtx = { action: null };
    try {
      for (const item of queue) {
        if (item.done) continue;
        item.pct = 0;
        item.status.textContent = '上传中…';
        try {
          const url = await uploadFile(item.file, item, dupCtx);
          item.done = true;
          if (url && url.skipped) {
            item.status.textContent = '已跳过（同名文件）';
            item.row.classList.add('done');
            updateUploadFab();
            await sleep(350);
            item.row.remove();
            continue;
          }
          uploadedAny = true;
          item.pct = 100;
          item.fill.style.width = '100%';
          item.status.textContent = '完成';
          item.row.classList.add('done');
          addResult(url, item.file.name);
          saveHistory(url, item.file.name);
          updateUploadFab();
          await sleep(350);
          item.row.remove();
        } catch (e) {
          console.error('[picbed] 上传失败:', e);
          item.failed = true;
          item.status.textContent = '失败：' + errMsg(e) + '（点此重试）';
          item.row.classList.add('error');
          item.status.onclick = () => {
            item.status.onclick = null;
            item.failed = false;
            item.status.textContent = '重试中…';
            item.row.classList.remove('error');
            updateUploadFab();
            processQueue();
          };
          updateUploadFab();
        }
      }
    } finally {
      processing = false;
      updateUploadFab();
      if (uploadedAny) loadGallery(true);
    }
  }

  // ---------- 结果 ----------
  const sessionResults = [];
  function addResult(url, name) {
    sessionResults.unshift({ url, name });
    $('resultsSection').hidden = false;
    const box = document.createElement('div');
    box.className = 'result';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = url;
    img.onerror = () => img.remove();
    const info = document.createElement('div');
    info.className = 'result-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'result-name';
    nameEl.textContent = name;
    const btns = document.createElement('div');
    btns.className = 'result-btns';
    const links = makeLinks(url, name);
    FMT.forEach((k) => {
      const b = document.createElement('button');
      b.className = 'btn small';
      b.textContent = FMT_LABEL[k];
      b.onclick = () => copyText(links[k]);
      btns.appendChild(b);
    });
    info.append(nameEl, btns);
    box.append(img, info);
    $('results').prepend(box);
    updateUploadFab();
  }

  function copyAllResults() {
    if (!sessionResults.length) return toast('还没有上传结果');
    copyText(sessionResults.map((r) => makeLinks(r.url, r.name)[cfg.format]).join('\n'));
  }

  // ---------- 历史 ----------
  const HISTORY_KEY = 'picbed_history';
  let history = [];
  try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (e) {}

  function persistHistory() { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }

  function saveHistory(url, name) {
    history.unshift({ url, name, time: Date.now() });
    history = history.slice(0, 200);
    persistHistory();
    renderHistory();
  }

  function renderHistory() {
    const ul = $('historyList');
    ul.textContent = '';
    if (!history.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '暂无记录';
      ul.appendChild(li);
      updateUploadFab();
      return;
    }
    for (const h of history) {
      const li = document.createElement('li');
      const name = document.createElement('span');
      name.className = 'h-name';
      name.textContent = h.name || h.url.split('/').pop();
      name.title = h.url;
      const time = document.createElement('span');
      time.className = 'h-time';
      time.textContent = new Date(h.time).toLocaleString();
      const btns = document.createElement('span');
      btns.className = 'h-btns';
      const links = makeLinks(h.url, h.name);
      FMT.forEach((k) => {
        const b = document.createElement('button');
        b.className = 'btn small';
        b.textContent = FMT_LABEL[k];
        b.onclick = () => copyText(links[k]);
        btns.appendChild(b);
      });
      const del = document.createElement('button');
      del.className = 'btn small danger';
      del.textContent = '✕';
      del.title = '删除记录';
      del.onclick = () => { history = history.filter((x) => x !== h); persistHistory(); renderHistory(); };
      btns.appendChild(del);
      li.append(name, time, btns);
      ul.appendChild(li);
    }
    updateUploadFab();
  }

  // ---------- 上传状态面板（右下悬浮按钮） ----------
  // 视图模式：'admin' = 管理视图，'public' = 游客公开视图（见 switchView）
  // 本机已保存密码则直接进管理视图，否则默认展示公开画廊
  let view = (cfg.password && cfg.worker) ? 'admin' : 'public';
  let panelOpen = false;

  function openPanel() {
    if (view !== 'admin') return;
    panelOpen = true;
    $('uploadPanel').hidden = false;
    $('panelBackdrop').hidden = false;
  }

  function closePanel() {
    panelOpen = false;
    $('uploadPanel').hidden = true;
    $('panelBackdrop').hidden = true;
  }

  function togglePanel() { if (panelOpen) closePanel(); else openPanel(); }

  function updateUploadFab() {
    const uploading = queue.filter((it) => !it.done && !it.failed);
    const failed = queue.filter((it) => !it.done && it.failed);
    const hasContent = !!(uploading.length || failed.length || sessionResults.length || history.length);
    $('uploadFab').hidden = view !== 'admin' || !hasContent;
    $('uploadFab').classList.toggle('idle', !uploading.length && !failed.length);
    const badge = $('fabBadge');
    if (uploading.length) {
      const avg = Math.round(uploading.reduce((s, it) => s + (it.pct || 0), 0) / uploading.length);
      badge.className = 'fab-badge';
      badge.textContent = avg + '%';
      $('panelBadge').textContent = `上传中 ${uploading.length} 个`;
    } else if (failed.length) {
      badge.className = 'fab-badge';
      badge.textContent = '失败 ' + failed.length;
      $('panelBadge').textContent = `失败 ${failed.length} 个（点列表中的失败项可重试）`;
    } else if (sessionResults.length) {
      badge.className = 'fab-badge ok';
      badge.textContent = '完成 ' + sessionResults.length;
      $('panelBadge').textContent = `本次已完成 ${sessionResults.length} 个`;
    } else {
      badge.className = 'fab-badge idle';
      badge.textContent = '';
      $('panelBadge').textContent = '';
    }
    // 没有可展示的内容时收起面板（不调用 closePanel，避免递归）
    if (!hasContent && panelOpen) {
      panelOpen = false;
      $('uploadPanel').hidden = true;
      $('panelBackdrop').hidden = true;
    }
  }

  // ---------- 相册 ----------
  let galleryMarker = '';
  let galleryLoaded = 0;
  let galleryPrefix = cfg.prefix + '/'; // 当前目录（尾部带 /）
  let selectMode = false;
  const selectedKeys = new Set();
  let anchorFig = null; // Shift 连选的锚点卡片

  // 公开画廊：publicPrefix 是相对 cfg.prefix 的路径（'' 或 'xxx/'）
  let publicPrefix = '';
  let publicMarker = '';
  let publicLoaded = 0;
  const publicKeys = new Set(); // 已公开图片的相对键（相对 cfg.prefix）

  function pubRelOf(key) {
    const root = cfg.prefix + '/';
    return key.startsWith(root) ? key.slice(root.length) : key;
  }
  // 公开标记键：img/_picbed/public/<相对键>（零字节对象）
  function pubMarkerOf(key) {
    return cfg.prefix + '/_picbed/public/' + pubRelOf(key);
  }

  function getBucketP(params) {
    return new Promise((resolve, reject) => {
      cos.getBucket({ Bucket: cfg.bucket, Region: cfg.region, ...params }, (err, data) => (err ? reject(err) : resolve(data)));
    });
  }
  function copyP(sourceKey, targetKey) {
    return new Promise((resolve, reject) => {
      cos.sliceCopyFile({
        Bucket: cfg.bucket,
        Region: cfg.region,
        Key: targetKey,
        CopySource: `${cfg.bucket}.cos.${cfg.region}.myqcloud.com/${sourceKey.split('/').map(encodeURIComponent).join('/')}`,
      }, (err, data) => (err ? reject(err) : resolve(data)));
    });
  }
  function putP(key, body) {
    return new Promise((resolve, reject) => {
      cos.putObject({ Bucket: cfg.bucket, Region: cfg.region, Key: key, Body: body || '' }, (err, data) => (err ? reject(err) : resolve(data)));
    });
  }
  function deleteKeysP(keys) {
    return new Promise((resolve, reject) => {
      const chunks = [];
      for (let i = 0; i < keys.length; i += 500) chunks.push(keys.slice(i, i + 500));
      let idx = 0;
      const next = () => {
        if (idx >= chunks.length) return resolve();
        cos.deleteMultipleObject({
          Bucket: cfg.bucket,
          Region: cfg.region,
          Objects: chunks[idx].map((k) => ({ Key: k })),
        }, (err) => {
          if (err) return reject(err);
          idx++;
          next();
        });
      };
      next();
    });
  }
  function headP(key) {
    return new Promise((resolve) => {
      cos.headObject({ Bucket: cfg.bucket, Region: cfg.region, Key: key }, (err, data) => {
        if (err) return resolve({ state: err.statusCode === 404 ? 'free' : 'error' });
        const size = data
          ? Number((data.headers && data.headers['content-length']) || data['content-length']) || 0
          : 0;
        resolve({ state: 'exists', size });
      });
    });
  }

  // 内容一致性检查：先比大小，大小相同则下载远端逐字节比对
  async function compareFiles(file, key) {
    const head = await headP(key);
    if (head.state !== 'exists') return 'unknown';
    if (head.size !== file.size) return 'diff';
    let remoteBuf;
    try {
      const resp = await fetch(publicUrl(key));
      if (!resp.ok) return 'size-same';
      remoteBuf = new Uint8Array(await resp.arrayBuffer());
    } catch (e) {
      return 'size-same';
    }
    const localBuf = new Uint8Array(await file.arrayBuffer());
    if (remoteBuf.length !== localBuf.length) return 'diff';
    for (let i = 0; i < localBuf.length; i++) {
      if (remoteBuf[i] !== localBuf[i]) return 'diff';
    }
    return 'same';
  }

  function askDialog(message, opts) {
    return new Promise((resolve) => {
      $('dupMsg').textContent = message;
      $('dupOverwrite').textContent = (opts && opts.overwrite) || '覆盖';
      $('dupRename').textContent = (opts && opts.rename) || '自动重命名';
      $('dupSkip').textContent = (opts && opts.cancel) || '取消';
      $('dupPreview').hidden = !(opts && opts.file);
      $('dupApplyAll').checked = false;
      if (opts && opts.file) {
        $('dupNewImg').src = URL.createObjectURL(opts.file);
        $('dupOldImg').src = publicUrl(opts.oldKey);
        compareFiles(opts.file, opts.oldKey).then((r) => {
          const el = $('dupCompare');
          if (r === 'same') {
            el.textContent = '✓ 两个文件内容完全一致';
            el.className = 'dup-compare same';
          } else if (r === 'diff') {
            el.textContent = '✗ 两个文件内容不同（覆盖会替换现有文件）';
            el.className = 'dup-compare diff';
          } else if (r === 'size-same') {
            el.textContent = '大小一致，但无法完成内容比对';
            el.className = 'dup-compare';
          } else {
            el.textContent = '';
            el.className = 'dup-compare';
          }
        });
      } else {
        $('dupCompare').textContent = '';
        $('dupCompare').className = 'dup-compare';
      }
      $('dupDialog').hidden = false;
      const answer = (action) => {
        $('dupDialog').hidden = true;
        resolve({ action, applyAll: $('dupApplyAll').checked });
      };
      $('dupOverwrite').onclick = () => answer('overwrite');
      $('dupRename').onclick = () => answer('rename');
      $('dupSkip').onclick = () => answer('cancel');
    });
  }

  async function autoRenameKey(key) {
    const dot = key.lastIndexOf('.');
    const stem = dot > 0 ? key.slice(0, dot) : key;
    const ext = dot > 0 ? key.slice(dot) : '';
    for (let n = 1; n < 1000; n++) {
      const cand = `${stem} (${n})${ext}`;
      if ((await headP(cand)).state === 'free') return cand;
    }
    return `${stem}_${Date.now()}${ext}`;
  }

  async function resolveCollisions(pairs) {
    const collided = [];
    for (const p of pairs) {
      if ((await headP(p.targetKey)).state === 'exists') collided.push(p.targetKey);
    }
    if (!collided.length) return { action: 'go', map: {} };
    const { action } = await askDialog(`目标位置已有 ${collided.length} 个同名文件，如何处理？`, { cancel: '取消' });
    if (action === 'cancel') return { action: 'cancel', map: {} };
    if (action === 'overwrite') return { action: 'go', map: {} };
    const map = {};
    for (const t of collided) map[t] = await autoRenameKey(t);
    return { action: 'go', map };
  }

  async function listAllKeys(prefix) {
    const all = [];
    let marker = '';
    for (;;) {
      const data = await getBucketP({ Prefix: prefix, MaxKeys: 1000, Marker: marker });
      all.push(...(data.Contents || []).map((c) => c.Key));
      if (String(data.IsTruncated) === 'true' && data.NextMarker) marker = data.NextMarker;
      else break;
    }
    return all;
  }

  // 相册路径：允许用 / 分隔多级目录，逐段清洗非法字符并过滤 . 与 ..
  function sanitizePath(input) {
    return String(input || '')
      .replace(/\\/g, '/')
      .split('/')
      .map((s) => sanitizeSegment(s).slice(0, 40))
      .filter(Boolean)
      .join('/');
  }

  // 保留命名空间：img/_picbed/ 存公开标记，禁止作为相册名/上传目录使用
  const RESERVED_SEGMENT = '_picbed';

  function hasReservedSegment(path) {
    return String(path || '')
      .replace(/\\/g, '/')
      .split('/')
      .some((s) => sanitizeSegment(s).toLowerCase() === RESERVED_SEGMENT);
  }

  // 逐级创建相册标记，保证多级路径下每一层都是真实存在的相册
  async function ensureAlbumPath(prefix) {
    const root = cfg.prefix + '/';
    if (!prefix || !prefix.startsWith(root)) return;
    const rel = prefix.slice(root.length).replace(/\/+$/, '');
    if (!rel || hasReservedSegment(rel)) return;
    let acc = root;
    for (const seg of rel.split('/')) {
      acc += seg + '/';
      await putP(acc, '');
    }
    invalidateAlbumTree();
  }

  // 解析「新建 / 移动 / 重命名」输入的目标目录：
  //   留空 = 图床根目录；以 / 开头 = 相对图床根目录；否则相对当前目录
  //   命中保留命名空间时返回 null
  function parseTargetPrefix(raw) {
    const text = String(raw == null ? '' : raw).trim();
    const abs = text.startsWith('/');
    const path = sanitizePath(text.replace(/^\/+/, ''));
    if (hasReservedSegment(path)) return null;
    if (!path) return cfg.prefix + '/';
    return abs ? cfg.prefix + '/' + path + '/' : galleryPrefix + path + '/';
  }

  // ---------- 自定义弹窗 ----------
  // 统一的文本输入弹窗：确定返回输入值（未输入返回空串），取消返回 null
  function promptDialog(opts) {
    const o = opts || {};
    return new Promise((resolve) => {
      const dlg = $('promptDialog');
      const input = $('promptInput');
      $('promptTitle').textContent = o.title || '输入';
      $('promptLabel').textContent = o.label || '内容';
      $('promptHelp').textContent = o.help || '';
      $('promptOk').textContent = o.confirmText || '确定';
      input.value = o.value || '';
      input.placeholder = o.placeholder || '';
      $('promptTreeWrap').hidden = !o.tree;
      let done = false;
      const finish = (val) => {
        if (done) return;
        done = true;
        dlg.hidden = true;
        resolve(val);
      };
      if (o.tree) {
        // 点击树节点：填入路径；若输入框里已有一个纯名称（如重命名时的相册名）则保留在末尾
        const onPick = (p) => {
          const cur = input.value.trim();
          const keep = cur && !cur.includes('/') ? cur : '';
          input.value = keep ? p + keep : p;
          input.focus();
        };
        // 自动补全的查询词取「目录部分」，纯名称不参与过滤（否则重命名时树会被自己的名字过滤掉）
        const treeQuery = () => {
          const v = input.value.trim().replace(/^\/+/, '');
          return v.endsWith('/') ? v : v.split('/').slice(0, -1).join('/');
        };
        const refresh = () => renderAlbumTree(treeQuery, onPick);
        input.oninput = refresh;
        refresh();
      } else {
        input.oninput = null;
      }
      input.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); finish(input.value); }
      };
      $('promptOk').onclick = () => finish(input.value);
      $('promptCancel').onclick = () => finish(null);
      dlg.onclick = (e) => { if (e.target === dlg) finish(null); };
      dlg.hidden = false;
      input.focus();
      input.select();
    });
  }

  // 统一的确认弹窗：确定返回 true，取消返回 false
  function confirmDialog(opts) {
    const o = opts || {};
    return new Promise((resolve) => {
      const dlg = $('confirmDialog');
      $('confirmTitle').textContent = o.title || '确认';
      $('confirmMsg').textContent = o.message || '';
      const ok = $('confirmOk');
      ok.textContent = o.okText || '删除';
      ok.className = o.danger === false ? 'btn primary' : 'btn danger-solid';
      let done = false;
      const finish = (val) => {
        if (done) return;
        done = true;
        dlg.hidden = true;
        resolve(val);
      };
      ok.onclick = () => finish(true);
      $('confirmCancel').onclick = () => finish(false);
      dlg.onclick = (e) => { if (e.target === dlg) finish(false); };
      dlg.hidden = false;
      ok.focus();
    });
  }

  // ---------- 相册目录树（弹窗内补全用） ----------
  let albumTreePaths = null;   // 扁平的相册路径数组（相对 cfg.prefix）
  let albumTreeLoading = null;

  function invalidateAlbumTree() { albumTreePaths = null; }

  // 从 /list 全量结果推导相册路径：标记对象（尾 /）直接成路径，
  // 普通对象则补上其所有祖先目录（覆盖文件夹上传产生的隐式目录）
  function buildAlbumPaths(items) {
    const root = cfg.prefix + '/';
    const set = new Set();
    for (const it of items) {
      const key = (it && it.key) || '';
      if (!key.startsWith(root)) continue;
      const rel = key.slice(root.length);
      if (!rel || hasReservedSegment(rel)) continue; // 保留命名空间不进目录树
      if (rel.endsWith('/')) { set.add(rel); continue; }
      const dirs = rel.split('/').slice(0, -1);
      let acc = '';
      for (const d of dirs) { acc += d + '/'; set.add(acc); }
    }
    return [...set].sort();
  }

  async function ensureAlbumTree() {
    if (albumTreePaths) return albumTreePaths;
    if (albumTreeLoading) return albumTreeLoading;
    albumTreeLoading = (async () => {
      const items = [];
      let marker = '';
      for (;;) {
        const res = await fetch(`${cfg.worker}/list${marker ? '?marker=' + encodeURIComponent(marker) : ''}`, { headers: listHeaders() });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || '加载相册列表失败');
        items.push(...(data.items || []));
        if (data.truncated && data.nextMarker) marker = data.nextMarker;
        else break;
      }
      albumTreePaths = buildAlbumPaths(items);
      return albumTreePaths;
    })();
    try {
      return await albumTreeLoading;
    } finally {
      albumTreeLoading = null;
    }
  }

  // 扁平路径 → 嵌套树
  function albumTreeFromPaths(paths) {
    const root = { name: '', rel: '', children: new Map() };
    for (const p of paths) {
      let node = root;
      let acc = '';
      for (const seg of p.replace(/\/+$/, '').split('/')) {
        if (!seg) continue;
        acc += seg + '/';
        if (!node.children.has(seg)) node.children.set(seg, { name: seg, rel: acc, children: new Map() });
        node = node.children.get(seg);
      }
    }
    return root;
  }

  // 递归渲染一级节点；子层懒展开
  function appendTreeLevel(node, container, onPick) {
    const kids = [...node.children.values()];
    if (!kids.length) return;
    const ul = document.createElement('ul');
    for (const k of kids) {
      const li = document.createElement('li');
      const row = document.createElement('div');
      row.className = 'tree-row';
      const sub = document.createElement('div');
      sub.hidden = true;
      const caret = document.createElement('button');
      caret.type = 'button';
      caret.className = 'tree-caret' + (k.children.size ? '' : ' leaf');
      caret.textContent = '▶';
      if (k.children.size) {
        caret.onclick = (e) => {
          e.stopPropagation();
          if (sub.hidden && !sub.dataset.built) {
            sub.dataset.built = '1';
            appendTreeLevel(k, sub, onPick);
          }
          sub.hidden = !sub.hidden;
          caret.classList.toggle('open', !sub.hidden);
        };
      }
      const label = document.createElement('button');
      label.type = 'button';
      label.className = 'tree-label';
      label.textContent = k.name;
      label.title = '/' + k.rel;
      label.onclick = () => onPick('/' + k.rel);
      row.append(caret, label);
      li.append(row, sub);
      ul.appendChild(li);
    }
    container.appendChild(ul);
  }

  // 渲染目录树：输入框有内容时改为匹配结果列表（自动补全），否则展示完整树
  let treeRenderSeq = 0;
  async function renderAlbumTree(getQuery, onPick) {
    const seq = ++treeRenderSeq;
    const box = $('promptTree');
    const empty = (msg) => {
      box.textContent = '';
      const div = document.createElement('div');
      div.className = 'tree-empty';
      div.textContent = msg;
      box.appendChild(div);
    };
    let paths;
    try {
      paths = await ensureAlbumTree();
    } catch (e) {
      empty('无法加载相册列表，可手动输入路径');
      return;
    }
    if (seq !== treeRenderSeq) return; // 已有更新的渲染，丢弃本次
    if (!paths.length) { empty('还没有相册，直接输入路径即可创建'); return; }
    const query = String(getQuery ? getQuery() : '').trim().replace(/^\/+/, '').toLowerCase();
    box.textContent = '';
    if (query) {
      const hits = paths.filter((p) => p.toLowerCase().includes(query));
      if (!hits.length) { empty('没有匹配的相册'); return; }
      const ul = document.createElement('ul');
      for (const p of hits.slice(0, 50)) {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tree-label';
        b.textContent = p;
        b.onclick = () => onPick('/' + p);
        li.appendChild(b);
        ul.appendChild(li);
      }
      box.appendChild(ul);
      return;
    }
    appendTreeLevel(albumTreeFromPaths(paths), box, onPick);
  }

  async function loadGallery(reset) {
    if (!needWorker()) return;
    if (reset) {
      galleryMarker = '';
      galleryLoaded = 0;
      $('galleryGrid').textContent = '';
      clearSelection();
    }
    const btn = $('loadMore');
    btn.disabled = true;
    btn.textContent = '加载中…';
    try {
      const data = await getBucketP({
        Prefix: galleryPrefix,
        Delimiter: '/',
        MaxKeys: cfg.maxKeys || 500,
        Marker: galleryMarker,
      });
      renderBreadcrumb();
      if (reset) {
        const reserved = cfg.prefix + '/_picbed/';
        for (const f of data.CommonPrefixes || []) {
          if (f.Prefix === reserved) continue; // 公开标记的保留命名空间，管理视图不展示
          $('galleryGrid').appendChild(renderFolderTile(f.Prefix));
        }
      }
      const items = (data.Contents || [])
        .filter((c) => !c.Key.endsWith('/') && c.Key !== galleryPrefix)
        .reverse();
      for (const it of items) $('galleryGrid').appendChild(renderGridItem({ key: it.Key }));
      refreshPublicIndicators(); // 公开状态可能先于/后于相册加载完成，渲染后再同步一次
      galleryLoaded += items.length;
      $('galleryCount').textContent = `已显示 ${galleryLoaded} 张`;
      galleryMarker = String(data.IsTruncated) === 'true' ? data.NextMarker : '';
      btn.hidden = !galleryMarker;
    } catch (e) {
      console.error('[picbed] 相册加载失败:', e.message || e);
      toast('相册加载失败：' + ((e && e.error && e.error.Message) || e.message || e), true);
    } finally {
      btn.disabled = false;
      btn.textContent = '加载更多';
    }
  }

  // ---------- 公开画廊（游客视图） ----------
  function publicGridHint(msg) {
    $('galleryGrid').textContent = '';
    const div = document.createElement('div');
    div.className = 'gallery-empty';
    div.textContent = msg;
    $('galleryGrid').appendChild(div);
  }

  async function loadPublicGallery(reset) {
    if (reset) {
      publicMarker = '';
      publicLoaded = 0;
      $('galleryGrid').textContent = '';
    }
    if (!cfg.worker) {
      renderBreadcrumb();
      publicGridHint('还没有配置图片服务地址，无法加载公开画廊。');
      return;
    }
    const btn = $('loadMore');
    btn.disabled = true;
    btn.textContent = '加载中…';
    try {
      const q = new URLSearchParams();
      if (publicPrefix) q.set('prefix', publicPrefix);
      if (publicMarker) q.set('marker', publicMarker);
      const res = await fetch(`${cfg.worker}/public?${q.toString()}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      renderBreadcrumb();
      if (reset) {
        for (const folder of data.folders || []) $('galleryGrid').appendChild(renderPublicFolderTile(folder));
      }
      const files = (data.files || []).slice().reverse();
      for (const f of files) {
        $('galleryGrid').appendChild(renderGridItem({ key: cfg.prefix + '/' + f.key }, 'public'));
      }
      publicLoaded += files.length;
      $('galleryCount').textContent = `已显示 ${publicLoaded} 张公开图片`;
      publicMarker = data.truncated && data.nextMarker ? data.nextMarker : '';
      btn.hidden = !publicMarker;
      if (reset && !publicMarker && !publicLoaded && !(data.folders || []).length) {
        publicGridHint(publicPrefix ? '这个相册里还没有公开的图片。' : '还没有公开的图片。管理员可在「我的相册」里点图片右上角的 🌑 设为公开。');
      }
    } catch (e) {
      console.error('[picbed] 公开画廊加载失败:', e.message || e);
      if (reset) publicGridHint('公开画廊加载失败：' + (e.message || '无法连接服务') + '（若刚更新过页面，请确认 Worker 已重新部署）');
      toast('公开画廊加载失败：' + (e.message || e), true);
    } finally {
      btn.disabled = false;
      btn.textContent = '加载更多';
    }
  }

  function renderPublicFolderTile(relPrefix) {
    const name = relPrefix.replace(/\/+$/, '').split('/').pop() || relPrefix;
    const fig = document.createElement('figure');
    fig.className = 'folder-tile';
    const icon = document.createElement('div');
    icon.className = 'folder-icon';
    icon.textContent = '📁';
    const cap = document.createElement('figcaption');
    cap.textContent = name;
    fig.append(icon, cap);
    fig.onclick = () => { publicPrefix = relPrefix; loadPublicGallery(true); };
    return fig;
  }

  // ---------- 公开状态（管理视图） ----------
  // 拉取全部公开标记，填充 publicKeys（以 /public 接口为准，无需密码）
  // 必须带 flat=1：否则子相册里的标记会被折叠进 folders，公开状态读不全
  async function loadPublicMarkers() {
    if (!cfg.worker) return;
    const next = new Set();
    let marker = '';
    for (;;) {
      const q = new URLSearchParams();
      q.set('flat', '1');
      if (marker) q.set('marker', marker);
      const res = await fetch(`${cfg.worker}/public?${q.toString()}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      for (const f of data.files || []) next.add(f.key);
      if (data.truncated && data.nextMarker) marker = data.nextMarker;
      else break;
    }
    publicKeys.clear();
    next.forEach((k) => publicKeys.add(k));
    refreshPublicIndicators();
    updateBulkBar();
  }

  function refreshPublicIndicators() {
    document.querySelectorAll('#galleryGrid figure[data-key]').forEach((fig) => {
      const on = publicKeys.has(pubRelOf(fig.dataset.key));
      const btn = fig.querySelector('.pub-toggle');
      if (btn) {
        btn.textContent = on ? '🌍' : '🌑';
        btn.title = on ? '已公开（点击取消公开）' : '设为公开（游客可见）';
        btn.classList.toggle('on', on);
      }
      const badge = fig.querySelector('.pub-badge');
      if (badge) badge.hidden = !on; // 文件名前的 pub 徽标
    });
    if (lightboxItem && !$('togglePublicBtn').hidden) updateLightboxPublicBtn();
  }

  async function togglePublic(key) {
    const rel = pubRelOf(key);
    const btn = document.querySelector(`#galleryGrid figure[data-key="${CSS.escape(key)}"] .pub-toggle`);
    if (btn) btn.disabled = true;
    try {
      if (publicKeys.has(rel)) {
        await deleteKeysP([pubMarkerOf(key)]);
        publicKeys.delete(rel);
        toast('已取消公开');
      } else {
        await putP(pubMarkerOf(key), '');
        publicKeys.add(rel);
        toast('已设为公开，游客可在公开画廊看到');
      }
      refreshPublicIndicators();

  // ---------- 拖拽移动（图片 / 相册） ----------
  let dragPayload = null;
  let uploadTargetPrefix = null; // 文件上传悬停的目标相册（null = 当前相册）
  let uploadHoverTimer = null;

  function hasFilePayload(dt) {
    return !!(dt && dt.types && [...dt.types].includes('Files'));
  }

  function canDropInto(targetPrefix) {
    if (!dragPayload) return false;
    if (dragPayload.kind === 'folder') {
      // 不能拖进自己或自己的子相册（否则会无限自我复制）
      return !targetPrefix.startsWith(dragPayload.prefix);
    }
    return targetPrefix !== galleryPrefix; // 图片已在当前目录，拖回当前目录是空操作
  }

  function makeDropTarget(el, getTargetPrefix, allowUpload) {
    el.addEventListener('dragover', (e) => {
      if (dragPayload) {
        if (!canDropInto(getTargetPrefix())) return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        el.classList.add('drop-hover');
        return;
      }
      // 外部文件拖到相册卡片上：悬停即把上传目标切换为该相册
      if (allowUpload && view === 'admin' && hasFilePayload(e.dataTransfer)) {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'copy';
        el.classList.add('drop-hover');
        clearTimeout(uploadHoverTimer);
        if (uploadTargetPrefix !== getTargetPrefix()) {
          uploadTargetPrefix = getTargetPrefix();
          updateDropLabel();
        }
      }
    });
    el.addEventListener('dragleave', () => {
      el.classList.remove('drop-hover');
      if (!dragPayload && allowUpload) {
        // 移到别的卡片上时先由对方的 dragover 接管，这里延迟复位避免相互打架
        const t = getTargetPrefix();
        clearTimeout(uploadHoverTimer);
        uploadHoverTimer = setTimeout(() => {
          if (uploadTargetPrefix === t) {
            uploadTargetPrefix = null;
            updateDropLabel();
          }
        }, 60);
      }
    });
    el.addEventListener('drop', async (e) => {
      el.classList.remove('drop-hover');
      if (dragPayload) {
        if (!canDropInto(getTargetPrefix())) return;
        e.preventDefault();
        e.stopPropagation();
        performDrop(getTargetPrefix());
        return;
      }
      if (allowUpload && view === 'admin' && hasFilePayload(e.dataTransfer)) {
        e.preventDefault();
        e.stopPropagation();
        uploadTargetPrefix = null;
        updateDropLabel();
        const files = await collectFromDataTransfer(e.dataTransfer);
        if (files.length) addFiles(files, getTargetPrefix());
      }
    });
  }

  async function performDrop(targetPrefix) {
    const payload = dragPayload;
    dragPayload = null;
    if (!payload) return;
    if (payload.kind === 'folder') {
      const name = payload.prefix.slice(0, -1).split('/').pop();
      const parent = payload.prefix.slice(0, -(name.length + 1));
      if (targetPrefix === parent) return toast('已经在该位置', true);
      try {
        await ensureAlbumPath(targetPrefix);
      } catch (e) {}
      await moveFolder(payload.prefix, targetPrefix + name + '/');
    } else {
      await moveImagesTo(payload.keys, targetPrefix);
    }
  }

  async function moveImagesTo(keys, targetPrefix) {
    if (!keys || !keys.length) return;
    if (targetPrefix === galleryPrefix) return toast('图片已经在该目录', true);
    const pairs = keys.map((k) => ({ key: k, targetKey: targetPrefix + k.split('/').pop() }));
    const { action, map } = await resolveCollisions(pairs);
    if (action === 'cancel') return toast('已取消');
    try {
      await ensureAlbumPath(targetPrefix);
      for (let i = 0; i < pairs.length; i++) {
        await copyP(pairs[i].key, map[pairs[i].targetKey] || pairs[i].targetKey);
        if (i % 5 === 0 || i === pairs.length - 1) toast(`移动中 ${i + 1}/${pairs.length}`);
      }
      // 公开标记跟随图片移动（保持公开状态），旧标记随原图一起删除
      const movedPublic = pairs.filter((p) => publicKeys.has(pubRelOf(p.key)));
      const oldMarkers = movedPublic.map((p) => pubMarkerOf(p.key));
      for (const p of movedPublic) {
        const newKey = map[p.targetKey] || p.targetKey;
        await putP(pubMarkerOf(newKey), '');
        publicKeys.delete(pubRelOf(p.key));
        publicKeys.add(pubRelOf(newKey));
      }
      await deleteKeysP(keys.concat(oldMarkers));
      toast('移动完成');
      clearSelection();
      loadGallery(true);
    } catch (err) {
      toast('移动失败（已复制的文件保留在目标相册）：' + (err.message || err), true);
    }
  }

  function renderBreadcrumb() {
    const el = $('galleryPath');
    el.textContent = '';
    const isPublic = view === 'public';
    const rootPrefix = cfg.prefix + '/';
    const relCurrent = isPublic ? publicPrefix : galleryPrefix.slice(rootPrefix.length);
    const go = (prefix) => {
      if (isPublic) {
        publicPrefix = prefix.slice(rootPrefix.length);
        loadPublicGallery(true);
      } else {
        galleryPrefix = prefix;
        loadGallery(true);
      }
    };
    const crumb = (label, prefix, isCurrent) => {
      const b = document.createElement('button');
      b.className = 'crumb' + (isCurrent ? ' current' : '');
      b.textContent = label;
      if (!isCurrent) b.onclick = () => go(prefix);
      if (!isPublic) makeDropTarget(b, () => prefix); // 可把图片/相册拖到上级目录
      el.appendChild(b);
    };
    const sep = () => {
      const s = document.createElement('span');
      s.className = 'sep';
      s.textContent = '/';
      el.appendChild(s);
    };
    crumb(isPublic ? '🏠 公开画廊' : '🏠 全部', rootPrefix, relCurrent === '');
    if (relCurrent) {
      let acc = rootPrefix;
      const parts = relCurrent.replace(/\/$/, '').split('/');
      parts.forEach((p, i) => {
        sep();
        acc += p + '/';
        crumb(p, acc, i === parts.length - 1);
      });
    }
  }

  async function deleteAlbumDialog(prefix, name) {
    try {
      const keys = await listAllKeys(prefix);

      const files = keys.filter((k) => !k.endsWith('/'));
      // 子相册（含空相册）也有零字节标记对象，必须一并删除，否则父相册删不掉
      const subAlbums = keys.filter((k) => k.endsWith('/') && k !== prefix).length;
      const extra = subAlbums ? ` 和 ${subAlbums} 个子相册` : '';
      const ok = await confirmDialog({

      const pubRoot = cfg.prefix + '/_picbed/public/';

        try {

        }

  async function moveFolder(oldPrefix, newPrefix) {
    if (!newPrefix || newPrefix === oldPrefix) return;
    invalidateAlbumTree(); // 目录结构即将变化
    const keys = await listAllKeys(oldPrefix);
    if (!keys.length) return toast('相册为空');
    const files = keys.filter((k) => !k.endsWith('/'));
    // 子相册标记（含空相册）也要一起搬走，否则旧相册会残留在父目录
    const markers = keys.filter((k) => k.endsWith('/') && k !== oldPrefix);
    const pairs = files.map((k) => ({ key: k, targetKey: newPrefix + k.slice(oldPrefix.length) }));
    const { action, map } = await resolveCollisions(pairs);
    if (action === 'cancel') return toast('已取消');
    // 相册内已公开的图片：标记要跟着一起搬
    const root = cfg.prefix + '/';
    const pubRoot = cfg.prefix + '/_picbed/public/';
    const oldRel = oldPrefix.slice(root.length); // 旧相册相对路径（尾部带 /）
    let pubMarkers = [];
    if (oldRel) {
      try {
        pubMarkers = await listAllKeys(pubRoot + oldRel);
      } catch (e) {
        pubMarkers = [];
      }
    }
    const total = pairs.length + markers.length + pubMarkers.length;
    let done = 0;
    try {
      for (const p of pairs) {
        await copyP(p.key, map[p.targetKey] || p.targetKey);
        done++;
        if (done % 5 === 0 || done === total) toast(`移动中 ${done}/${total}`);
      }
      for (const m of markers) {
        await putP(newPrefix + m.slice(oldPrefix.length), '');
        done++;
        if (done % 5 === 0 || done === total) toast(`移动中 ${done}/${total}`);
      }
      for (const m of pubMarkers) {
        const inside = m.slice((pubRoot + oldRel).length); // 相册内的相对键
        const oldReal = cfg.prefix + '/' + oldRel + inside;
        const newReal = map[oldReal] || newPrefix + inside;
        await putP(pubMarkerOf(newReal), '');
        publicKeys.delete(pubRelOf(oldReal));
        publicKeys.add(pubRelOf(newReal));
        done++;
        if (done % 5 === 0 || done === total) toast(`移动中 ${done}/${total}`);
      }
      await deleteKeysP(keys.concat(pubMarkers)); // 文件 + 旧相册标记 + 子相册旧标记 + 旧公开标记
      await ensureAlbumPath(newPrefix); // 多级路径逐层建好，并补上新相册标记
      toast('移动完成');
      loadGallery(true);
    } catch (err) {
      toast('移动失败（已复制的文件保留在新相册）：' + (err.message || err), true);
      loadGallery(true);
    }
  }

  // ---------- 拖动框选 ----------
  // 多选模式下，在网格空白处按下并拖动出一个选择框，框到的图片都会被选中；
  // Ctrl/Cmd 按住则为追加模式，保留原有选择
  $('galleryGrid').addEventListener('mousedown', (e) => {
    if (!selectMode || view !== 'admin' || e.button !== 0) return;
    if (e.target.closest('figure')) return; // 卡片上的按下交给点击/拖拽处理
    e.preventDefault();
    const gridRect = $('galleryGrid').getBoundingClientRect();
    const marquee = $('marquee');
    const additive = !!(e.ctrlKey || e.metaKey);
    const base = new Map(); // 按下时每张卡的选中状态（追加模式下移出框时恢复）
    selectableFigs().forEach((f) => base.set(f, f.classList.contains('selected')));
    if (!additive) clearSelection();
    document.body.classList.add('marqueeing');
    const sx = e.clientX, sy = e.clientY;
    let drawn = false;
    const paint = (cx, cy) => {
      const x1 = Math.max(gridRect.left, Math.min(sx, cx));
      const x2 = Math.min(gridRect.right, Math.max(sx, cx));
      const y1 = Math.max(gridRect.top, Math.min(sy, cy));
      const y2 = Math.min(gridRect.bottom, Math.max(sy, cy));
      marquee.hidden = false;
      marquee.style.left = x1 + 'px';
      marquee.style.top = y1 + 'px';
      marquee.style.width = Math.max(0, x2 - x1) + 'px';
      marquee.style.height = Math.max(0, y2 - y1) + 'px';
      for (const fig of selectableFigs()) {
        const r = fig.getBoundingClientRect();
        const hit = r.left < x2 && r.right > x1 && r.top < y2 && r.bottom > y1;
        setFigSelected(fig, hit || (additive && base.get(fig)));
      }
      updateBulkBar();
      drawn = true;
    };
    const stop = () => {
      document.body.classList.remove('marqueeing');
      marquee.hidden = true;
      window.removeEventListener('mousemove', paint);
      window.removeEventListener('mouseup', stop);
      if (drawn) {
        const first = selectableFigs().find((f) => f.classList.contains('selected'));
        if (first) anchorFig = first;
      }
    };
    window.addEventListener('mousemove', paint);
    window.addEventListener('mouseup', stop);
  });

  // ---------- 多选辅助（全选 / 反选 / Shift 连选） ----------
  function selectableFigs() {
    return [...document.querySelectorAll('#galleryGrid figure.selectable')];
  }
  function setFigSelected(fig, on) {
    if (on) { selectedKeys.add(fig.dataset.key); fig.classList.add('selected'); }
    else { selectedKeys.delete(fig.dataset.key); fig.classList.remove('selected'); }
  }
  function selectAllImages() {
    const figs = selectableFigs();
    if (!figs.length) return toast('当前目录没有可选的图片');
    figs.forEach((f) => setFigSelected(f, true));
    updateBulkBar();
  }
  function invertSelection() {
    selectableFigs().forEach((f) => setFigSelected(f, !selectedKeys.has(f.dataset.key)));
    updateBulkBar();
  }
  // Shift 连选：从锚点卡片到目标卡片（DOM 顺序）整段选中；Ctrl+Shift 时保留原选择
  function selectRange(fromFig, toFig, additive) {
    const figs = selectableFigs();
    const a = figs.indexOf(fromFig);
    const b = figs.indexOf(toFig);
    if (a < 0 || b < 0) return;
    if (!additive) {
      clearSelection();
      anchorFig = fromFig; // 替换选择后锚点保持不变，连续 Shift+单击可持续扩展
    }
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) setFigSelected(figs[i], true);
    updateBulkBar();
  }

  function updateBulkBar() {
    const bar = $('bulkBar');

  // 图片「移动到相册」弹窗（批量栏与右键菜单共用）
  async function moveImagesDialog(keys) {
